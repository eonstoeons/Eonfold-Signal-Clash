        this.air = true; this.st = "jump"; this.anim = "jump"; this.animT = 0;
        this.crouch = false; this.blocking = false;
        Snd.jump(); FX.dust(this.x, CFG.GROUND, 5, 1, Game.q);
        break;
      }
      this.crouch = !!this.inp.d;
      const away = this.back();
      this.blocking = !!away && !this.air;
      // proximity guard: the stance is only shown when something is actually coming
      const threat = !!(opp && opp.move && opp.moveT <= opp.move.startup + opp.move.active + 3 &&
        Math.abs(opp.x - this.x) < 210 * this.hScale);
      if (this.crouch) {
        this.st = "crouch"; this.vx = 0;
        this.anim = (away && threat) ? "blockCrouch" : "crouch";
        this.animT += dt * .9;
      } else if (away && threat) {
        this.st = "block"; this.anim = "block"; this.animT = 0; this.vx = 0;
      } else if (this.fwd()) { this.st = "walk"; this.anim = "walkF"; this.animT += dt * 1.55 * S; this.vx = 152 * S * this.dir; }
      else if (away) { this.st = "walk"; this.anim = "walkB"; this.animT += dt * 1.35 * S; this.vx = -128 * S * this.dir; }
      else { this.st = "idle"; this.anim = "idle"; this.animT += dt * .62; this.vx = 0; }
      // footstep audio
      if (this.st === "walk") {
        const ph = this.animT % 1;
        if ((ph > .2 && this.lastStep <= .2) || (ph > .7 && this.lastStep <= .7)) Snd.step();
        this.lastStep = ph;
      }
      break;
    }
  }

  /* ---- physics ---- */
  if (this.air) {
    this.vy += 1290 * dt;
    this.y += this.vy * dt;
    this.x += this.vx * dt;
    if (this.y >= 0) {
      this.y = 0; this.vy = 0; this.vx = 0; this.air = false;
      if (this.st === "attack") { this.move = null; }
      this.st = "land"; this.anim = "land"; this.animT = 0;
      Snd.land(); FX.dust(this.x, CFG.GROUND, 7, 1, Game.q);
    }
  } else if (this.st === "walk") {
    this.x += this.vx * dt;
  }
  if (this.pushV !== 0) {
    this.x += this.pushV * dt;
    this.pushV = approach(this.pushV, 0, PUSH_DECAY * dt);
  }
  // corner collision
  const half = 30 * this.hScale;
  if (this.x < half) { this.x = half; this.pushV = 0; if (this.air) this.vx = 0; }
  if (this.x > CFG.ARENA_W - half) { this.x = CFG.ARENA_W - half; this.pushV = 0; if (this.air) this.vx = 0; }
  // face the opponent when we can
  if (opp && !this.air && (this.st === "idle" || this.st === "walk" || this.st === "crouch" || this.st === "block")) {
    this.dir = opp.x >= this.x ? 1 : -1;
  }
};
Fighter.prototype.toNeutral = function () {
  this.move = null; this.chainOK = false; this.chainCount = 0;
  this.st = this.inp.d ? "crouch" : "idle";
  this.crouch = !!this.inp.d;
  this.anim = this.crouch ? "crouch" : "idle";
  this.animT = 0; this.juggle = 0;
};

/* ------------------------------ taking a hit ---------------------------- */
/* returns 0 = not blocked, 1 = deliberate block (held away), 2 = auto guard */
Fighter.prototype.canBlock = function (mv) {
  if (this.air || this.invuln > 0) return 0;
  if (this.st === "attack" || this.st === "hit" || this.st === "knockdown" ||
    this.st === "downed" || this.st === "getup" || this.st === "intro") return 0;
  const manual = !!this.back();
  // Auto guard: a fighter who is neither attacking nor pressing forward keeps a
  // passive guard. Their STANCE still decides what it covers, so crouch-only
  // attacks (sweeps, low pokes) go straight through a standing guard.
  const auto = !manual && this.autoGuard && !this.attackHeld() && !this.fwd() &&
    this.bufT <= 0 && this.st !== "land";
  if (!manual && !auto) return 0;
  const g = mv.guard;
  let ok;
  if (g === "any") ok = true;
  else if (g === "low") ok = !!this.crouch;
  else ok = !this.crouch;                // high must be guarded standing
  if (!ok) return 0;
  return manual ? 1 : 2;
};
Fighter.prototype.takeHit = function (mv, atk, hx, hy) {
  if (this.invuln > 0) return "miss";
  const blocked = this.canBlock(mv);
  const scaleIdx = Math.min(atk.combo, CFG.COMBO_SCALE.length - 1);
  const scale = CFG.COMBO_SCALE[scaleIdx];
  const typeMul = mv.type === "punch" ? atk.mods.punch : atk.mods.kick;
  const dmg = mv.dmg * atk.mods.dmg * typeMul * scale;

  if (blocked) {
    // deliberate blocks are free; the passive auto guard leaks a little chip
    if (blocked === 2 && CFG.AUTO_CHIP > 0) {
      this.hp = Math.max(0, this.hp - dmg * CFG.AUTO_CHIP);
      this.flashT = .06;
    }
    this.blockStun = mv.blockstun; this.blockStunMax = mv.blockstun;
    this.st = "blockstun"; this.anim = this.crouch ? "blockHitCrouch" : "blockHit";
    this.animT = 0; this.move = null;
    this.pushV = -this.dir * pushVel(mv.pushB / this.mods.weight);
    atk.pushV = -atk.dir * pushVel(mv.pushB * .3);
    Snd.block();
    FX.hit(hx, hy, atk.dir, mv.pow, true, Game.q);
    atk.chainOK = true;
    return "block";
  }
  // clean hit
  this.hp = Math.max(0, this.hp - dmg);
  this.flashT = .1;
  atk.combo++; atk.comboT = .95; atk.chainOK = true;
  const hitstun = Math.max(9, mv.hitstun * (1 - Math.min(atk.combo - 1, 5) * .07));
  const forceKD = mv.knockdown || this.air || atk.combo >= CFG.COMBO_HARD_CAP ||
    (mv.antiAir && this.air) || this.hp <= 0;
  const pushMul = (1 + Math.min(atk.combo, 6) * .1) / this.mods.weight;

  if (forceKD) {
    this.st = "knockdown"; this.anim = "knockdown"; this.animT = 0; this.knockT = 0;
    this.air = false; this.y = 0; this.vy = 0; this.vx = 0;
    this.pushV = -this.dir * pushVel((mv.push + 22) * pushMul);
    this.move = null; this.invuln = 0;
    Snd.knockdown(); Snd.voice(this.def.voice, "hurt");
    FX.hit(hx, hy, atk.dir, Math.max(mv.pow, .8), false, Game.q);
    FX.dust(this.x, CFG.GROUND, 10, 1, Game.q);
    if (mv.sig) {                                   // signature finisher payoff
      FX.hit(hx, hy, atk.dir, 1.2, false, Game.q);
      FX.shake(22); FX.hitStop = .2; FX.flash = .45;
      Snd.ko(); Snd.voice(atk.def.voice, "big");
      if (atk.sigName) UI.sigFlash(atk.sigName, atk.side);
    }
    atk.combo = 0; atk.comboT = 0;
  } else {
    this.stun = hitstun; this.stunMax = hitstun;
    this.st = "hit"; this.move = null;
    this.anim = this.crouch ? "hitCrouch" : (mv.box[1] < -100 ? "hitHigh" : "hitBody");
    this.animT = 0;
    this.pushV = -this.dir * pushVel(mv.push * pushMul);
    Snd[mv.sfx](mv.pow);
    if (rnd() < .55) Snd.voice(this.def.voice, "hurt");
    FX.hit(hx, hy, atk.dir, mv.pow, false, Game.q);
  }
  return "hit";
};

/* --------------------------- collision resolve --------------------------- */
function resolveHits(a, b, boxA, boxB, hbA, hbB) {
  let res = null;
  for (const [atk, def, ab, db] of [[a, b, boxA, hbB], [b, a, boxB, hbA]]) {
    if (!atk.move || atk.hitDone) continue;
    if (def.st === "knockdown" || def.st === "downed" || def.st === "intro" ||
        def.st === "win" || def.st === "lose") continue;
    const mv = atk.move;
    if (atk.moveT < mv.startup || atk.moveT > mv.startup + mv.active) continue;
    if (!atk.attackBox(ab)) continue;
    def.hurtBox(db);
    if (!boxHit(ab, db)) continue;
    atk.hitDone = true;
    const lead = atk.dir > 0 ? ab[0] + ab[2] : ab[0];        // leading edge of the strike
    const hx = clamp(lead - atk.dir * 10, db[0] - 6, db[0] + db[2] + 6);
    const hy = CFG.GROUND + clamp(ab[1] + ab[3] / 2, db[1] + 8, db[1] + db[3] - 8);
    const r = def.takeHit(mv, atk, hx, hy);
    res = res || r;
  }
  return res;
}
/* keep fighters from overlapping */
function separate(a, b) {
  const minD = CFG.PUSH_MIN * (a.hScale + b.hScale) / 2;
  const d = b.x - a.x;
  const ad = Math.abs(d);
  if (ad >= minD) return;
  const overlap = (minD - ad) / 2;
  const s = d >= 0 ? 1 : -1;
  const half = 30;
  let ax = a.x - s * overlap, bx = b.x + s * overlap;
  if (ax < half * a.hScale) { const push = half * a.hScale - ax; ax += push; bx += push; }
  if (bx > CFG.ARENA_W - half * b.hScale) { const push = bx - (CFG.ARENA_W - half * b.hScale); ax -= push; bx -= push; }
  if (ax < half * a.hScale) ax = half * a.hScale;
  if (bx > CFG.ARENA_W - half * b.hScale) bx = CFG.ARENA_W - half * b.hScale;
  a.x = ax; b.x = bx;
}

/* ------------------------------- rendering ------------------------------- */
Fighter.prototype.currentAnim = function () {
  const a = A[this.anim];
  return a || A.idle;
};
/* records the world path of the striking hand/foot during an attack so the
   swing can be drawn as a motion arc — this is what sells the impact */
Fighter.prototype.captureTrail = function (J, sy) {
  const mv = this.move;
  const live = mv && mv.limb && this.moveT >= mv.startup - 3 &&
    this.moveT <= mv.startup + mv.active + 1;
  if (!live) {
    if (this.trFade > 0) this.trFade -= .18;
    if (this.trFade <= 0) this.trN = 0;
    return;
  }
  const j = mv.limb === "hF" ? J.armF : mv.limb === "hB" ? J.armB :
    mv.limb === "fF" ? J.legF : J.legB;
  const wx = this.x + this.dir * FSCALE * j.tx;
  const wy = sy + FSCALE * j.ty;
  if (this.trN < 8) { this.trX[this.trN] = wx; this.trY[this.trN] = wy; this.trN++; }
  else {
    for (let i = 0; i < 7; i++) { this.trX[i] = this.trX[i + 1]; this.trY[i] = this.trY[i + 1]; }
    this.trX[7] = wx; this.trY[7] = wy;
  }
  this.trFade = 1;
};
Fighter.prototype.drawTrail = function (c, camX) {
  if (this.trN < 3 || this.trFade <= 0) return;
  const n = this.trN, base = this.move ? clamp(this.move.pow, .3, 1) : .5;
  c.save();
  c.globalCompositeOperation = "lighter";
  c.lineCap = "round"; c.lineJoin = "round";
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 1; i < n; i++) {
      const t = i / (n - 1);
      c.globalAlpha = (pass ? .5 : .18) * t * t * this.trFade * (.5 + base);
      c.strokeStyle = pass ? "#fff6e2" : "#ffb066";
      c.lineWidth = (pass ? 4.5 : 15) * t * (.55 + base);
      c.beginPath();
      c.moveTo(this.trX[i - 1] - camX, this.trY[i - 1]);
      c.lineTo(this.trX[i] - camX, this.trY[i]);
      c.stroke();
    }
  }
  c.globalAlpha = 1;
  c.restore();
};
Fighter.prototype.draw = function (c, camX) {
  const an = this.currentAnim();
  sampleAnim(an, this.animT, this.pose);
  // per-character stance flavour on locomotion only
  const so = this.stanceOff;
  if (so && (this.anim === "idle" || this.anim === "walkF" || this.anim === "walkB")) {
    this.pose.ry += so.ry; this.pose.sp += so.sp;
    this.pose.hFx += so.hFx; this.pose.hFy += so.hFy;
    this.pose.fFx += so.fFx; this.pose.fBx += so.fBx;
  }
  const sx = this.x - camX, sy = CFG.GROUND + this.y;
  const plant = !this.air && this.st !== "knockdown" && this.st !== "downed" &&
    this.st !== "getup" && this.st !== "lose";
  // contact shadow
  const sh = clamp(1 + this.y / 190, .25, 1);
  c.save();
  c.globalAlpha = .38 * sh;
  c.fillStyle = "#000";
  c.beginPath(); c.ellipse(sx, CFG.GROUND + 3, 42 * this.hScale * sh, 9 * sh, 0, 0, TAU); c.fill();
  c.restore();

  c.save();
  c.translate(sx, sy);
  c.scale(this.dir < 0 ? -FSCALE : FSCALE, FSCALE);
  const J = drawPosed(c, this.atlas, this.pose, plant);
  this.captureTrail(J, sy);
  if (this.flashT > 0) {            // additive re-draw = white impact flash
    c.globalCompositeOperation = "lighter";
    c.globalAlpha = clamp(this.flashT * 6, 0, 1) * .55;
    drawPosed(c, this.atlas, this.pose, plant);
    c.globalAlpha = 1;
    c.globalCompositeOperation = "source-over";
  }
  c.restore();
};

/* ============================================================================
   AI — plays through the exact same input struct as a human.
   It observes a DELAYED snapshot of the world (reaction time), so it can never
   react to an attack on the frame it starts, and it is bound by the same
   recovery, blockstun and hit rules as the player.
   ========================================================================== */
const AI_LEVELS = {
  easy: {
    name: "Easy", react: 26, decide: 30, block: .18, aggr: .26, spacing: 1.4,
    punish: .06, antiAir: .08, comboMax: 1, jump: .04, wander: .55, throwaway: .5,
    dmg: .62, low: .08, rest: .38
  },
  medium: {
    name: "Medium", react: 14, decide: 17, block: .52, aggr: .5, spacing: 1.12,
    punish: .38, antiAir: .36, comboMax: 2, jump: .11, wander: .32, throwaway: .2,
    dmg: .85, low: .2, rest: .16
  },
  hard: {
    name: "Hard", react: 8, decide: 10, block: .84, aggr: .7, spacing: .94,
    punish: .8, antiAir: .74, comboMax: 3, jump: .18, wander: .12, throwaway: .06,
    dmg: 1, low: .3, rest: .04
  }
};
const SNAP_LEN = 40;

function AI(fighter, levelKey, boost) {
  this.f = fighter;
  this.setLevel(levelKey, boost);
  this.out = { l: 0, r: 0, u: 0, d: 0, a: 0, s: 0, k: 0, f: 0 };
  this.hold = 0; this.holdKey = null; this.decT = 0; this.intent = "neutral";
  this.intentT = 0; this.comboLeft = 0;
  this.snapX = new Float32Array(SNAP_LEN);
  this.snapPhase = new Float32Array(SNAP_LEN);   // 0 none, 1 startup, 2 active, 3 recovery
  this.snapAir = new Float32Array(SNAP_LEN);
  this.snapGuard = new Float32Array(SNAP_LEN);   // 0 any 1 low 2 high
  this.snapSt = new Float32Array(SNAP_LEN);      // 1 = stunned/downed
  this.head = 0; this.filled = 0;
}
AI.prototype.setLevel = function (k, boost) {
  const L = AI_LEVELS[k] || AI_LEVELS.medium;
  this.key = k; this.L = L;
  const b = boost || 0;                              // Endless Path scaling 0..1
  this.react = Math.max(4, Math.round(L.react * (1 - b * .55)));
  this.decide = Math.max(6, Math.round(L.decide * (1 - b * .45)));
  this.block = clamp(L.block + b * .35, 0, .96);
  this.aggr = clamp(L.aggr + b * .3, 0, .95);
  this.punish = clamp(L.punish + b * .4, 0, .95);
  this.antiAir = clamp(L.antiAir + b * .4, 0, .9);
  this.comboMax = Math.min(3, L.comboMax + (b > .5 ? 1 : 0));
  this.throwaway = Math.max(0, L.throwaway - b * .3);
  this.lowChance = clamp((L.low || .15) + b * .25, 0, .55);
  this.rest = Math.max(0, (L.rest || .1) - b * .12);
  this.lowBias = 0;
};
AI.prototype.observe = function (opp) {
  const i = this.head;
  this.snapX[i] = opp.x;
  let ph = 0, guard = 0;
  if (opp.move) {
    const mv = opp.move;
    ph = opp.moveT < mv.startup ? 1 : opp.moveT <= mv.startup + mv.active ? 2 : 3;
    guard = mv.guard === "low" ? 1 : mv.guard === "high" ? 2 : 0;
  }
  this.snapPhase[i] = ph; this.snapGuard[i] = guard;
  this.snapAir[i] = opp.air ? 1 : 0;
  this.snapSt[i] = (opp.st === "hit" || opp.st === "knockdown" || opp.st === "downed" ||
    opp.st === "blockstun" || opp.st === "getup") ? 1 : 0;
  // if the player keeps guarding, start reaching for low attacks
  if (opp.st === "blockstun") this.lowBias = Math.min(1, this.lowBias + .3);
  else this.lowBias = Math.max(0, this.lowBias - .004);
  this.head = (i + 1) % SNAP_LEN;
  if (this.filled < SNAP_LEN) this.filled++;
};
AI.prototype.past = function (arr) {
  const back = Math.min(this.react, this.filled - 1);
  return arr[(this.head - 1 - back + SNAP_LEN * 2) % SNAP_LEN];
};
AI.prototype.press = function (key, frames) { this.holdKey = key; this.hold = frames || 3; };

AI.prototype.update = function (dt, opp) {
  const f = this.f, o = this.out;
  this.observe(opp);
  o.l = o.r = o.u = o.d = o.a = o.s = o.k = o.f = 0;
  if (f.st === "intro" || f.st === "win" || f.st === "lose") { f.setInput(o); return; }

  const oppX = this.past(this.snapX), phase = this.past(this.snapPhase);
  const oppAir = this.past(this.snapAir), guard = this.past(this.snapGuard);
  const oppStunned = this.past(this.snapSt);
  const dist = Math.abs(oppX - f.x);
  const toward = oppX > f.x ? 1 : -1;
  const towardKey = toward > 0 ? "r" : "l";
  const awayKey = toward > 0 ? "l" : "r";
  const reach = 118 * f.hitboxScale();

  /* ---- reactive layer (runs every frame, but on DELAYED information) ---- */
  // block incoming attacks
  if (phase === 1 || phase === 2) {
    if (dist < reach * 1.7 && rnd() < this.block * .5 + .35 && rnd() < this.block) {
      o[awayKey] = 1;
      // guess the guard height; better players guess right more often
      const wantLow = guard === 1;
      const correct = rnd() < (.45 + this.block * .55);
      o.d = (correct ? wantLow : !wantLow) ? 1 : 0;
      f.setInput(o); return;
    }
  }
  // anti-air
  if (oppAir && dist < reach * 1.3 && rnd() < this.antiAir * .16) {
    o.d = 1; this.press("s", 3);
  }

  /* ---- decision layer ---- */
  this.decT -= dt * 60;
  if (this.decT <= 0) {
    this.decT = this.decide + rndI(0, 5);
    const punishable = phase === 3 || oppStunned === 1;
    if (dist < reach * .95 && punishable && rnd() < this.punish) {
      this.intent = "attack"; this.comboLeft = this.comboMax;
    } else if (dist < reach * this.L.spacing) {
      if (rnd() < this.rest) this.intent = "rest";
      else if (rnd() < this.aggr) { this.intent = "attack"; this.comboLeft = 1 + (rnd() < .5 ? this.comboMax - 1 : 0); }
      else if (rnd() < .3) this.intent = "retreat";
      else this.intent = "block";
    } else if (dist < reach * 2.6) {
      if (rnd() < this.aggr * .8) this.intent = "approach";
      else if (rnd() < this.L.wander) this.intent = "retreat";
      else this.intent = "approach";
    } else {
      this.intent = rnd() < this.L.jump ? "jumpin" : "approach";
    }
    this.intentT = 0;
  }
  this.intentT += dt;

  /* ---- act ---- */
  switch (this.intent) {
    case "approach":
      o[towardKey] = 1;
      if (dist < reach * 1.05 && rnd() < .3) { this.intent = "attack"; this.comboLeft = 1; }
      break;
    case "retreat":
      o[awayKey] = 1;
      if (this.intentT > .5) this.intent = "approach";
      break;
    case "block":
      o[awayKey] = 1;
      if (rnd() < .02) o.d = 1;
      if (this.intentT > .55) this.intent = "approach";
      break;
    case "rest":                                   // deliberate breathing room
      if (this.intentT > .5 + rnd() * .6) this.intent = "approach";
      break;
    case "jumpin":
      if (!f.air && f.st !== "jump") { o.u = 1; o[towardKey] = 1; }
      else if (f.air && dist < reach * 1.4) this.press("f", 3);
      if (this.intentT > .9) this.intent = "approach";
      break;
    case "attack": {
      if (dist > reach * 1.15) { o[towardKey] = 1; if (this.intentT > .6) this.intent = "approach"; break; }
      if (this.hold <= 0 && (f.st === "idle" || f.st === "walk" || f.st === "crouch" ||
        f.st === "block" || (f.st === "attack" && f.chainOK))) {
        if (this.comboLeft > 0) {
          this.comboLeft--;
          const roll = rnd();
          // deliberately weak choices for easy AI
          if (rnd() < this.throwaway) this.press(pick(["a", "k", "s", "f"]), 3);
          else if (dist < reach * .62) this.press(roll < .4 ? "a" : roll < .68 ? "s" : roll < .86 ? "k" : "f", 3);
          else this.press(roll < .3 ? "k" : roll < .6 ? "f" : roll < .82 ? "s" : "a", 3);
          if (rnd() < this.lowChance + this.lowBias * .35) o.d = 1;   // mix in lows
        } else { this.intent = rnd() < .5 ? "block" : "retreat"; }
      }
      break;
    }
    default: o[towardKey] = rnd() < .5 ? 1 : 0;
  }
  if (this.hold > 0) { o[this.holdKey] = 1; this.hold--; }
  f.setInput(o);
};

/* ============================================================================
   GAME — match flow, rounds, camera, HUD, Endless Path, rendering
   ========================================================================== */
const Game = {
  mode: "menu",          // menu | vs | endless
  phase: "idle",         // intro | fight | ko | roundEnd | travel | over
  p1: null, p2: null, ai: null, aiLevel: "medium",
  camX: 0, camTarget: 0,
  timer: CFG.ROUND_TIME, round: 1, w1: 0, w2: 0,
  running: false, paused: false,
  q: 2, autoQ: true, reduced: false,
  survT: 0, foeIdx: 0, best: 0, travelT: 0, pathOff: 0, fade: 0,
  phaseT: 0, atlases: {}, foeAtlas: null, boxA: [0, 0, 0, 0], boxB: [0, 0, 0, 0],
  hbA: [0, 0, 0, 0], hbB: [0, 0, 0, 0],
  hudCache: { hp1: -1, hp2: -1, clock: -1, r: -1 },
  lagHp1: 100, lagHp2: 100, lagT: 0,
  stats: { hits: 0, blocks: 0, maxCombo: 0 },

  /* ------------------------------ setup ------------------------------- */
  atlasFor(def) {
    if (this.atlases[def.id]) return this.atlases[def.id];
    const a = buildAtlas(def);
    this.atlases[def.id] = a;
    return a;
  },
  applyQuality() {
    this.applyGuard();
    const s = Store.data;
    this.reduced = !!s.reduced;
    if (s.quality === "auto") { this.autoQ = true; }
    else { this.autoQ = false; this.q = s.quality === "low" ? 0 : s.quality === "med" ? 1 : 2; }
    if (this.reduced) this.q = 0;
  },

  /* attract scene shown behind the menus — no simulation, just idle motion */
  startAttract() {
    const i = rndI(0, ROSTER.length - 1), j = (i + 1 + rndI(0, ROSTER.length - 2)) % ROSTER.length;
    this.p1 = new Fighter(ROSTER[i], 0); this.p2 = new Fighter(ROSTER[j], 1);
    this.p1.atlas = this.atlasFor(ROSTER[i]); this.p2.atlas = this.atlasFor(ROSTER[j]);
    for (const f of [this.p1, this.p2]) { f.st = "idle"; f.anim = "idle"; f.animT = rnd(); }
    this.p1.x = CFG.ARENA_W / 2 - 165; this.p2.x = CFG.ARENA_W / 2 + 165;
    this.p1.dir = 1; this.p2.dir = -1;
    Stage.load(rndI(0, STAGE_DEFS.length - 1));
    this.camX = CFG.ARENA_W / 2 - CFG.VW / 2;
    this.pathOff = 0; this.fade = 0; this.mode = "menu"; this.running = false; this.paused = false;
  },
  /* keeps the world breathing on result / menu screens */
  stepIdle(dt) {
    if (!this.p1 || !this.p2 || this.running || !Stage.def) return;
    Stage.update(dt); FX.update(dt);
    for (const f of [this.p1, this.p2]) {
      const a = A[f.anim];
      if (a && a.loop) f.animT += dt * .6;
      else if (f.anim === "victory") f.animT += dt * .55;
    }
  },

  startVs(p1i, p2i, stageI, level) {
    this.mode = "vs"; this.aiLevel = level;
    this.p1 = new Fighter(ROSTER[p1i], 0);
    this.p2 = new Fighter(ROSTER[p2i], 1);
    this.p1.atlas = this.atlasFor(ROSTER[p1i]);
    this.p2.atlas = this.atlasFor(ROSTER[p2i]);
    this.ai = new AI(this.p2, level, 0);
    this.p2.mods = Object.assign({}, this.p2.mods);
    this.p2.mods.dmg *= (AI_LEVELS[level] || AI_LEVELS.medium).dmg;
    this.applyGuard();
    this.round = 1; this.w1 = 0; this.w2 = 0;
    this.stats = { hits: 0, blocks: 0, maxCombo: 0 };
    Stage.load(stageI);
    UI.setEndlessHud(false);
    this.beginRound();
    this.running = true;
    Music.play("fight");
  },

  startEndless(p1i) {
    this.mode = "endless";
    this.p1 = new Fighter(ROSTER[p1i], 0);
    this.p1.atlas = this.atlasFor(ROSTER[p1i]);
    this.foeIdx = 0; this.survT = 0; this.pathOff = 0;
    this.best = Store.data.bestTime || 0;
    this.stats = { hits: 0, blocks: 0, maxCombo: 0 };
    Stage.load(0);
    this.spawnFoe(true);
    this.applyGuard();
    UI.setEndlessHud(true);
    this.round = 1; this.w1 = 0; this.w2 = 0;
    this.beginRound();
    this.running = true;
    Music.play("endless");
  },
  spawnFoe(first) {
    const def = makeEnemyDef(this.foeIdx);
    this.foeAtlas = buildAtlas(def, this.foeAtlas ? this.foeAtlas.cv : null);
    this.p2 = new Fighter(def, 1);
    this.p2.atlas = this.foeAtlas;
    const boost = clamp(this.foeIdx / 16, 0, 1);
    const lvl = this.foeIdx < 2 ? "easy" : this.foeIdx < 6 ? "medium" : "hard";
    this.ai = new AI(this.p2, lvl, boost);
    this.p2.maxHp = CFG.MAX_HP * (.72 + Math.min(this.foeIdx, 14) * .035);
    this.p2.hp = this.p2.maxHp;
    this.p2.mods = Object.assign({}, def.mods);
    this.p2.mods.dmg *= 1 + boost * .35;
    this.p2.mods.speed *= 1 + boost * .18;
    this.p2.mods.dmg *= (AI_LEVELS[lvl] || AI_LEVELS.medium).dmg;
    this.p2.x = CFG.ARENA_W / 2 + 150; this.p2.dir = -1;
    this.applyGuard();
  },
  /* Auto guard: off / player only / both sides */
  applyGuard() {
    const m = Store.data.autoGuard || "player";
    if (this.p1) this.p1.autoGuard = (m === "player" || m === "both");
    if (this.p2) this.p2.autoGuard = (m === "both");
  },

  beginRound() {
    const a = this.p1, b = this.p2;
    a.reset(CFG.ARENA_W / 2 - 145, 1);
    b.reset(CFG.ARENA_W / 2 + 145, -1);
    if (this.mode === "endless") {
      b.maxHp = this.p2.maxHp; b.hp = this.p2.maxHp;
      if (this.foeIdx > 0) a.hp = this.hpCarry;
    }
    this.timer = CFG.ROUND_TIME;
    this.phase = "intro"; this.phaseT = 0;
    this.lagHp1 = a.hp; this.lagHp2 = b.hp;
    FX.clear();
    this.camX = clamp((a.x + b.x) / 2 - CFG.VW / 2, 0, CFG.ARENA_W - CFG.VW);
    UI.announce(this.mode === "endless"
      ? (this.foeIdx === 0 ? "ENDLESS PATH" : "FOE " + (this.foeIdx + 1))
      : "ROUND " + this.round, true);
    this.hudCache.hp1 = -1; this.hudCache.hp2 = -1; this.hudCache.clock = -1; this.hudCache.r = -1;
    UI.syncHud(true);
  },

  /* ------------------------------ stepping ---------------------------- */
  step(dt) {
    if (!this.running || this.paused) return;
    const a = this.p1, b = this.p2;
    if (this.fade > 0 && this.phase !== "travel") this.fade = Math.max(0, this.fade - dt * 2);

    FX.update(dt);
    Stage.update(dt);

    if (this.phase === "travel") { this.stepTravel(dt); return; }

    const frozen = FX.hitStop > 0;
    if (this.phase === "intro") {
      this.phaseT += dt;
      if (this.phaseT > 1.15) { this.phase = "fight"; this.phaseT = 0; UI.announce("FIGHT!", false); Snd.bell(); }
    } else if (this.phase === "fight") {
      if (this.mode === "endless") this.survT += dt;
      else { this.timer -= dt; if (this.timer <= 0) { this.timer = 0; this.endRound("time"); } }
    } else if (this.phase === "ko" || this.phase === "roundEnd") {
      this.phaseT += dt;
      if (this.phaseT > 2.3) this.afterRound();
    } else if (this.phase === "over") {
      this.phaseT += dt;
    }

    // AI drives the same input struct as a human player
    if (this.ai) this.ai.update(dt, a);

    a.update(dt, b, frozen);
    b.update(dt, a, frozen);
    if (!frozen) {
      separate(a, b);
      const r = resolveHits(a, b, this.boxA, this.boxB, this.hbA, this.hbB);
      if (r === "hit") { this.stats.hits++; this.stats.maxCombo = Math.max(this.stats.maxCombo, a.combo, b.combo); }
      else if (r === "block") this.stats.blocks++;
      if (this.phase === "fight") {
        if (a.hp <= 0 || b.hp <= 0) this.endRound("ko");
      }
    }
    // health-bar lag
    this.lagHp1 = approach(this.lagHp1, a.hp, 42 * dt);
    this.lagHp2 = approach(this.lagHp2, b.hp, 42 * dt);
    this.camUpdate(dt);
  },
  camUpdate(dt) {
    const mid = (this.p1.x + this.p2.x) / 2;
    this.camTarget = clamp(mid - CFG.VW / 2, 0, CFG.ARENA_W - CFG.VW);
    this.camX += (this.camTarget - this.camX) * Math.min(1, dt * 7);
  },

  endRound(why) {
    const a = this.p1, b = this.p2;
    let winner = null;
    if (why === "ko") winner = a.hp <= 0 ? (b.hp <= 0 ? null : b) : a;
    else { winner = a.hp > b.hp ? a : b.hp > a.hp ? b : null; }
    this.phase = "ko"; this.phaseT = 0;
    Snd.ko();
    FX.shake(14);
    if (this.mode === "endless") {
      if (a.hp <= 0) {                       // run over
        this.phase = "over"; this.phaseT = 0;
        UI.announce("DOWN", true);
        a.st = "lose"; a.anim = "defeat"; a.animT = 1;
        b.st = "win"; b.anim = "victory"; b.animT = 0;
        this.saveBest();
        this.running = false;
        setTimeout(() => { if (this.mode === "endless") UI.showEndlessOver(); }, 2000);
        return;
      }
      // foe defeated
      b.st = "lose"; b.anim = "defeat"; b.animT = 1;
      a.st = "win"; a.anim = "victory"; a.animT = 0;
      UI.announce("FOE DOWN", true);
      this.hpCarry = Math.min(CFG.MAX_HP, a.hp + CFG.ENDLESS_HEAL);
      return;
    }
    if (winner === a) { this.w1++; UI.announce(why === "time" ? "TIME · P1" : "K.O.", true); }
    else if (winner === b) { this.w2++; UI.announce(why === "time" ? "TIME · CPU" : "K.O.", true); }
    else UI.announce("DRAW", true);
    if (winner) {
      winner.st = "win"; winner.anim = "victory"; winner.animT = 0;
      const loser = winner === a ? b : a;
      loser.st = "lose"; loser.anim = "defeat"; loser.animT = 1;
      if (rnd() < .8) setTimeout(() => Snd.voice(winner.def.voice, "big"), 700);
    }
    UI.syncHud(true);
  },
  afterRound() {
    if (this.mode === "endless") {
      this.phase = "travel"; this.travelT = 0; this.phaseT = 0;
      return;
    }
    if (this.w1 >= CFG.ROUNDS_TO_WIN || this.w2 >= CFG.ROUNDS_TO_WIN || this.round >= CFG.MAX_ROUNDS) {
      this.phase = "over"; this.phaseT = 0;
      this.running = false;
      UI.showResult(this.w1 > this.w2 ? "win" : this.w2 > this.w1 ? "lose" : "draw");
      return;
    }
    this.round++;
    this.beginRound();
  },
  stepTravel(dt) {
    this.travelT += dt;
    const T = 2.1, t = this.travelT / T;
    this.pathOff = easeInOutSine(clamp(t, 0, 1)) * 640;
    this.fade = t < .5 ? t * 1.8 : Math.max(0, (1 - t) * 1.8);
    const a = this.p1;
    a.anim = "walkF"; a.animT += dt * 1.5; a.st = "walk"; a.dir = 1;
    if (!this.swapped && t >= .5) {
      this.swapped = true;
      this.foeIdx++;
      if (this.foeIdx % CFG.ENDLESS_STAGE_EVERY === 0)
        Stage.load((Math.floor(this.foeIdx / CFG.ENDLESS_STAGE_EVERY)) % STAGE_DEFS.length);
      this.spawnFoe(false);
      this.beginRound();
      this.phase = "travel";                 // beginRound sets intro; keep travelling
      this.p1.hp = this.hpCarry;
      this.lagHp1 = this.hpCarry;
    }
    if (t >= 1) {
      this.swapped = false; this.pathOff = 0; this.fade = 0;
      this.phase = "intro"; this.phaseT = 0;
      this.p1.toNeutral();
    }
  },
  saveBest() {
    if (this.survT > (Store.data.bestTime || 0)) {
      Store.data.bestTime = this.survT;
      Store.data.bestFoes = this.foeIdx + 1;
      Store.save();
    }
    this.best = Store.data.bestTime || 0;
  },

  /* ------------------------------ rendering --------------------------- */
  render(c) {
    const cam = this.camX + this.pathOff;
    c.setTransform(RSCALE, 0, 0, RSCALE, 0, 0);
    c.save();
    c.translate(FX.shakeX, FX.shakeY);
    Stage.drawBack(c, cam, this.q);
    // fighters, back-to-front by depth (the one further right draws in front)
    const a = this.p1, b = this.p2;
    if (a && b) {
      if (a.y < b.y) { b.draw(c, cam); a.draw(c, cam); }
      else { a.draw(c, cam); b.draw(c, cam); }
      a.drawTrail(c, cam); b.drawTrail(c, cam);
    }
    FX.draw(c, cam);
    Stage.drawFore(c, this.q);
    FX.drawFlash(c);
    c.restore();
    if (this.fade > 0) {
      c.fillStyle = rgba("#04050a", clamp(this.fade, 0, 1));
      c.fillRect(0, 0, CFG.VW, CFG.VH);
    }
    if (DEBUG.boxes) this.debugBoxes(c, cam);
  },
  debugBoxes(c, cam) {
    const a = this.p1, b = this.p2; if (!a || !b) return;
    c.save(); c.lineWidth = 1.5;
    for (const f of [a, b]) {
      f.hurtBox(this.hbA);
      c.strokeStyle = "#3fd6ff";
      c.strokeRect(this.hbA[0] - cam, CFG.GROUND + this.hbA[1], this.hbA[2], this.hbA[3]);
      if (f.move && f.moveT >= f.move.startup && f.moveT <= f.move.startup + f.move.active) {
        f.attackBox(this.boxA);
        c.strokeStyle = "#ff2d6f";
        c.strokeRect(this.boxA[0] - cam, CFG.GROUND + this.boxA[1], this.boxA[2], this.boxA[3]);
      }
    }
    c.restore();
  }
};
const DEBUG = { boxes: false };

/* ============================================================================
   INPUT — keyboard + multitouch virtual pad (analog stick + 4 buttons)
   All listeners are attached exactly once, at boot.
   ========================================================================== */
const Input = {
  p1: { l: 0, r: 0, u: 0, d: 0, a: 0, s: 0, k: 0, f: 0 },
  kb: { l: 0, r: 0, u: 0, d: 0, a: 0, s: 0, k: 0, f: 0 },
  tc: { l: 0, r: 0, u: 0, d: 0, a: 0, s: 0, k: 0, f: 0 },
  touchOn: false, bound: false, stickId: -1,
  baseX: 0, baseY: 0, radius: 56, defBase: null,
  btnPointers: {},                      // pointerId -> button key
  lastPointerTouch: false,

  init() {
    if (this.bound) return; this.bound = true;
    const KEYMAP = {
      ArrowLeft: "l", ArrowRight: "r", ArrowUp: "u", ArrowDown: "d",
      KeyA: "a", KeyS: "s", KeyD: "k", KeyF: "f"
    };
    window.addEventListener("keydown", e => {
      Snd.resume();
      if (e.code === "Escape" || e.code === "KeyP") { e.preventDefault(); UI.togglePause(); return; }
      if (e.code === "F2") { DEBUG.boxes = !DEBUG.boxes; return; }
      const k = KEYMAP[e.code];
      if (k) { this.kb[k] = 1; e.preventDefault(); }
      if (e.code === "Enter" || e.code === "Space") { const b = UI.defaultBtn(); if (b) { e.preventDefault(); b.click(); } }
    }, { passive: false });
    window.addEventListener("keyup", e => {
      const k = KEYMAP[e.code];
      if (k) { this.kb[k] = 0; e.preventDefault(); }
    }, { passive: false });
    window.addEventListener("blur", () => { for (const k in this.kb) this.kb[k] = 0; });

    // ---- touch pad ----
    const zone = $("#stickZone"), base = $("#stickBase"), knob = $("#stickKnob");
    this.defBase = base;
    const pad = $("#touch");

    const setBase = (x, y) => {
      base.style.left = x + "px"; base.style.top = y + "px"; base.style.bottom = "auto";
    };
    const resetBase = () => {
      base.style.left = ""; base.style.top = ""; base.style.bottom = "";
      knob.style.left = "50%"; knob.style.top = "50%";
    };
    zone.addEventListener("pointerdown", e => {
      if (this.stickId !== -1) return;
      this.stickId = e.pointerId;
      this.baseX = e.clientX; this.baseY = e.clientY;
      this.radius = base.offsetWidth * .5 || 56;
      setBase(e.clientX, e.clientY);
      try { zone.setPointerCapture(e.pointerId); } catch (err) { }
      Snd.resume();
      e.preventDefault();
    }, { passive: false });
    const moveStick = e => {
      if (e.pointerId !== this.stickId) return;
      const dx = e.clientX - this.baseX, dy = e.clientY - this.baseY;
      const d = Math.hypot(dx, dy) || 1;
      const cl = Math.min(d, this.radius);
      const nx = dx / d * (cl / this.radius), ny = dy / d * (cl / this.radius);
      knob.style.left = (50 + nx * 42) + "%";
      knob.style.top = (50 + ny * 42) + "%";
      const T = this.tc;
      T.l = nx < -.3 ? 1 : 0; T.r = nx > .3 ? 1 : 0;
      T.u = ny < -.52 ? 1 : 0; T.d = ny > .42 ? 1 : 0;
      if (T.u) { T.d = 0; }
      e.preventDefault();
    };
    zone.addEventListener("pointermove", moveStick, { passive: false });
    const endStick = e => {
      if (e.pointerId !== this.stickId) return;
      this.stickId = -1;
      this.tc.l = this.tc.r = this.tc.u = this.tc.d = 0;
      resetBase();
    };
    zone.addEventListener("pointerup", endStick);
    zone.addEventListener("pointercancel", endStick);
    zone.addEventListener("lostpointercapture", endStick);

    const BK = { A: "a", S: "s", D: "k", F: "f" };
    $$("#btnPad .tbtn").forEach(btn => {
      const key = BK[btn.dataset.k];
      btn.addEventListener("pointerdown", e => {
        Snd.resume();
        this.btnPointers[e.pointerId] = key;
        this.tc[key] = 1; btn.classList.add("hit");
        if (Store.data.vibrate && navigator.vibrate) navigator.vibrate(12);
        try { btn.setPointerCapture(e.pointerId); } catch (err) { }
        e.preventDefault();
      }, { passive: false });
      const up = e => {
        if (this.btnPointers[e.pointerId] !== key) return;
        delete this.btnPointers[e.pointerId];
        this.tc[key] = 0; btn.classList.remove("hit");
      };
      btn.addEventListener("pointerup", up);
      btn.addEventListener("pointercancel", up);
      btn.addEventListener("lostpointercapture", up);
    });

    // suppress browser gestures
    document.addEventListener("touchmove", e => { if (e.touches.length > 1 || Game.running) e.preventDefault(); }, { passive: false });
    document.addEventListener("gesturestart", e => e.preventDefault());
    document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
    document.addEventListener("contextmenu", e => e.preventDefault());
    window.addEventListener("pointerdown", e => {
      if (e.pointerType === "touch" && !this.lastPointerTouch) {
        this.lastPointerTouch = true;
        if (Store.data.tcVisible === "auto") this.setTouch(true);
      }
      Snd.resume();
    }, true);

    if (Store.data.tcVisible === "on") this.setTouch(true);
    else if (Store.data.tcVisible === "auto" && matchMedia("(pointer:coarse)").matches) this.setTouch(true);
    this.applyStyle();
  },
  setTouch(on) {
    this.touchOn = !!on;
    document.body.classList.toggle("tc-on", this.touchOn);
    $("#touch").classList.toggle("on", this.touchOn && Game.running && !Game.paused);
    $("#tcToggle").classList.toggle("on", this.lastPointerTouch || this.touchOn);
    if (!on) for (const k in this.tc) this.tc[k] = 0;
  },
  refreshVisible() {
    document.body.classList.toggle("tc-on", this.touchOn);
    $("#touch").classList.toggle("on", this.touchOn && Game.running && !Game.paused);
    $("#tcToggle").classList.toggle("on", (this.lastPointerTouch || this.touchOn) && Game.running && !Game.paused);
  },
  applyStyle() {
    const t = $("#touch");
    t.style.setProperty("--tScale", Store.data.tcScale);
    t.style.setProperty("--tOpacity", Store.data.tcOpacity);
  },
  poll() {
    const p = this.p1, k = this.kb, t = this.tc;
    p.l = k.l | t.l; p.r = k.r | t.r; p.u = k.u | t.u; p.d = k.d | t.d;
    p.a = k.a | t.a; p.s = k.s | t.s; p.k = k.k | t.k; p.f = k.f | t.f;
    return p;
  },
  clearAll() { for (const o of [this.kb, this.tc, this.p1]) for (const k in o) o[k] = 0; this.stickId = -1; }
};

/* ============================================================================
   UI — every screen is created ONCE at boot and toggled with a class.
   All interaction goes through a single delegated document listener, so opening
   and closing menus can never create duplicate handlers or duplicate controls.
   ========================================================================== */
const UI = {

      </div>`);

    mk("mode", `
      <div class="sc-head"><div class="sc-title">Select Mode<small>${CFG.title}</small></div>

          <div class="btn wide" data-act="modeVs">Computer 1 v 1</div>

          <div class="btn wide ghost" data-act="go" data-to="controls">Controls</div>
        </div>

      </div>`);

    mk("p1", `
      <div class="sc-head"><div class="sc-title" id="p1Title">Choose your fighter<small>Player</small></div>
        <div class="spacer"></div><div class="btn sm ghost" data-act="back">Back</div></div>
      <div class="selWrap">
        <div class="selGrid" id="gridP1"></div>
        <div class="infoPane" id="infoP1"></div>
      </div>
      <div class="foot"><div class="btn" data-act="confirmP1">Confirm</div>
        <div class="btn ghost" data-act="go" data-to="moves">Move List</div></div>`);

  rowSlider(label, key, min, max) {

  buildCards() {

        card.appendChild(cv);
        card.appendChild(el("div", "nm", d.name));
        g.appendChild(card);
      });
    });
    const sg = $("#gridStage"); sg.innerHTML = "";
    STAGE_DEFS.forEach((s, i) => {
      const c = el("div", "stageCard");
      c.dataset.act = "pickStage"; c.dataset.i = i;
      const cv = mkCanvas(288, 162); c.appendChild(cv);
      c.appendChild(el("div", "nm", s.name + " <span style='opacity:.55;font-size:9px;letter-spacing:.14em'>" + s.sub + "</span>"));
      sg.appendChild(c);
    });
  },
  mlChar: 0,
  buildMoveList() {
    const tabs = $("#mlTabs");
    if (!tabs.childElementCount) {
      ROSTER.forEach((d, i) => {
        const b = el("div", "mlTab", d.name.split(" ")[0]);
        b.dataset.act = "mlPick"; b.dataset.i = i;
        tabs.appendChild(b);
      });
    }
    this.paintMoveList();
  },
  paintMoveList() {
    const i = clamp(this.mlChar, 0, ROSTER.length - 1);
    const d = ROSTER[i];
    $$("#mlTabs .mlTab").forEach((t, k) => t.classList.toggle("on", k === i));
    const L = $("#mlList");
    const row = (input, name, note, dmg, cls) =>
      '<div class="mlRow' + (cls ? " " + cls : "") + '"><span class="in">' + input + '</span>' +
      '<span class="nm">' + name + (note ? "<s>" + note + "</s>" : "") + '</span>' +
      (dmg ? '<span class="dm">' + dmg + '</span>' : "") + "</div>";
    const dmgOf = k => {
      const mv = MOVES[k];
      const mul = d.mods.dmg * (mv.type === "punch" ? d.mods.punch : d.mods.kick);
      return Math.round(mv.dmg * mul);
    };
    const frames = k => {
      const mv = MOVES[k];
      return mv.startup + "f start · " + Math.round(mv.recovery * (d.mods.recover || 1)) + "f recover";
    };
    let html = '<div class="mlSec">Standing</div>';
    html += row("A", "Jab", frames("jab"), dmgOf("jab"));
    html += row("S", "Cross", frames("cross"), dmgOf("cross"));
    html += row("D", "Low Kick", frames("lowKick"), dmgOf("lowKick"));
    html += row("F", "Round Kick", frames("roundKick"), dmgOf("roundKick"));
    html += '<div class="mlSec">Crouching</div>';
    html += row("↓ A", "Crouch Jab", frames("crouchJab"), dmgOf("crouchJab"));
    html += row("↓ S", "Uppercut", "knockdown · anti-air", dmgOf("uppercut"));
    html += row("↓ D", "Low Poke", "must be blocked low", dmgOf("crouchKick"));
    html += row("↓ F", "Sweep", "knockdown · must be blocked low", dmgOf("sweep"));
    html += '<div class="mlSec">Advancing &amp; Air</div>';
    html += row("→ S", "Lunge Punch", "steps in", dmgOf("lunge"));
    html += row("→ F", "Thrust Kick", "steps in · big pushback", dmgOf("pushKick"));
    html += row("↑ A/S", "Air Punch", "must be blocked standing", dmgOf("airPunch"));
    html += row("↑ D/F", "Air Kick", "must be blocked standing", dmgOf("airKick"));
    html += '<div class="mlSec">Chain strings — everyone has these</div>';
    CHAIN_ROUTES.forEach(c => { html += row(c.in, c.note, "", ""); });
    const sigs = SIGS[d.id];
    if (sigs) {
      html += '<div class="mlSec">' + d.name + " — signature finishers</div>";
      for (const k in sigs) {
        const s = sigs[k], parts = k.split(",");
        const inp = parts.map(m => ({ jab: "A", cross: "S", lowKick: "D", roundKick: "F" })[m] || m).join(" → ");
        html += row(inp, s.name, "knockdown finisher · " + parts.length + " hits",
          dmgOf(s.move), "sig");
      }
    }
    L.innerHTML = html;
  },
  paintPortraits() {
    const pose = P({});
    ["P1", "P2"].forEach(which => {
      $$("#grid" + which + " .card").forEach((card, i) => {
        const cv = card.querySelector("canvas"), g = cv.getContext("2d");
        const d = ROSTER[i], at = Game.atlasFor(d);
        g.clearRect(0, 0, cv.width, cv.height);
        const bg = g.createLinearGradient(0, 0, 0, cv.height);
        bg.addColorStop(0, "#20263a"); bg.addColorStop(1, "#0d1018");
        g.fillStyle = bg; g.fillRect(0, 0, cv.width, cv.height);
        g.fillStyle = rgba(d.accent, .16);
        g.beginPath(); g.arc(cv.width / 2, cv.height * .42, cv.width * .42, 0, TAU); g.fill();
        g.save();
        const sc = 1.02;
        g.translate(cv.width / 2 - 6, cv.height - 8);
        g.scale(sc, sc);
        sampleAnim(A.idle, .25, pose);
        drawPosed(g, at, pose, true);
        g.restore();
        g.fillStyle = grad(g, 0, cv.height - 60, 0, cv.height, [[0, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,.7)"]]);
        g.fillRect(0, cv.height - 60, cv.width, 60);
      });
    });
  },
  paintStageThumbs(scratch) {
    const cards = $$("#gridStage .stageCard");
    for (let i = 0; i < STAGE_DEFS.length; i++) {
      Stage.load(i);
      const sc = scratch.getContext("2d");
      sc.setTransform(1, 0, 0, 1, 0, 0);
      Stage.drawBack(sc, 270, 2);
      Stage.drawFore(sc, 2);
      const cv = cards[i].querySelector("canvas"), g = cv.getContext("2d");
      g.drawImage(scratch, 0, 0, CFG.VW, CFG.VH, 0, 0, cv.width, cv.height);
    }
    Snd.stopAmbience();
  },

  /* ------------------------------- events -------------------------------- */
  bindOnce() {
    document.addEventListener("click", e => {
      const t = e.target.closest("[data-act]");
      if (!t) return;
      Snd.resume();
      const act = t.dataset.act;
      if (act !== "pickP1" && act !== "pickP2" && act !== "pickStage") Snd.menu(act === "back" ? "back" : "ok");
      else Snd.menu("move");
      this.action(act, t);
    });
    document.addEventListener("input", e => {
      const t = e.target;
      if (t.dataset && t.dataset.set) {
        const k = t.dataset.set, v = parseFloat(t.value);
        Store.data[k] = v; Store.save();
        const lab = document.querySelector('[data-val="' + k + '"]');
        if (lab) lab.textContent = Math.round(v * 100) + "%";
        Snd.applyVolumes(); Input.applyStyle();
      }
    });
    document.addEventListener("click", e => {
      const t = e.target.closest("[data-seg]");
      if (!t) return;
      const k = t.dataset.seg; let v = t.dataset.v;
      if (v === "true") v = true; else if (v === "false") v = false;
      Store.data[k] = v; Store.save();
      this.syncOptionUI();
      Game.applyQuality();
      if (k === "autoGuard") Game.applyGuard();
      if (k === "tcVisible") Input.setTouch(v === "on" || (v === "auto" && (Input.lastPointerTouch || matchMedia("(pointer:coarse)").matches)));
      Snd.menu("move");
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && Game.running && !Game.paused) this.togglePause(true);
    });
  },
  action(act, t) {
    switch (act) {
      case "go": this.push(t.dataset.to); break;
      case "back": this.back(); break;
      case "modeVs": this.mode = "vs"; this.push("p1"); this.refreshPicks(); break;
      case "modeEndless": this.mode = "endless"; this.push("p1"); this.refreshPicks(); break;
      case "pickP1": this.sel.p1 = +t.dataset.i; this.refreshPicks(); break;
      case "pickP2": this.sel.p2 = +t.dataset.i; this.refreshPicks(); break;
      case "pickStage": this.sel.stage = +t.dataset.i; this.refreshPicks(); break;
      case "confirmP1":
        if (this.mode === "endless") { this.startEndless(); }
        else this.push("p2");
        this.refreshPicks(); break;
      case "confirmP2": this.push("stage"); this.refreshPicks(); break;
      case "confirmStage": this.push("diff"); break;
      case "fight": this.sel.diff = t.dataset.diff; this.startVs(); break;
      case "resume": this.togglePause(false); break;
      case "quit": this.quit(); break;
      case "rematch":
        if (this.mode === "endless") this.startEndless(); else this.startVs();
        break;
      case "changeFighter": this.hideAll(); this.stack = ["mode"]; this.push("p1"); this.refreshPicks(); break;
      case "retryEndless": this.startEndless(); break;
      case "pause": this.togglePause(); break;
      case "tctoggle":
        Input.setTouch(!Input.touchOn);
        Store.data.tcVisible = Input.touchOn ? "on" : "off"; Store.save(); this.syncOptionUI();
        break;
      case "mlPick": this.mlChar = +t.dataset.i; this.paintMoveList(); break;
      case "clearBest":
        Store.data.bestTime = 0; Store.data.bestFoes = 0; Store.save(); this.syncOptionUI(); this.refreshBest();
        break;
    }
  },

  /* ------------------------------ navigation ----------------------------- */
  hideAll() { for (const k in this.screens) this.screens[k].classList.remove("on"); this.cur = null; },
  show(name) {
    this.hideAll();
    if (!name) return;
    const s = this.screens[name]; if (!s) return;
    s.classList.add("on"); this.cur = name;
    if (name === "options") this.syncOptionUI();
    if (name === "moves") { this.mlChar = Game.running && Game.p1 ? Math.max(0, ROSTER.indexOf(Game.p1.def)) : this.sel.p1; this.buildMoveList(); }
    if (name === "mode") this.refreshBest();
    Input.refreshVisible();
  },
  push(name) { if (this.cur) this.stack.push(this.cur); this.show(name); },
  back() {
    const prev = this.stack.pop();
    if (prev) this.show(prev);
    else if (Game.running) this.togglePause(false);
    else this.show("title");
  },
  quit() {
    Game.running = false; Game.paused = false; Game.mode = "menu";
    Game.startAttract();
    Music.play("menu");
    $("#hud").classList.remove("on");
    this.setEndlessHud(false);
    Input.clearAll(); Input.refreshVisible();
    this.stack = []; this.show("title");
  },
  togglePause(force) {
    if (!Game.running) return;
    const want = force === undefined ? !Game.paused : !!force;
    if (want === Game.paused) return;
    Game.paused = want;
    if (want) { this.push("pause"); Music.stop(); }
    else { this.hideAll(); this.stack = []; Music.play(Game.mode === "endless" ? "endless" : "fight"); }
    Input.clearAll(); Input.refreshVisible();
  },

  /* ------------------------------- launching ----------------------------- */
  startVs() {
    this.hideAll(); this.stack = [];
    $("#hud").classList.add("on");
    Game.applyQuality();
    Game.paused = false;
    Game.startVs(this.sel.p1, this.sel.p2, this.sel.stage, this.sel.diff);
    Input.clearAll(); Input.refreshVisible();
  },
  startEndless() {
    this.hideAll(); this.stack = [];
    $("#hud").classList.add("on");
    Game.applyQuality();
    Game.paused = false;
    Game.startEndless(this.sel.p1);
    Input.clearAll(); Input.refreshVisible();
  },

  /* -------------------------------- panes -------------------------------- */
  refreshPicks() {
    $$("#gridP1 .card").forEach((c, i) => c.classList.toggle("sel", i === this.sel.p1));
    $$("#gridP2 .card").forEach((c, i) => c.classList.toggle("sel2", i === this.sel.p2));
    $$("#gridStage .stageCard").forEach((c, i) => c.classList.toggle("sel", i === this.sel.stage));
    this.info("#infoP1", ROSTER[this.sel.p1]);
    this.info("#infoP2", ROSTER[this.sel.p2]);
    $("#p1Title").innerHTML = this.mode === "endless"
      ? 'Choose your fighter<small>Endless Path</small>' : 'Choose your fighter<small>Player</small>';
  },
  info(sel, d) {
    const bar = (lb, v) => `<div class="stat"><b>${lb}</b><div class="bar"><i style="width:${v * 20}%"></i></div></div>`;
    $(sel).innerHTML =
      `<h3>${d.name}</h3><div class="tagline">${d.tag}</div>` +
      bar("Power", d.stats.pow) + bar("Speed", d.stats.spd) + bar("Reach", d.stats.rng) + bar("Guard", d.stats.def) +
      `<div class="desc">${d.desc}</div>`;
  },
  refreshBest() {
    const b = Store.data.bestTime || 0;
    const line = $("#bestLine");
    if (line) line.textContent = b > 0
      ? "Endless best · " + fmtTime(b) + " · " + (Store.data.bestFoes || 0) + " foes"
      : "Endless best · not set";
  },
  syncOptionUI() {
    const s = Store.data;
    $$("[data-set]").forEach(inp => {
      const k = inp.dataset.set;
      inp.value = s[k];
      const lab = document.querySelector('[data-val="' + k + '"]');
      if (lab) lab.textContent = Math.round(s[k] * 100) + "%";
    });
    $$("[data-seg]").forEach(b => {
      const k = b.dataset.seg; let v = b.dataset.v;
      if (v === "true") v = true; else if (v === "false") v = false;
      b.classList.toggle("on", s[k] === v);
    });
    const ob = $("#optBest"); if (ob) ob.textContent = (s.bestTime > 0 ? fmtTime(s.bestTime) : "not set");
    Snd.applyVolumes(); Input.applyStyle();
  },

  /* --------------------------------- HUD --------------------------------- */
  sigFlash(name, side) {
    const b = $("#sigBanner");
    if (!b) return;
    b.firstElementChild.textContent = name;
    b.classList.remove("go"); void b.offsetWidth; b.classList.add("go");
    clearTimeout(this._sigT);
    this._sigT = setTimeout(() => b.classList.remove("go"), 1400);
  },
  setEndlessHud(on) { $("#endlessHud").classList.remove("on"); },
  announce(text, hold) {
    const n = $("#annTxt");
    n.textContent = text;
    n.className = "txt";
    void n.offsetWidth;
    n.classList.add(hold ? "hold" : "go");
    if (hold) { clearTimeout(this.annTimer); this.annTimer = setTimeout(() => { n.className = "txt"; }, 1500); }
  },
  syncHud(force) {
    const g = Game, a = g.p1, b = g.p2; if (!a || !b) return;
    const C = g.hudCache;
    const h1 = Math.round(a.hp / a.maxHp * 100), h2 = Math.round(b.hp / b.maxHp * 100);
    if (force || C.hp1 !== h1) {
      C.hp1 = h1;
      $("#bar1 .fill").style.width = h1 + "%";
      $("#bar1").classList.toggle("low", h1 < 25);
    }
    if (force || C.hp2 !== h2) {
      C.hp2 = h2;
      $("#bar2 .fill").style.width = h2 + "%";
      $("#bar2").classList.toggle("low", h2 < 25);
    }
    $("#bar1 .lag").style.width = Math.round(g.lagHp1 / a.maxHp * 100) + "%";
    $("#bar2 .lag").style.width = Math.round(g.lagHp2 / b.maxHp * 100) + "%";
    if (force) {
      $("#nm1").textContent = a.def.name;
      $("#nm2").textContent = b.def.name;
      const pips = (n, w) => { let s = ""; for (let i = 0; i < CFG.ROUNDS_TO_WIN; i++) s += '<span class="pip' + (i < w ? " on" : "") + '"></span>'; return s; };
      $("#pips1").innerHTML = g.mode === "endless" ? "" : pips(0, g.w1);
      $("#pips2").innerHTML = g.mode === "endless" ? "" : pips(0, g.w2);
      if (g.mode !== "endless") $("#roundLbl").textContent = "Round " + g.round;
    }
    const clk = $("#clock");
    if (g.mode === "endless") {
      clk.textContent = fmtTime(g.survT);
      clk.className = "small";
      const meta = "Foe " + (g.foeIdx + 1) + " · Best " + fmtTime(Math.max(g.best, g.survT));
      if (force || C.meta !== meta) { C.meta = meta; $("#roundLbl").textContent = meta; }
    } else {
      const cl = Math.ceil(g.timer);
      if (force || C.clock !== cl) {
        C.clock = cl;
        clk.textContent = cl < 10 ? "0" + cl : "" + cl;
        clk.className = cl <= 10 ? "warn" : "";
      }
    }
    const c1 = $("#comboP1"), c2 = $("#comboP2");
    if (a.combo > 1) { c1.innerHTML = a.combo + " <b>HITS</b>"; c1.classList.add("on"); } else c1.classList.remove("on");
    if (b.combo > 1) { c2.innerHTML = b.combo + " <b>HITS</b>"; c2.classList.add("on"); } else c2.classList.remove("on");
  },
  showResult(kind) {
    const g = Game;
    $("#resTitle").textContent = kind === "win" ? "You Win" : kind === "lose" ? "You Lose" : "Draw";
    $("#resSub").textContent = ROSTER[this.sel.p1].name + "  vs  " + ROSTER[this.sel.p2].name;
    $("#resScore").textContent = g.w1 + " — " + g.w2;
    $("#resStats").textContent = g.stats.hits + " hits landed · " + g.stats.blocks + " blocked · best combo " + g.stats.maxCombo;
    $("#hud").classList.remove("on");
    this.stack = []; this.show("result");
    Music.play("menu");
  },
  showEndlessOver() {
    const g = Game;
    $("#eoTime").textContent = fmtTime(g.survT);
    $("#eoSub").textContent = (g.foeIdx + 1) + " foes faced · best " + fmtTime(Store.data.bestTime || 0);
    $("#hud").classList.remove("on");
    this.setEndlessHud(false);
    this.stack = []; this.show("endlessOver");
    Music.play("menu");
  },
  defaultBtn() {
    if (!this.cur) return null;
    return this.screens[this.cur].querySelector(".btn");
  }
};

/* ============================================================================
   MAIN — canvas scaling, fixed-step loop, boot, visibility handling, test hooks
   ========================================================================== */
let RSCALE = 1;
const CV = $("#game"), CTX = CV.getContext("2d", { alpha: false });

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const s = Math.min(w / CFG.VW, h / CFG.VH);
  const cap = Game.q >= 2 ? 2 : Game.q === 1 ? 1.5 : 1;
  const dpr = Math.min(window.devicePixelRatio || 1, cap);
  let rs = clamp(s * dpr, .55, 2.2);
  // snapping to 1 (or 2) keeps every blit un-resampled, which is a large win on
  // software-rendered canvases; the compositor does the final stretch for free.
  if (Math.abs(rs - 1) < .34 || Game.q === 0) rs = 1;
  else if (Math.abs(rs - 2) < .22) rs = 2;
  const bw = Math.round(CFG.VW * rs), bh = Math.round(CFG.VH * rs);
  if (CV.width !== bw || CV.height !== bh) { CV.width = bw; CV.height = bh; }
  CV.style.width = Math.round(CFG.VW * s) + "px";
  CV.style.height = Math.round(CFG.VH * s) + "px";
  CV.style.left = Math.round((w - CFG.VW * s) / 2) + "px";
  CV.style.top = Math.round((h - CFG.VH * s) / 2) + "px";
  RSCALE = rs;
  CTX.imageSmoothingEnabled = true;
  CTX.imageSmoothingQuality = Game.q >= 2 ? "medium" : "low";
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));

/* --------------------------------- loop --------------------------------- */
let last = 0, acc = 0, raf = 0, hudT = 0;
let fpsAcc = 0, fpsN = 0, qCheck = 0;

function frame(ts) {
  raf = requestAnimationFrame(frame);
  if (document.hidden) { last = ts; return; }          // no sim, no render
  if (!last) last = ts;
  let dt = (ts - last) / 1000; last = ts;
  if (dt > .25) dt = .25;
  if (dt > 0) { fpsAcc += dt; fpsN++; }

  acc += dt;
  let steps = 0;
  while (acc >= CFG.DT && steps < 5) {
    if (Game.running && !Game.paused && Game.p1) Game.p1.setInput(Input.poll());
    Game.step(CFG.DT);
    acc -= CFG.DT; steps++;
  }
  if (steps === 5) acc = 0;

  if (!Game.running) Game.stepIdle(dt);
  if (Game.p1 && Game.p2) Game.render(CTX);
  else { CTX.setTransform(RSCALE, 0, 0, RSCALE, 0, 0); CTX.fillStyle = "#05050a"; CTX.fillRect(0, 0, CFG.VW, CFG.VH); }

  hudT += dt;
  if (Game.running && hudT > .05) { hudT = 0; UI.syncHud(false); }

  // dynamic quality
  if (Game.autoQ) {
    qCheck += dt;
    if (qCheck > 2 && fpsN > 20) {
      const fps = fpsN / fpsAcc;
      if (fps < 45 && Game.q > 0) { Game.q--; resize(); }
      else if (fps > 57 && Game.q < 2 && !Store.data.reduced) { Game.q++; resize(); }
      qCheck = 0; fpsAcc = 0; fpsN = 0;
    } else if (qCheck > 2) { qCheck = 0; fpsAcc = 0; fpsN = 0; }
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { last = 0; acc = 0; }
  // silence everything while the tab is in the background
  if (Snd.ok) {
    try {
      Snd.master.gain.cancelScheduledValues(Snd.t());
      Snd.master.gain.setTargetAtTime(document.hidden ? 0 : .9, Snd.t(), .05);
    } catch (e) { }
  }
});

/* --------------------------------- boot --------------------------------- */
function bootStep(i, total, label) {
  $("#bootBar").style.width = Math.round(i / total * 100) + "%";
  $("#bootSt").textContent = label;
}
function boot() {
  const steps = [];
  steps.push(["Assembling interface", () => { UI.build(); Input.init(); FX.init(); }]);
  ROSTER.forEach(d => steps.push(["Forging " + d.name.split(" ")[0], () => { Game.atlasFor(d); }]));
  steps.push(["Painting portraits", () => UI.paintPortraits()]);
  const scratch = mkCanvas(CFG.VW, CFG.VH);
  STAGE_DEFS.forEach((s, i) => steps.push(["Building " + s.name, () => {
    if (!UI._thumbScratch) UI._thumbScratch = scratch;
    Stage.load(i);
    const sc = scratch.getContext("2d"); sc.setTransform(1, 0, 0, 1, 0, 0);
    Stage.drawBack(sc, 270, 2); Stage.drawFore(sc, 2);
    const cv = $$("#gridStage .stageCard")[i].querySelector("canvas"), g = cv.getContext("2d");
    g.drawImage(scratch, 0, 0, CFG.VW, CFG.VH, 0, 0, cv.width, cv.height);
  }]));
  steps.push(["Ready", () => {
    Snd.stopAmbience();
    Game.applyQuality(); resize();
    Game.startAttract();
    UI.refreshPicks(); UI.refreshBest();
    $("#boot").style.display = "none";
    UI.show("title");
    Music.play("menu");
  }]);

  let i = 0;
  const run = () => {
    if (i >= steps.length) { window.__READY = true; return; }
    const [label, fn] = steps[i];
    bootStep(i, steps.length, label);
    try { fn(); } catch (e) { console.error("boot step failed:", label, e); }
    i++;
    setTimeout(run, 0);
  };
  run();
}

/* dismiss the rotate advisory */
document.addEventListener("click", e => {
  if (e.target.closest("#rotate")) $("#rotate").classList.add("hide");
});

resize();
boot();
raf = requestAnimationFrame(frame);

/* ============================================================================
   TEST HOOKS — used by the offline verification harness. Harmless at runtime.
   ========================================================================== */
window.__T = {
  ready: () => !!window.__READY,
  ui: () => UI, game: () => Game, snd: () => Snd, input: () => Input,
  roster: () => ROSTER.map(r => r.name),
  stages: () => STAGE_DEFS.map(s => s.name),
  moves: () => MOVES,
  quickVs(p1, p2, st, diff) {
    UI.hideAll(); UI.mode = "vs"; UI.sel.p1 = p1; UI.sel.p2 = p2; UI.sel.stage = st; UI.sel.diff = diff || "medium";
    UI.startVs(); return this.state();
  },
  quickEndless(p1) {
    UI.hideAll(); UI.mode = "endless"; UI.sel.p1 = p1; UI.startEndless(); return this.state();
  },
  /* run N fixed steps with a given P1 input (AI still runs normally) */
  tick(n, inp) {
    for (let i = 0; i < n; i++) {
      if (Game.p1) Game.p1.setInput(inp || { l: 0, r: 0, u: 0, d: 0, a: 0, s: 0, k: 0, f: 0 });
      Game.step(CFG.DT);
    }
    return this.state();
  },
  /* tick with P2's AI disabled and P2 input forced */
  tickBoth(n, i1, i2) {
    const savedAI = Game.ai; Game.ai = null;
    for (let i = 0; i < n; i++) {
      if (Game.p1) Game.p1.setInput(i1 || {});
      if (Game.p2) Game.p2.setInput(i2 || {});
      Game.step(CFG.DT);
    }
    Game.ai = savedAI;
    return this.state();
  },
  autoGuard(mode) { Store.data.autoGuard = mode; Game.applyGuard(); return mode; },
  noAI(v) { if (v) { this._ai = Game.ai; Game.ai = null; } else if (this._ai) { Game.ai = this._ai; this._ai = null; } },
  setHp(a, b) { if (a != null) Game.p1.hp = a; if (b != null) Game.p2.hp = b; },
  setTimer(t) { Game.timer = t; },
  place(x1, x2) { Game.p1.x = x1; Game.p2.x = x2; Game.p1.dir = 1; Game.p2.dir = -1; },
  state() {
    const g = Game, a = g.p1, b = g.p2;
    return {
      screen: UI.cur, mode: g.mode, phase: g.phase, running: g.running, paused: g.paused,
      round: g.round, w1: g.w1, w2: g.w2, timer: g.timer, q: g.q,
      survT: g.survT, foeIdx: g.foeIdx, best: Store.data.bestTime || 0,
      stage: Stage.def ? Stage.def.id : null,
      p1: a && { name: a.def.name, hp: a.hp, st: a.st, x: a.x, y: a.y, dir: a.dir, combo: a.combo, air: a.air, move: a.moveName, crouch: a.crouch },
      p2: b && { name: b.def.name, hp: b.hp, st: b.st, x: b.x, y: b.y, dir: b.dir, combo: b.combo, air: b.air, move: b.moveName, crouch: b.crouch }
    };
  },
  counts() {
    return {
      screens: $$("#ui .screen").length,
      cards: $$("#gridP1 .card").length + $$("#gridP2 .card").length,
      stageCards: $$("#gridStage .stageCard").length,
      touchBtns: $$("#btnPad .tbtn").length,
      atlases: Object.keys(Game.atlases).length
    };
  },
  touch: {
    stick(nx, ny) {
      const T = Input.tc;
      T.l = nx < -.3 ? 1 : 0; T.r = nx > .3 ? 1 : 0;
      T.u = ny < -.52 ? 1 : 0; T.d = ny > .42 ? 1 : 0;
    },
    btn(k, on) { Input.tc[k] = on ? 1 : 0; },
    clear() { for (const k in Input.tc) Input.tc[k] = 0; }
  }
};

</script>
