<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<title>V01D Beatdown</title>
<style>
/* ============================================================
   V01D BEATDOWN — all styles. No external resources, no fonts,
   no network requests of any kind.
   ============================================================ */
:root{
  --void:#06060b;
  --void2:#0b0b14;
  --panel:rgba(14,15,24,.92);
  --edge:#2a2d42;
  --edge2:#3d4266;
  --ink:#e8ecf7;
  --dim:#8a90a8;
  --acc:#42f5c8;      /* primary accent - cyan/mint */
  --acc2:#ff2d6f;     /* danger / P2 */
  --acc3:#ffc23d;     /* warning / gold */
  --p1:#3fd6ff;
  --p2:#ff5a4d;
  --uiScale:1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:none;overscroll-behavior:none;position:fixed;inset:0;
}
body{font-size:16px;line-height:1.35}
canvas{display:block;image-rendering:auto}
.hd{font-family:Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",system-ui,sans-serif;
    letter-spacing:.04em;text-transform:uppercase;font-weight:400}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace}

#app{position:fixed;inset:0;background:#000;overflow:hidden}
#stageWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#game{position:absolute;left:0;top:0;transform-origin:0 0;background:#05050a}

/* ---------- generic UI overlay ---------- */
#ui{position:absolute;inset:0;pointer-events:none;z-index:40}
.screen{
  position:absolute;inset:0;display:none;flex-direction:column;pointer-events:auto;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 14px)
          calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 14px);
  background:
    radial-gradient(120% 90% at 50% 0%,rgba(66,245,200,.07),transparent 60%),
    linear-gradient(180deg,rgba(4,4,9,.94),rgba(6,6,14,.97));
  animation:fadeIn .18s ease-out;
  overflow:hidden;
}
.screen.on{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
}
.screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(150% 120% at 50% 45%,transparent 52%,rgba(0,0,0,.6) 100%);
}
.sc-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- title ---------- */
/* the attract scene shows through the front-of-house screens */
#sc-title,#sc-mode,#sc-diff{background:
  radial-gradient(120% 90% at 50% 0%,rgba(66,245,200,.06),transparent 60%),
  linear-gradient(180deg,rgba(4,4,9,.62),rgba(5,5,12,.86))}
#sc-title .sc-body{justify-content:center}
#sc-title .logo{margin:auto;text-align:center;padding:0 10px;max-width:100%}
.logo h1{
  font-size:clamp(38px,11.5vw,120px);line-height:.86;
  background:linear-gradient(180deg,#ffffff 0%,#9ff7e2 38%,#25b6a0 62%,#0e5b57 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(66,245,200,.35)) drop-shadow(0 5px 0 rgba(0,0,0,.55));
}
.logo .sub{
  margin-top:6px;font-size:clamp(9px,2.4vw,14px);letter-spacing:.55em;color:var(--dim);
  text-transform:uppercase;padding-left:.55em;
}
.logo .rule{height:2px;margin:14px auto 0;max-width:min(560px,86vw);
  background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.65}
.blink{animation:bl 1.25s steps(2,end) infinite}
@keyframes bl{50%{opacity:.25}}

/* ---------- buttons / menus ---------- */
.menu{display:flex;flex-direction:column;gap:9px;align-items:center;margin-top:20px}
.btn{
  position:relative;pointer-events:auto;cursor:pointer;
  min-width:min(320px,74vw);padding:11px 22px;
  font-family:Impact,"Arial Narrow Bold","Arial Black",system-ui,sans-serif;
  letter-spacing:.09em;text-transform:uppercase;font-size:clamp(14px,3.6vw,20px);
  color:var(--ink);text-align:center;
  background:linear-gradient(180deg,rgba(38,42,64,.85),rgba(16,18,30,.9));
  border:1px solid var(--edge);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
  transition:transform .08s ease,background .12s ease,border-color .12s ease,color .12s;
}
.btn:hover,.btn.sel{background:linear-gradient(180deg,rgba(66,245,200,.26),rgba(20,60,58,.6));
  border-color:var(--acc);color:#fff;transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.sm{min-width:auto;padding:8px 15px;font-size:clamp(11px,2.9vw,15px)}
.btn.wide{min-width:min(420px,88vw)}
.btn.ghost{background:linear-gradient(180deg,rgba(20,21,32,.7),rgba(10,11,18,.8))}
.btn.danger:hover{background:linear-gradient(180deg,rgba(255,45,111,.28),rgba(60,14,30,.6));border-color:var(--acc2)}
.btn[disabled]{opacity:.35;pointer-events:none}

.sc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;position:relative;z-index:3}
.sc-title{font-size:clamp(16px,4.4vw,30px);color:#fff;
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.sc-title small{display:block;font-size:10px;letter-spacing:.4em;color:var(--acc);font-family:inherit}
.spacer{flex:1}

/* ---------- character select ---------- */
.selWrap{flex:1;display:flex;gap:12px;min-height:0;margin-top:8px}
.selGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;align-content:center;
  flex:1;overflow-y:auto;padding:2px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card{
  position:relative;cursor:pointer;background:linear-gradient(180deg,#191c2c,#0c0e18);
  border:1px solid var(--edge);overflow:hidden;aspect-ratio:3/4;min-height:78px;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  transition:border-color .12s,transform .1s;
}
.card canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:4px 5px;font-size:clamp(8px,2.1vw,11px);
  background:linear-gradient(0deg,rgba(0,0,0,.92),rgba(0,0,0,0));
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:hover{border-color:#5f6a92;transform:translateY(-2px)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 22px rgba(66,245,200,.3)}
.card.sel2{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2),0 0 22px rgba(255,45,111,.3)}
.card.sel::after,.card.sel2::after{content:attr(data-tag);position:absolute;top:0;left:0;
  background:var(--acc);color:#04211c;font-size:9px;font-weight:700;padding:1px 6px;letter-spacing:.1em}
.card.sel2::after{background:var(--acc2);color:#fff}

.infoPane{width:min(280px,34%);display:flex;flex-direction:column;gap:7px;overflow-y:auto;touch-action:pan-y}
.infoPane h3{font-size:clamp(15px,3.6vw,24px);color:#fff;
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.infoPane .tagline{color:var(--acc);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.infoPane .desc{color:var(--dim);font-size:12px}
.stat{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.stat b{width:52px;font-weight:400;flex:0 0 auto}
.bar{flex:1;height:6px;background:#191d2c;border:1px solid #2b3047;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#1e8f7c)}

/* stage picker */
.stageGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;overflow-y:auto;
  padding:2px;align-content:center;flex:1;touch-action:pan-y;margin-top:8px}
.stageCard{position:relative;cursor:pointer;border:1px solid var(--edge);aspect-ratio:16/9;overflow:hidden;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.stageCard canvas{position:absolute;inset:0;width:100%;height:100%}
.stageCard .nm{position:absolute;left:0;right:0;bottom:0;padding:5px 7px;
  background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);font-size:12px;
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.stageCard.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 20px rgba(66,245,200,.28)}

/* rows / options */
.rows{display:flex;flex-direction:column;gap:7px;overflow-y:auto;flex:1;padding:4px 2px;touch-action:pan-y}
.row{display:flex;align-items:center;gap:10px;padding:8px 11px;background:rgba(18,20,32,.72);
  border:1px solid var(--edge);min-height:42px}
.row .lbl{flex:1;font-size:clamp(11px,2.8vw,14px);letter-spacing:.06em;text-transform:uppercase;color:#cdd4e8}
.row .lbl s{display:block;text-decoration:none;font-size:10px;color:var(--dim);letter-spacing:.02em;text-transform:none}
.seg{display:flex;border:1px solid var(--edge);overflow:hidden;flex:0 0 auto}
.seg b{cursor:pointer;font-weight:400;padding:6px 10px;font-size:clamp(10px,2.5vw,12px);letter-spacing:.08em;
  text-transform:uppercase;background:rgba(12,14,22,.9);color:var(--dim);border-right:1px solid var(--edge)}
.seg b:last-child{border-right:0}
.seg b.on{background:var(--acc);color:#052821}
input[type=range]{-webkit-appearance:none;appearance:none;width:min(160px,36vw);height:22px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:#232839;border:1px solid #333a52}
input[type=range]::-moz-range-track{height:5px;background:#232839;border:1px solid #333a52}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;
  background:var(--acc);border:1px solid #0a3b33;cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--acc);border:1px solid #0a3b33;cursor:pointer}
.val{width:38px;text-align:right;font-size:11px;color:var(--acc)}

.foot{display:flex;gap:8px;justify-content:center;flex:0 0 auto;padding-top:9px;flex-wrap:wrap}
.hintline{text-align:center;color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding-top:6px}

/* ---------- HUD ---------- */
#hud::before{content:"";position:absolute;left:0;right:0;top:0;height:120px;pointer-events:none;
  background:linear-gradient(180deg,rgba(3,4,9,.75),rgba(3,4,9,0))}
#hud{position:absolute;inset:0;pointer-events:none;z-index:20;display:none;
  padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 8px) 0 calc(env(safe-area-inset-left,0px) + 8px)}
#hud.on{display:block}
body.tc-on #hud{padding-right:calc(env(safe-area-inset-right,0px) + 58px)}
.hudTop{display:flex;align-items:flex-start;gap:8px}
.hp{flex:1;min-width:0}
.hp .nameRow{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.hp .nm{font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;
  font-size:clamp(10px,2.6vw,16px);text-shadow:0 2px 0 rgba(0,0,0,.8);white-space:nowrap;overflow:hidden}
.hp.right .nameRow{flex-direction:row-reverse}
.hp .pips{display:flex;gap:4px}
.pip{width:11px;height:11px;border:1px solid #4a5170;background:rgba(0,0,0,.45);transform:rotate(45deg)}
.pip.on{background:var(--acc3);border-color:#fff3c0;box-shadow:0 0 9px rgba(255,194,61,.8)}
.hpbar{position:relative;height:clamp(13px,3vw,20px);border:2px solid #0b0d15;background:#14161f;
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 3px 12px rgba(0,0,0,.6);overflow:hidden}
.hpbar .lag{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(180deg,#ff9a3d,#c22b16);transition:width .35s ease .12s}
.hpbar .fill{position:absolute;top:0;bottom:0;left:0;
  background:linear-gradient(180deg,#a8f7ff 0%,#3fd6ff 30%,#1273c6 78%,#0d4f8c 100%);transition:width .09s linear}
.hp.right .hpbar .lag,.hp.right .hpbar .fill{left:auto;right:0}
.hp.p2 .hpbar .fill{background:linear-gradient(180deg,#ffd0b0 0%,#ff8a4d 28%,#e0432a 78%,#8c1c12 100%)}
.hpbar .gloss{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 46%,rgba(0,0,0,.3))}
.hpbar.low .fill{animation:lowhp .45s ease-in-out infinite alternate}
@keyframes lowhp{to{filter:brightness(1.75) saturate(1.4)}}
.center{flex:0 0 auto;text-align:center;min-width:70px}
#clock{font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;font-size:clamp(22px,6.4vw,44px);line-height:1;
  color:#fff;text-shadow:0 0 14px rgba(66,245,200,.5),0 3px 0 rgba(0,0,0,.85)}
#clock.small{font-size:clamp(15px,4.2vw,30px);color:var(--acc);text-shadow:0 0 14px rgba(66,245,200,.55),0 2px 0 #000}
#clock.warn{color:#ff6a5a;text-shadow:0 0 16px rgba(255,60,60,.75),0 3px 0 rgba(0,0,0,.85)}
.roundLbl{font-size:9px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase;margin-top:1px}
#comboP1,#comboP2{position:absolute;top:16%;font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;
  font-size:clamp(15px,4vw,26px);color:#fff;text-shadow:0 0 12px rgba(255,194,61,.9),0 3px 0 #000;opacity:0;transition:opacity .18s}
#comboP1{left:14px;text-align:left}#comboP2{right:14px;text-align:right}
#comboP1.on,#comboP2.on{opacity:1}
#comboP1 b,#comboP2 b{color:var(--acc3)}

#sigBanner{position:absolute;left:0;right:0;top:42%;text-align:center;pointer-events:none;opacity:0}
#sigBanner span{
  display:inline-block;padding:5px 20px;
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;
  font-size:clamp(15px,3.8vw,30px);color:#fff;
  background:linear-gradient(180deg,rgba(255,194,61,.95),rgba(214,120,20,.95));
  border:1px solid #ffe9a8;color:#2a1600;
  clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%);
  text-shadow:0 1px 0 rgba(255,255,255,.4);
  box-shadow:0 0 26px rgba(255,180,60,.6);
}
#sigBanner.go{animation:sigPop 1.25s cubic-bezier(.14,.9,.3,1) forwards}
@keyframes sigPop{
  0%{opacity:0;transform:translateY(14px) scale(.7)}
  14%{opacity:1;transform:translateY(0) scale(1.1)}
  26%{transform:scale(1)}
  74%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:translateY(-16px) scale(1.05)}
}

/* move list */
.mlWrap{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:8px}
.mlTabs{display:flex;gap:5px;flex-wrap:wrap;flex:0 0 auto;margin-bottom:8px}
.mlTab{cursor:pointer;padding:6px 12px;font-size:clamp(10px,2.6vw,13px);letter-spacing:.08em;text-transform:uppercase;
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;
  background:rgba(16,18,28,.85);border:1px solid var(--edge);color:var(--dim)}
.mlTab.on{background:var(--acc);color:#052821;border-color:var(--acc)}
.mlList{flex:1;overflow-y:auto;touch-action:pan-y;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px;align-content:start;padding-right:2px}
.mlSec{grid-column:1/-1;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);
  padding:8px 2px 2px;border-bottom:1px solid var(--edge)}
.mlRow{display:flex;align-items:center;gap:9px;padding:6px 9px;background:rgba(18,20,32,.6);border:1px solid #232739}
.mlRow .in{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#dfe6f5;
  background:#1b1f2e;border:1px solid #333a52;border-bottom-width:2px;padding:2px 7px;white-space:nowrap;flex:0 0 auto;min-width:64px;text-align:center}
.mlRow .nm{flex:1;font-size:12px;color:#cdd4e8}
.mlRow .nm s{display:block;text-decoration:none;font-size:10px;color:var(--dim)}
.mlRow .dm{font-size:11px;color:var(--acc3);flex:0 0 auto}
.mlRow.sig{background:linear-gradient(90deg,rgba(255,194,61,.14),rgba(18,20,32,.6));border-color:#5c4a20}
.mlRow.sig .nm{color:#ffe0a0}
/* endless HUD */
#endlessHud{position:absolute;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top,0px) + 56px);text-align:center;display:none}
#endlessHud.on{display:block}
#survTime{font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;font-size:clamp(17px,4.6vw,30px);
  color:var(--acc);text-shadow:0 0 14px rgba(66,245,200,.55),0 2px 0 #000;line-height:1}
#survMeta{font-size:9px;letter-spacing:.2em;color:#b9c0d6;text-transform:uppercase;text-shadow:0 1px 2px #000}

/* announcer */
#announce{position:absolute;left:0;right:0;top:16%;height:30%;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:30}
#announce .txt{
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;
  font-size:clamp(26px,8vw,68px);color:#fff;opacity:0;transform:scale(.55);text-align:center;
  text-shadow:0 0 30px rgba(66,245,200,.65),0 6px 0 rgba(0,0,0,.8);
}
#announce .txt.go{animation:ann 1.05s cubic-bezier(.16,.9,.3,1) forwards}
#announce .txt.hold{animation:ann2 .5s cubic-bezier(.16,.9,.3,1) forwards}
@keyframes ann{0%{opacity:0;transform:scale(.5)}18%{opacity:1;transform:scale(1.06)}
  30%{transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
@keyframes ann2{0%{opacity:0;transform:scale(.5)}40%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;z-index:35;display:none;pointer-events:none;
  opacity:var(--tOpacity,.8);touch-action:none}
#touch.on{display:block}
#touch .zone{position:absolute;pointer-events:auto;touch-action:none}
#stickZone{left:0;bottom:0;width:44%;height:74%}
#stickBase{
  position:absolute;width:calc(112px * var(--tScale,1));height:calc(112px * var(--tScale,1));
  border-radius:50%;border:2px solid rgba(190,205,235,.5);
  background:radial-gradient(circle at 50% 42%,rgba(60,70,100,.42),rgba(8,10,18,.5));
  transform:translate(-50%,-50%);pointer-events:none;
  left:calc(env(safe-area-inset-left,0px) + 92px * var(--tScale,1));
  bottom:calc(env(safe-area-inset-bottom,0px) + 78px * var(--tScale,1));top:auto;
  box-shadow:inset 0 0 22px rgba(0,0,0,.55);
}
#stickBase .ring{position:absolute;inset:16%;border-radius:50%;border:1px dashed rgba(190,205,235,.22)}
#stickKnob{
  position:absolute;left:50%;top:50%;width:46%;height:46%;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 42% 34%,#e9f6ff,#5f6f96 58%,#222a40);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 3px 12px rgba(0,0,0,.6)
}
#btnPad{position:absolute;pointer-events:none;
  right:calc(env(safe-area-inset-right,0px) + 14px * var(--tScale,1));
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px * var(--tScale,1));
  width:calc(192px * var(--tScale,1));height:calc(192px * var(--tScale,1))}
.tbtn{position:absolute;pointer-events:auto;width:calc(84px * var(--tScale,1));height:calc(84px * var(--tScale,1));
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;font-size:calc(30px * var(--tScale,1));
  color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.8);border:2px solid rgba(255,255,255,.42);

<script>
"use strict";

/* ============================================================================
   V01D BEATDOWN — core config, math, storage
   ----------------------------------------------------------------------------
   Everything below is original work written for this project. No assets, code
   or audio are copied from any existing game.
   ========================================================================== */

/* ---- THE ONE PLACE TO CHANGE THE TITLE -------------------------------- */
const GAME_TITLE = "V01D Beatdown";
/* ----------------------------------------------------------------------- */

const CFG = {
  title: GAME_TITLE,
  version: "1.0.0",
  VW: 960, VH: 540,            // logical render resolution (16:9)
  GROUND: 462,                 // y of the floor line in logical px
  FPS: 60, DT: 1 / 60,
  ROUND_TIME: 99,
  ROUNDS_TO_WIN: 2,
  MAX_ROUNDS: 5,
  MAX_HP: 100,
  ARENA_W: 1720,               // stage walk-space width
  PUSH_MIN: 52,                // min horizontal separation between fighters
  COMBO_HARD_CAP: 5,           // hit N forces a knockdown -> combo must end
  COMBO_SCALE: [1, .86, .72, .58, .45, .34],
  AUTO_CHIP: .12,             // fraction of damage that leaks through auto guard
  ENDLESS_HEAL: 16,            // % health restored after each Endless win
  ENDLESS_STAGE_EVERY: 3,      // change scenery every N foes
  STORE_KEY: "v01d_beatdown_v1"
};

/* ------------------------------ math utils ------------------------------ */
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const rad = d => d * PI / 180;
const approach = (v, t, s) => v < t ? Math.min(v + s, t) : Math.max(v - s, t);
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutSine(t) { return -(Math.cos(PI * t) - 1) / 2; }
function shortAngle(a, b) { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; }
function lerpAngle(a, b, t) { return a + shortAngle(a, b) * t; }

/* deterministic RNG so procedural art is identical every boot */
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const RNG = mulberry(0x5EED1);          // art / stage RNG
let gRnd = mulberry(0xB00B5);           // gameplay RNG
const rnd = () => gRnd();
const rndR = (a, b) => a + gRnd() * (b - a);
const rndI = (a, b) => Math.floor(a + gRnd() * (b - a + 1));
const pick = arr => arr[Math.floor(gRnd() * arr.length)];

/* ------------------------------ colour utils ---------------------------- */
function hex2rgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
function rgb2hex(r, g, b) {
  return "#" + ((1 << 24) + (Math.round(clamp(r, 0, 255)) << 16) +
    (Math.round(clamp(g, 0, 255)) << 8) + Math.round(clamp(b, 0, 255))).toString(16).slice(1);
}
function shade(hexc, amt) {           // amt -1..1  (negative = darker)
  const [r, g, b] = hex2rgb(hexc);
  if (amt >= 0) return rgb2hex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
  const k = 1 + amt; return rgb2hex(r * k, g * k, b * k);
}
function mixc(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}
function rgba(hexc, a) { const [r, g, b] = hex2rgb(hexc); return `rgba(${r},${g},${b},${a})`; }

/* ------------------------------ formatting ------------------------------ */
function fmtTime(sec) {
  if (sec < 0) sec = 0;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60), d = Math.floor((sec * 10) % 10);
  return m + ":" + (s < 10 ? "0" : "") + s + "." + d;
}

/* ------------------------------ persistence ----------------------------- */
const Store = {
  data: {
    bestTime: 0, bestFoes: 0,
    volMusic: .55, volSfx: .8, volVoice: .8,
    quality: "auto", reduced: false, autoGuard: "player",
    tcVisible: "auto", tcScale: 1, tcOpacity: .8, vibrate: true
  },
  load() {
    try {
      const raw = localStorage.getItem(CFG.STORE_KEY);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) { /* private mode / disabled storage — run with defaults */ }
    return this.data;
  },
  save() {
    try { localStorage.setItem(CFG.STORE_KEY, JSON.stringify(this.data)); }
    catch (e) { /* ignore quota / disabled storage */ }
  }
};
Store.load();

/* ------------------------------ tiny DOM helpers ------------------------ */
const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

/* Offscreen canvas factory (plain canvas — works everywhere, incl. old iOS) */
function mkCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

/* ============================================================================
   AUDIO — 100% procedurally synthesised with the Web Audio API.
   No samples, no files, no network. Three independent buses.
   ========================================================================== */
const Snd = {
  ctx: null, ok: false, ready: false,
  master: null, busMusic: null, busSfx: null, busVoice: null,
  noiseBuf: null, pinkBuf: null,
  _amb: null, _ambName: null,

  init() {
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { this.ctx = new AC(); } catch (e) { return false; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = .9;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 6;
    comp.attack.value = .004; comp.release.value = .18;
    this.master.connect(comp); comp.connect(c.destination);

    this.busMusic = c.createGain(); this.busSfx = c.createGain(); this.busVoice = c.createGain();
    [this.busMusic, this.busSfx, this.busVoice].forEach(b => b.connect(this.master));

    // shared noise buffers (allocated once)
    const n = c.sampleRate * 2;
    this.noiseBuf = c.createBuffer(1, n, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.pinkBuf = c.createBuffer(1, n, c.sampleRate);
    const p = this.pinkBuf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      b0 = .997 * b0 + w * .029; b1 = .985 * b1 + w * .0555; b2 = .95 * b2 + w * .0848;
      p[i] = clamp(b0 + b1 + b2 + w * .0362, -1, 1);
    }
    this.ok = true; this.applyVolumes();
    return true;
  },
  resume() {
    const first = !this.ctx;
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    this.ready = !!this.ctx;
    if (first && this.ok) {
      // replay whatever was requested before the audio context could exist
      const a = this._ambName; this._ambName = null; if (a) this.ambience(a);
      const m = Music.cur; if (m) { Music.cur = null; Music.play(m); }
    }
  },
  applyVolumes() {
    if (!this.ok) return;
    this.busMusic.gain.value = Store.data.volMusic;
    this.busSfx.gain.value = Store.data.volSfx;
    this.busVoice.gain.value = Store.data.volVoice;
  },
  t() { return this.ctx.currentTime; },

  /* ---------- primitive helpers ---------- */
  noise(dur, bus, gain, type, f, q, when) {
    const c = this.ctx, t = when || this.t();
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    s.playbackRate.value = .8 + Math.random() * .4;
    const bq = c.createBiquadFilter(); bq.type = type || "bandpass";
    bq.frequency.value = f; bq.Q.value = q || 1;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + .004);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    s.connect(bq); bq.connect(g); g.connect(bus);
    s.start(t); s.stop(t + dur + .02);
    return { src: s, filt: bq, gain: g };
  },
  tone(type, f0, f1, dur, bus, gain, when, detune) {
    const c = this.ctx, t = when || this.t();
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    if (detune) o.detune.value = detune;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + .006);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + dur + .02);
    return { osc: o, gain: g };
  },

  /* ---------- combat SFX ---------- */
  punch(power) {                     // power 0..1
    if (!this.ok) return; const p = clamp(power, 0, 1);
    this.noise(.055 + p * .05, this.busSfx, .34 + p * .3, "bandpass", 1500 - p * 500, 1.2);
    this.tone("sine", 190 - p * 60, 52, .13 + p * .09, this.busSfx, .38 + p * .34);
    this.noise(.03, this.busSfx, .18 + p * .18, "highpass", 3600, .8);
  },
  kick(power) {
    if (!this.ok) return; const p = clamp(power, 0, 1);
    this.noise(.085 + p * .07, this.busSfx, .3 + p * .3, "bandpass", 780 - p * 220, .9);
    this.tone("triangle", 150 - p * 45, 40, .19 + p * .11, this.busSfx, .42 + p * .34);
    this.tone("sine", 70, 33, .24, this.busSfx, .24 + p * .2);
  },
  block() {
    if (!this.ok) return;
    this.noise(.05, this.busSfx, .3, "bandpass", 2600, 3.2);
    this.tone("square", 420, 240, .06, this.busSfx, .13);
    this.noise(.1, this.busSfx, .12, "highpass", 5200, .7);
  },
  whiff(power) {
    if (!this.ok) return; const p = clamp(power || .4, 0, 1);
    const c = this.ctx, t = this.t(), dur = .17 + p * .08;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const bq = c.createBiquadFilter(); bq.type = "bandpass"; bq.Q.value = 3.4;
    bq.frequency.setValueAtTime(500, t);
    bq.frequency.exponentialRampToValueAtTime(2400 + p * 900, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.13 + p * .1, t + dur * .45);
    g.gain.exponentialRampToValueAtTime(.0007, t + dur);
    s.connect(bq); bq.connect(g); g.connect(this.busSfx);
    s.start(t); s.stop(t + dur + .02);
  },
  step() {
    if (!this.ok) return;
    this.noise(.05, this.busSfx, .1, "lowpass", 420, .6);
    this.tone("sine", 92, 58, .05, this.busSfx, .07);
  },
  knockdown() {
    if (!this.ok) return;
    this.tone("sine", 120, 28, .42, this.busSfx, .5);
    this.noise(.28, this.busSfx, .28, "lowpass", 320, .8);
    this.noise(.12, this.busSfx, .12, "bandpass", 1700, 1.4);
  },
  land() {
    if (!this.ok) return;
    this.noise(.08, this.busSfx, .14, "lowpass", 500, .7);
    this.tone("sine", 110, 45, .09, this.busSfx, .14);
  },
  jump() { if (this.ok) this.tone("sine", 240, 420, .07, this.busSfx, .07); },
  ko() {
    if (!this.ok) return;
    this.tone("sawtooth", 300, 40, .8, this.busSfx, .3);
    this.tone("sine", 90, 32, 1.1, this.busSfx, .38);
    this.noise(.6, this.busSfx, .22, "lowpass", 900, .7);
  },
  menu(kind) {
    if (!this.ok) return;
    if (kind === "move") this.tone("square", 700, 700, .045, this.busSfx, .085);
    else if (kind === "back") { this.tone("square", 420, 250, .09, this.busSfx, .1); }
    else { this.tone("square", 540, 900, .06, this.busSfx, .1); this.tone("square", 900, 1300, .08, this.busSfx, .06, this.t() + .05); }
  },
  bell() {
    if (!this.ok) return;
    for (let i = 0; i < 3; i++)
      this.tone("triangle", 1180 + i * 420, 1160 + i * 420, .55, this.busSfx, .1 / (i + 1), this.t() + i * .003);
  },
  /* ---------- voice: short formant grunts ---------- */
  voice(pitch, kind) {
    if (!this.ok) return;
    const c = this.ctx, t = this.t();
    const base = pitch * (kind === "hurt" ? 1.14 : 1) * (.94 + Math.random() * .12);
    const dur = kind === "hurt" ? .2 : kind === "big" ? .38 : .16;
    const o = c.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(base * 1.28, t);
    o.frequency.exponentialRampToValueAtTime(base * .74, t + dur);
    const o2 = c.createOscillator(); o2.type = "square"; o2.detune.value = 14;
    o2.frequency.setValueAtTime(base * .5, t);
    o2.frequency.exponentialRampToValueAtTime(base * .38, t + dur);
    const fA = c.createBiquadFilter(); fA.type = "bandpass"; fA.Q.value = 7;
    fA.frequency.setValueAtTime(kind === "hurt" ? 720 : 560, t);
    fA.frequency.linearRampToValueAtTime(430, t + dur);
    const fB = c.createBiquadFilter(); fB.type = "bandpass"; fB.Q.value = 9;
    fB.frequency.value = kind === "hurt" ? 1680 : 1180;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.34, t + .015);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    const mix = c.createGain(); mix.gain.value = .55;
    o.connect(fA); o2.connect(fA); fA.connect(g);
    o.connect(fB); fB.connect(mix); mix.connect(g);
    g.connect(this.busVoice);
    o.start(t); o2.start(t); o.stop(t + dur + .02); o2.stop(t + dur + .02);
    // breath layer
    this.noise(dur * .7, this.busVoice, .05, "bandpass", 1400, 1.1);
  },

  /* ---------- stage ambience ---------- */
  ambience(name) {
    if (!this.ok) { this._ambName = name; return; }
    if (this._ambName === name) return;
    this.stopAmbience();
    this._ambName = name;
    if (!name) return;
    const c = this.ctx, t = this.t();
    const out = c.createGain(); out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(.5, t + 1.2);
    out.connect(this.busSfx);
    const nodes = [out];
    const bed = (buf, type, f, q, gain, rate) => {
      const s = c.createBufferSource(); s.buffer = buf; s.loop = true;
      if (rate) s.playbackRate.value = rate;
      const bq = c.createBiquadFilter(); bq.type = type; bq.frequency.value = f; bq.Q.value = q || .8;
      const g = c.createGain(); g.gain.value = gain;
      s.connect(bq); bq.connect(g); g.connect(out); s.start(t);
      nodes.push(s, bq, g); return { s, bq, g };
    };
    const drone = (f, type, gain) => {
      const o = c.createOscillator(); o.type = type || "sine"; o.frequency.value = f;
      const g = c.createGain(); g.gain.value = gain;
      o.connect(g); g.connect(out); o.start(t); nodes.push(o, g); return { o, g };
    };
    let lfo = null;
    if (name === "rooftop") { bed(this.noiseBuf, "bandpass", 2600, .55, .085); bed(this.pinkBuf, "lowpass", 380, .7, .07); drone(58, "sine", .022); }
    else if (name === "subway") { bed(this.pinkBuf, "lowpass", 240, .8, .12); drone(46, "sawtooth", .012); drone(92, "sine", .02); bed(this.noiseBuf, "bandpass", 5200, 2, .012); }
    else if (name === "warehouse") {
      bed(this.pinkBuf, "lowpass", 300, .7, .085); drone(72, "square", .011); drone(36, "sine", .026);
      const l = c.createOscillator(); l.type = "sine"; l.frequency.value = 1.35;
      const lg = c.createGain(); lg.gain.value = .026; l.connect(lg); lg.connect(out.gain); l.start(t); nodes.push(l, lg); lfo = l;
    }
    else if (name === "garage") { bed(this.pinkBuf, "lowpass", 640, .6, .05); bed(this.noiseBuf, "bandpass", 3400, 1.6, .016); drone(64, "sine", .014); }
    else if (name === "alley") { bed(this.pinkBuf, "lowpass", 340, .7, .075); drone(50, "sine", .022); bed(this.noiseBuf, "highpass", 6200, .8, .014); }
    this._amb = { out, nodes, lfo };
  },
  stopAmbience() {
    if (!this._amb) { this._ambName = null; return; }
    const a = this._amb, t = this.t();
    try {
      a.out.gain.cancelScheduledValues(t);
      a.out.gain.setValueAtTime(a.out.gain.value, t);
      a.out.gain.linearRampToValueAtTime(0, t + .35);
      setTimeout(() => {
        a.nodes.forEach(n => { try { if (n.stop) n.stop(); } catch (e) { } try { n.disconnect(); } catch (e) { } });
      }, 480);
    } catch (e) { }
    this._amb = null; this._ambName = null;
  }
};

    if (!this.playing || !Snd.ok || !this.cur) return;

      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.2, t + .01);
      g.gain.exponentialRampToValueAtTime(.001, t + .24);
      osc.connect(flt); sub.connect(flt); flt.connect(g); g.connect(B);
      osc.start(t); sub.start(t); osc.stop(t + .26); sub.stop(t + .26);
    }
    const ln = T.lead[i];
    if (ln != null) {
      const f = this.freq(T.root + 24 + ln);
      const a = c.createOscillator(); a.type = "square"; a.frequency.value = f;
      const b = c.createOscillator(); b.type = "triangle"; b.frequency.value = f; b.detune.value = 9;
      const flt = c.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = 2600; flt.Q.value = 1.4;
      const g = c.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.085, t + .008);
      g.gain.exponentialRampToValueAtTime(.0009, t + .2);
      a.connect(flt); b.connect(flt); flt.connect(g); g.connect(o);
      a.start(t); b.start(t); a.stop(t + .22); b.stop(t + .22);
    }
    const pn = T.pad[i];
    if (pn != null) {
      const f = this.freq(T.root + 12 + pn);
      [0, 7, 15].forEach((iv, k) => {
        const p = c.createOscillator(); p.type = "sawtooth";
        p.frequency.value = f * Math.pow(2, iv / 12); p.detune.value = (k - 1) * 7;
        const flt = c.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = 900 + T.mood * 700;
        const g = c.createGain();
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.035, t + .25);
        g.gain.linearRampToValueAtTime(.0001, t + 1.5);
        p.connect(flt); flt.connect(g); g.connect(B);
        p.start(t); p.stop(t + 1.55);
      });
    }

/* ============================================================================
   CHARACTER ART — procedural, pre-rendered body-part sprite atlases.
   Each fighter gets ONE atlas canvas built at boot containing every body part
   drawn at 2x with anatomical form shading, fabric folds, rim light and
   outlines.  Poses are composed at runtime by blitting the atlas cells through
   a skeleton, so animation frames are re-used and nothing is allocated in the
   combat loop.
   ========================================================================== */
const ART_S = 2;               // atlas supersample
const CELL = 128;              // atlas cell (device px at ART_S)
const ATLAS_COLS = 6, ATLAS_ROWS = 4;

/* ---------------- generic drawing helpers ---------------- */
function smoothClosed(c, pts) {
  const n = pts.length; if (n < 3) return;
  let mx = (pts[n - 1].x + pts[0].x) / 2, my = (pts[n - 1].y + pts[0].y) / 2;
  c.beginPath(); c.moveTo(mx, my);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    c.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
  }
  c.closePath();
}
/* segs: [{y,w,cx}] top->bottom.  Builds a smooth tapered limb outline. */
function limbPath(c, segs) {
  const R = [], L = [];
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i], cx = s.cx || 0;
    R.push({ x: cx + s.w / 2, y: s.y });
    L.push({ x: cx - s.w / 2, y: s.y });
  }
  smoothClosed(c, R.concat(L.reverse()));
}
function grad(c, x0, y0, x1, y1, stops) {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  return g;
}
/* soft elliptical light/shadow blob (radial falloff, no hard edges) */
function blob(c, x, y, rx, ry, col, a, rot) {
  c.save();
  c.translate(x, y); if (rot) c.rotate(rot);
  c.scale(1, ry / rx);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, rgba(col, a));
  g.addColorStop(.55, rgba(col, a * .55));
  g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g;
  c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill();
  c.restore();
}
/* form shading: key light from the upper front (+x), cool bounce on the back */
function shadeLimb(c, segs, base, opt) {
  opt = opt || {};
  const wMax = Math.max.apply(null, segs.map(s => s.w));
  const cx = segs[0].cx || 0;
  const y0 = segs[0].y, y1 = segs[segs.length - 1].y, len = y1 - y0 || 1;
  limbPath(c, segs);
  c.fillStyle = grad(c, cx - wMax * .52, 0, cx + wMax * .52, 0, [
    [0, shade(base, -.34)], [.12, shade(base, -.19)], [.42, shade(base, .02)],
    [.66, shade(base, .13)], [.88, shade(base, -.16)], [1, shade(base, -.34)]
  ]);
  c.fill();
  c.save(); c.clip();
  // soft joint occlusion
  blob(c, cx, y0 + len * .02, wMax * .8, len * .13, "#000000", .2);
  blob(c, cx, y1 - len * .02, wMax * .8, len * .12, "#000000", .18);
  // muscle bellies: [dx, y, rx, ry, rot, amount(+light/-dark)]
  if (opt.muscles) for (const m of opt.muscles)
    blob(c, cx + m[0], m[1], m[2], m[3], m[5] > 0 ? "#ffffff" : "#000000", Math.abs(m[5]), m[4] || 0);
  // specular sheen down the lit side
  blob(c, cx + wMax * .21, (y0 + y1) / 2, wMax * .16, len * .38, "#ffffff", opt.gloss || .1);
  // cool rim on the shadow side
  c.globalAlpha = .3;
  c.strokeStyle = opt.rim || "#8fc6ef"; c.lineWidth = 1.4;
  c.beginPath();
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i], sx = (s.cx || 0) - s.w / 2 + .7;
    i ? c.lineTo(sx, s.y) : c.moveTo(sx, s.y);
  }
  c.stroke(); c.globalAlpha = 1;
  c.restore();
  limbPath(c, segs);
  c.strokeStyle = rgba(shade(base, -.7), .55); c.lineWidth = .95; c.stroke();
}
/* fabric: folds + sheen inside the current clip */
function fabric(c, x, y, w, h, col, seedn, density) {
  const r = mulberry(seedn);
  c.save();
  c.lineCap = "round";
  const n = density || 5;
  for (let i = 0; i < n; i++) {
    const yy = y + h * (.14 + .72 * r()), len = w * (.26 + .42 * r());
    const xx = x + (w - len) * r(), bend = (r() - .5) * h * .12;
    c.beginPath();
    c.moveTo(xx, yy);
    c.quadraticCurveTo(xx + len * .5, yy + bend, xx + len, yy + bend * .35);
    c.strokeStyle = rgba(shade(col, -.55), .16 + r() * .14);
    c.lineWidth = .8 + r() * .5; c.stroke();
    c.beginPath();
    c.moveTo(xx, yy + 1.4);
    c.quadraticCurveTo(xx + len * .5, yy + bend + 1.4, xx + len, yy + bend * .35 + 1.4);
    c.strokeStyle = rgba(shade(col, .5), .09); c.lineWidth = .8; c.stroke();
  }
  c.restore();
}

/* ---- geometry derived from build (logical px, fighter ~176 tall) ---- */
function bodyMetrics(d) {
  const B = d.build, h = B.h;
  return {
    headH: 28 * h, headW: 21 * h,
    neck: 6 * h * B.neck,
    torsoH: 52 * h, chestW: 40 * h * B.sh, waistW: 31 * h * (.86 + B.mass * .16),
    pelvisH: 14 * h, pelvisW: 32 * h * (.9 + B.mass * .12),
    uArm: 35 * h * B.arm, fArm: 32 * h * B.arm,
    uArmW: 12.6 * h * B.mass, fArmW: 10.2 * h * B.mass,
    thigh: 42 * h * B.leg, shin: 40 * h * B.leg,
    thighW: 17.6 * h * B.mass, shinW: 12.6 * h * B.mass,
    footL: 22 * h, footH: 10 * h,
    total: (28 + 6 + 52 + 42 + 40 + 10) * h
  };
}

/* =========================== PART PAINTERS ============================== */
function palOf(d, back) {
  const k = back ? -.30 : 0;
  const f = c => back ? shade(c, k) : c;
  return {
    skin: f(d.skin), skinD: f(d.skinD), shirt: f(d.shirt), shirtD: f(d.shirtD),
    pants: f(d.pants), pantsD: f(d.pantsD), boots: f(d.boots), hair: f(d.hair),
    hair2: f(d.hair2), accent: f(d.accent), jacket: f(d.jacket || d.shirt),
    jacketD: f(d.jacketD || d.shirtD), rim: back ? "#4c6d8f" : "#9fd8ff"
  };
}

/* ======================= ATLAS ASSEMBLY ================================= */
const PART_LIST = [
  "head", "headHurt", "torso", "pelvis", "hairBack",
  "uArmF", "uArmB", "fArmF", "fArmB", "fistF", "fistB",
  "handF", "handB", "thighF", "thighB", "shinF", "shinB", "footF", "footB"

function buildAtlas(def, reuse) {
  const m = bodyMetrics(def);
  const cv = reuse || mkCanvas(ATLAS_COLS * CELL, ATLAS_ROWS * CELL);
  const c = cv.getContext("2d");
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, cv.width, cv.height);
  c.lineJoin = "round"; c.lineCap = "round";
  const parts = {};
  let i = 0;
  const place = (name, ox, oy, fn) => {
    const col = i % ATLAS_COLS, row = (i / ATLAS_COLS) | 0; i++;
    const sx = col * CELL, sy = row * CELL;
    c.save();
    c.beginPath(); c.rect(sx, sy, CELL, CELL); c.clip();
    c.translate(sx + ox * ART_S, sy + oy * ART_S);
    c.scale(ART_S, ART_S);
    fn(c);
    c.restore();
    parts[name] = { sx, sy, sw: CELL, sh: CELL, ox: ox * ART_S, oy: oy * ART_S };
  };
  const tighten = () => {                       // shrink each part to its opaque bounds
    let data;
    try { data = c.getImageData(0, 0, cv.width, cv.height).data; } catch (e) { return; }
    const W = cv.width;
    for (const k in parts) {
      const p = parts[k];
      let x0 = p.sx + CELL, x1 = p.sx - 1, y0 = p.sy + CELL, y1 = p.sy - 1;
      for (let y = p.sy; y < p.sy + CELL; y++) {
        const row = y * W;
        for (let x = p.sx; x < p.sx + CELL; x++) {
          if (data[(row + x) * 4 + 3] > 3) {
            if (x < x0) x0 = x; if (x > x1) x1 = x;
            if (y < y0) y0 = y; if (y > y1) y1 = y;
          }
        }
      }
      if (x1 < x0 || y1 < y0) { p.sw = 1; p.sh = 1; continue; }
      p.ox -= (x0 - p.sx); p.oy -= (y0 - p.sy);
      p.sx = x0; p.sy = y0; p.sw = x1 - x0 + 1; p.sh = y1 - y0 + 1;
    }
  };
  const cM = CELL / ART_S / 2;               // cell mid in logical units
  const isMask = !!def.mask;
  place("head", cM, CELL / ART_S - 12, c2 => isMask ? drawMaskHead(c2, def, m) : drawHead(c2, def, m, false));
  place("headHurt", cM, CELL / ART_S - 12, c2 => isMask ? drawMaskHead(c2, def, m) : drawHead(c2, def, m, true));
  place("torso", cM, CELL / ART_S - 8, c2 => drawTorso(c2, def, m, false));
  place("pelvis", cM, cM, c2 => drawPelvis(c2, def, m, false));
  place("hairBack", cM, 38, c2 => drawHairBack(c2, def, m));
  place("uArmF", cM, 16, c2 => drawUpperArm(c2, def, m, false));
  place("uArmB", cM, 16, c2 => drawUpperArm(c2, def, m, true));
  place("fArmF", cM, 16, c2 => drawForeArm(c2, def, m, false));
  place("fArmB", cM, 16, c2 => drawForeArm(c2, def, m, true));
  place("fistF", cM, cM, c2 => drawFist(c2, def, m, false));
  place("fistB", cM, cM, c2 => drawFist(c2, def, m, true));
  place("handF", cM, cM, c2 => drawHand(c2, def, m, false));
  place("handB", cM, cM, c2 => drawHand(c2, def, m, true));
  place("thighF", cM, 14, c2 => drawThigh(c2, def, m, false));
  place("thighB", cM, 14, c2 => drawThigh(c2, def, m, true));
  place("shinF", cM, 14, c2 => drawShin(c2, def, m, false));
  place("shinB", cM, 14, c2 => drawShin(c2, def, m, true));
  place("footF", cM, cM, c2 => drawFoot(c2, def, m, false));
  place("footB", cM, cM, c2 => drawFoot(c2, def, m, true));

}

/* ============================================================================
   SKELETAL RIG + ANIMATION
   Poses are authored as IK targets (hand/foot positions) so limbs always reach
   naturally and feet stay planted.  Every fighter shares the rig; per-character
   bone lengths and stance offsets keep silhouettes distinct.
   ========================================================================== */

/* two-bone IK. angle convention: 0 = straight down, + = toward +x (forward) */
const _ik = { a1: 0, a2: 0, jx: 0, jy: 0 };
function ik(rx, ry, tx, ty, L1, L2, bend, out) {
  let dx = tx - rx, dy = ty - ry;
  let d = Math.sqrt(dx * dx + dy * dy) || .0001;
  const maxd = (L1 + L2) * .999, mind = Math.abs(L1 - L2) + .5;
  if (d > maxd) { const k = maxd / d; dx *= k; dy *= k; d = maxd; }
  else if (d < mind) { const k = mind / d; dx *= k; dy *= k; d = mind; }
  const base = Math.atan2(dx, dy);
  const ca = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
  const A = Math.acos(ca);
  const a1 = base + bend * A;
  const jx = rx + Math.sin(a1) * L1, jy = ry + Math.cos(a1) * L1;
  out.a1 = a1; out.jx = jx; out.jy = jy;
  out.a2 = Math.atan2((rx + dx) - jx, (ry + dy) - jy);
  out.tx = rx + dx; out.ty = ry + dy;
  return out;
}

/* ------------------------- pose helper ---------------------------------- */
const POSE_KEYS = ["rx", "ry", "sp", "hd", "hFx", "hFy", "hBx", "hBy",
  "fFx", "fFy", "fBx", "fBy", "fistF", "fistB", "ebF", "ebB", "knF", "knB", "hurt"];
const BASE_POSE = {
  rx: 0, ry: .935, sp: .11, hd: -.07,
  hFx: .46, hFy: -.16, hBx: .50, hBy: .06,
  fFx: .21, fFy: .97, fBx: -.27, fBy: .95,
  fistF: 1, fistB: 1, ebF: -1, ebB: -1, knF: 1, knB: 1, hurt: 0
};
function P(o) { const r = {}; for (const k of POSE_KEYS) r[k] = (o && o[k] !== undefined) ? o[k] : BASE_POSE[k]; return r; }
const _tmpPose = P({});
function poseLerp(a, b, t, out) {
  for (let i = 0; i < POSE_KEYS.length; i++) { const k = POSE_KEYS[i]; out[k] = a[k] + (b[k] - a[k]) * t; }
  return out;
}
function sampleAnim(anim, t, out) {
  const K = anim.keys, n = K.length;
  if (n === 1) { return poseLerp(K[0].p, K[0].p, 0, out); }
  let tt = anim.loop ? (t % 1 + 1) % 1 : clamp(t, 0, 1);
  for (let i = 0; i < n - 1; i++) {
    if (tt >= K[i].t && tt <= K[i + 1].t) {
      const span = K[i + 1].t - K[i].t || 1;
      let f = (tt - K[i].t) / span;
      if (anim.ease !== false) f = easeInOutSine(f);
      return poseLerp(K[i].p, K[i + 1].p, f, out);
    }
  }
  return poseLerp(K[n - 1].p, K[n - 1].p, 0, out);
}

/* ============================ POSE DRAWING =============================== */
const _j = {   /* reusable joint scratch — no per-frame allocation */
  px: 0, py: 0, nx: 0, ny: 0, shFx: 0, shFy: 0, shBx: 0, shBy: 0,
  armF: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 }, armB: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 },
  legF: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 }, legB: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 }
};
const _hbJ = {
  px: 0, py: 0, nx: 0, ny: 0, shFx: 0, shFy: 0, shBx: 0, shBy: 0, hipFx: 0, hipBx: 0, hipY: 0, dy: 0,
  armF: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 }, armB: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 },
  legF: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 }, legB: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 }
};
const _hbPose = P({});
function solvePose(atlas, pose, out, plant) {
  const m = atlas.m;
  const L = m.thigh + m.shin, ARM = m.uArm + m.fArm;
  const px = pose.rx * L, py = -pose.ry * L;      // pelvis relative to ankle-line origin
  const sp = pose.sp, cs = Math.cos(sp), sn = Math.sin(sp);
  const upx = (h, ox) => px + ox * cs + h * sn;
  const upy = (h, ox) => py - h * cs + ox * sn;
  out.px = px; out.py = py;
  out.nx = upx(m.torsoH, 0); out.ny = upy(m.torsoH, 0);
  out.shFx = upx(m.torsoH * .82, 4.5); out.shFy = upy(m.torsoH * .82, 4.5);
  out.shBx = upx(m.torsoH * .82, -6.0); out.shBy = upy(m.torsoH * .82, -6.0);
  ik(out.shFx, out.shFy, out.shFx + pose.hFx * ARM, out.shFy + pose.hFy * ARM, m.uArm, m.fArm, pose.ebF, out.armF);
  ik(out.shBx, out.shBy, out.shBx + pose.hBx * ARM, out.shBy + pose.hBy * ARM, m.uArm, m.fArm, pose.ebB, out.armB);
  const hipY = py + m.pelvisH * .12;
  out.hipFx = px + 3.4 * cs; out.hipBx = px - 3.8 * cs; out.hipY = hipY;
  ik(out.hipFx, hipY, px + pose.fFx * L, py + pose.fFy * L, m.thigh, m.shin, pose.knF, out.legF);
  ik(out.hipBx, hipY, px + pose.fBx * L, py + pose.fBy * L, m.thigh, m.shin, pose.knB, out.legB);
  // vertical placement: ankle line -> ground, with optional foot planting
  let dy = -m.footH * .62;
  if (plant) dy -= Math.max(out.legF.ty, out.legB.ty);
  out.dy = dy;
  out.py += dy; out.ny += dy; out.shFy += dy; out.shBy += dy; out.hipY += dy;
  out.armF.jy += dy; out.armF.ty += dy; out.armB.jy += dy; out.armB.ty += dy;
  out.legF.jy += dy; out.legF.ty += dy; out.legB.jy += dy; out.legB.ty += dy;
  return out;
}
/* parts whose art extends DOWN from the pivot (limbs, feet) */
function blit(c, atlas, name, x, y, ang) {
  const p = atlas.parts[name]; if (!p) return;
  c.save(); c.translate(x, y); c.rotate(-ang);
  c.drawImage(atlas.cv, p.sx, p.sy, p.sw, p.sh,
    -p.ox / ART_S, -p.oy / ART_S, p.sw / ART_S, p.sh / ART_S);
  c.restore();
}
/* parts whose art extends UP from the pivot (torso, head, hair) */
function blitUp(c, atlas, name, x, y, ang) {
  const p = atlas.parts[name]; if (!p) return;
  c.save(); c.translate(x, y); c.rotate(ang);
  c.drawImage(atlas.cv, p.sx, p.sy, p.sw, p.sh,
    -p.ox / ART_S, -p.oy / ART_S, p.sw / ART_S, p.sh / ART_S);
  c.restore();
}
/* draws a posed fighter; origin = feet centre on the ground, +x forward */
function drawPosed(c, atlas, pose, plant) {
  const J = solvePose(atlas, pose, _j, plant), m = atlas.m;
  const planted = Math.abs(pose.fFy - pose.ry) < .07, plantedB = Math.abs(pose.fBy - pose.ry) < .07;
  const hipFy = J.legF.jy - Math.cos(J.legF.a1) * m.thigh;
  const hipBy = J.legB.jy - Math.cos(J.legB.a1) * m.thigh;
  // BACK arm
  blit(c, atlas, "uArmB", J.shBx, J.shBy, J.armB.a1);
  blit(c, atlas, "fArmB", J.armB.jx, J.armB.jy, J.armB.a2);
  blit(c, atlas, pose.fistB > .5 ? "fistB" : "handB", J.armB.tx, J.armB.ty, J.armB.a2);
  // BACK leg
  blit(c, atlas, "thighB", J.legB.jx - Math.sin(J.legB.a1) * m.thigh, hipBy, J.legB.a1);
  blit(c, atlas, "shinB", J.legB.jx, J.legB.jy, J.legB.a2);
  blit(c, atlas, "footB", J.legB.tx, J.legB.ty, J.legB.a2 * (plantedB ? .28 : .85));
  // pelvis + torso
  blitUp(c, atlas, "pelvis", J.px, J.hipY, pose.sp);
  blitUp(c, atlas, "torso", J.px, J.hipY, pose.sp);
  // head (+ hair/hood behind)
  blitUp(c, atlas, "hairBack", J.nx, J.ny, pose.sp + pose.hd);
  blitUp(c, atlas, pose.hurt > .5 ? "headHurt" : "head", J.nx, J.ny, pose.sp + pose.hd);
  // FRONT leg
  blit(c, atlas, "thighF", J.legF.jx - Math.sin(J.legF.a1) * m.thigh, hipFy, J.legF.a1);
  blit(c, atlas, "shinF", J.legF.jx, J.legF.jy, J.legF.a2);
  blit(c, atlas, "footF", J.legF.tx, J.legF.ty, J.legF.a2 * (planted ? .28 : .85));
  // FRONT arm
  blit(c, atlas, "uArmF", J.shFx, J.shFy, J.armF.a1);
  blit(c, atlas, "fArmF", J.armF.jx, J.armF.jy, J.armF.a2);
  blit(c, atlas, pose.fistF > .5 ? "fistF" : "handF", J.armF.tx, J.armF.ty, J.armF.a2);
  return J;
}

/* blit only the slice of a parallax layer that is actually on screen */
function layer(c, cv, x, y) {
  let sx = 0, w = cv.width;
  if (x < 0) { sx = Math.floor(-x); w -= sx; x = 0; }
  if (x + w > CFG.VW) w = Math.ceil(CFG.VW - x);
  if (w <= 0) return;
  c.drawImage(cv, sx, 0, w, cv.height, x, y, w, cv.height);
}

  load(i) {
    this.ensureCanvases();
    this.idx = i; this.def = STAGE_DEFS[i]; this.t = 0; this.flash = 0; this.trainT = -7; this.carT = 0;
    const R = mulberry(9001 + i * 131);
    [this.far, this.mid, this.near, this.floor].forEach(cv => {
      const g = cv.getContext("2d"); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
    });
    BUILDERS[i](this.far.getContext("2d"), this.mid.getContext("2d"),
      this.near.getContext("2d"), this.floor.getContext("2d"), R);
    // ambient particle seeding
    for (let k = 0; k < 360; k++) { const o = k * 4; this.rain[o] = R() * (CFG.VW + 200) - 100; this.rain[o + 1] = R() * CFG.VH; this.rain[o + 2] = 8 + R() * 9; this.rain[o + 3] = .3 + R() * .7; }
    for (let k = 0; k < 90; k++) { const o = k * 4; this.motes[o] = R() * CFG.VW; this.motes[o + 1] = 120 + R() * 330; this.motes[o + 2] = .2 + R() * .8; this.motes[o + 3] = R() * TAU; }
    for (let k = 0; k < 60; k++) this.sparks[k * 5 + 4] = -1;
    for (let k = 0; k < 40; k++) { const o = k * 5; this.steam[o + 4] = R() * 3; this.steam[o] = R() * CFG.VW; }
    this.bakeOverlays();
    Snd.ambience(this.def.amb);
  },
  update(dt) {
    this.t += dt;
    const id = this.def.id;
    if (id === "rooftop") {
      if (this.flash > 0) this.flash -= dt * 3.2;
      else if (rnd() < dt * .11) this.flash = 1;
    }
    if (id === "subway") { this.trainT += dt * .34; if (this.trainT > 7) this.trainT = -7 - rnd() * 9; }
    if (id === "garage") { this.carT += dt * .05; if (this.carT > 1.4) this.carT = -.3 - rnd() * .6; }
  },
  /* ---- painting ---- */
  /* all static full-screen washes are baked once per stage load */
  bakeOverlays() {
    const sc = this.skyCv.getContext("2d");
    sc.setTransform(1, 0, 0, 1, 0, 0); sc.clearRect(0, 0, CFG.VW, CFG.VH);
    this.sky(sc, this.def.id);
    const bc = this.bandCv.getContext("2d");
    bc.setTransform(1, 0, 0, 1, 0, 0); bc.clearRect(0, 0, CFG.VW, 230);
    bc.fillStyle = grad(bc, 0, 0, 0, 216,
      [[0, "rgba(2,3,8,0)"], [.62, "rgba(2,3,8,.22)"], [1, "rgba(2,3,8,.5)"]]);
    bc.fillRect(0, 0, CFG.VW, 216);
    const fc = this.foreCv.getContext("2d");
    fc.setTransform(1, 0, 0, 1, 0, 0); fc.clearRect(0, 0, CFG.VW, CFG.VH);
    fc.fillStyle = rgba(this.def.tint, this.def.tintA * .5);
    fc.fillRect(0, 0, CFG.VW, CFG.VH);
    const g = fc.createRadialGradient(CFG.VW / 2, CFG.VH * .48, CFG.VH * .3, CFG.VW / 2, CFG.VH * .5, CFG.VH * .92);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(.62, "rgba(0,0,0,.2)"); g.addColorStop(1, "rgba(0,0,0,.68)");
    fc.fillStyle = g; fc.fillRect(0, 0, CFG.VW, CFG.VH);
  },
  drawBack(c, cam, q) {
    const d = this.def, id = d.id;
    c.drawImage(this.skyCv, 0, 0);
    if (id === "rooftop" && this.flash > 0) { c.fillStyle = rgba("#cfe4ff", this.flash * .3); c.fillRect(0, 0, CFG.VW, CFG.GROUND); }
    const fx = -cam * PX_FAR - 60, mx = -cam * PX_MID - 130, nx = -cam * PX_NEAR - 260;
    layer(c, this.far, fx, CFG.GROUND - FAR_H + 6);
    if (id === "subway" && Math.abs(this.trainT) < 3.4) this.train(c, fx);
    layer(c, this.mid, mx, CFG.GROUND - MID_H + 6);
    layer(c, this.near, nx, CFG.GROUND - NEAR_H + 4);
    layer(c, this.floor, nx, CFG.GROUND - 4);
    c.drawImage(this.bandCv, 0, CFG.GROUND - 190);
    this.ambient(c, cam, q);
  },
  sky(c, id) {
    let g;
    if (id === "rooftop") {
      g = grad(c, 0, 0, 0, CFG.GROUND, [[0, "#080c1a"], [.45, "#111a30"], [1, "#20293f"]]);
      c.fillStyle = g; c.fillRect(0, 0, CFG.VW, CFG.VH);
    } else if (id === "subway") {
      g = grad(c, 0, 0, 0, CFG.GROUND, [[0, "#0a0d14"], [.6, "#10151d"], [1, "#171d26"]]);
      c.fillStyle = g; c.fillRect(0, 0, CFG.VW, CFG.VH);
    } else if (id === "warehouse") {
      g = grad(c, 0, 0, 0, CFG.GROUND, [[0, "#14110e"], [.5, "#1f1a15"], [1, "#2a231b"]]);
      c.fillStyle = g; c.fillRect(0, 0, CFG.VW, CFG.VH);
    } else if (id === "garage") {
      g = grad(c, 0, 0, 0, CFG.GROUND, [[0, "#2b2450"], [.28, "#7a3f63"], [.55, "#d96a44"], [.8, "#f0a45c"], [1, "#f7cf95"]]);
      c.fillStyle = g; c.fillRect(0, 0, CFG.VW, CFG.VH);
      // sun
      const sy = CFG.GROUND - 96;
      c.fillStyle = rgba("#ffe6a8", .9); c.beginPath(); c.arc(CFG.VW * .68, sy, 34, 0, TAU); c.fill();
      c.fillStyle = rgba("#ffd07a", .22); c.beginPath(); c.arc(CFG.VW * .68, sy, 92, 0, TAU); c.fill();
    } else {
      g = grad(c, 0, 0, 0, CFG.GROUND, [[0, "#0a0713"], [.5, "#150c22"], [1, "#231334"]]);
      c.fillStyle = g; c.fillRect(0, 0, CFG.VW, CFG.VH);
    }
  },
  train(c, fx) {
    const p = this.trainT / 3.4;                      // -1..1
    const x = CFG.VW * .5 + p * (CFG.VW + 620);
    const y = CFG.GROUND - 176;
    c.save();
    c.globalAlpha = .9;
    c.fillStyle = "#2b3240";
    c.fillRect(x - 300, y - 60, 600, 96);
    c.fillStyle = "#3d4757"; c.fillRect(x - 300, y - 60, 600, 8);
    for (let i = -4; i <= 4; i++) {
      c.fillStyle = rgba("#ffeec2", .8);
      c.fillRect(x + i * 64 - 22, y - 44, 44, 30);
    }
    c.globalAlpha = 1;
    c.fillStyle = rgba("#fff4d0", .18);
    c.fillRect(x - 320, y - 66, 640, 130);
    c.restore();
  },
  ambient(c, cam, q) {
    const id = this.def.id, t = this.t;
    const N = q === 0 ? 0 : q === 1 ? .45 : 1;
    if (N === 0) return;
    if (id === "rooftop") {
      const n = (360 * N) | 0, R = this.rain;
      c.strokeStyle = rgba("#cfe2f7", .45); c.lineWidth = 1.35;
      c.beginPath();
      for (let k = 0; k < n; k++) {
        const o = k * 4;
        R[o + 1] += R[o + 2] * 78 * CFG.DT; R[o] -= R[o + 2] * 18 * CFG.DT;
        if (R[o + 1] > CFG.VH) { R[o + 1] = -12; R[o] = rnd() * (CFG.VW + 200) - 50; }
        c.moveTo(R[o], R[o + 1]); c.lineTo(R[o] + R[o + 2] * .3, R[o + 1] - R[o + 2] * 2.1);
      }
      c.stroke();
      if (this.flash > .1) { c.fillStyle = rgba("#dbeaff", this.flash * .12); c.fillRect(0, 0, CFG.VW, CFG.VH); }
    } else if (id === "subway") {
      const fl = (Math.sin(t * 13) > .82 || Math.sin(t * 3.1) > .96) ? .5 : 1;
      c.fillStyle = rgba("#cfe9ff", .05 * fl);
      for (let i = 0; i < 4; i++) {
        const x = 130 + i * 240 - cam * PX_NEAR * .3;
        c.beginPath(); c.moveTo(x - 70, 0); c.lineTo(x + 70, 0); c.lineTo(x + 150, CFG.GROUND); c.lineTo(x - 150, CFG.GROUND); c.closePath(); c.fill();
      }
    } else if (id === "warehouse") {
      const S = this.sparks, n = (60 * N) | 0;
      for (let k = 0; k < n; k++) {
        const o = k * 5;
        if (S[o + 4] < 0) { if (rnd() < .012) { S[o] = 250 - cam * PX_MID; S[o + 1] = CFG.GROUND - 210; S[o + 2] = rndR(-70, 70); S[o + 3] = rndR(-40, 30); S[o + 4] = .8; } continue; }
        S[o + 4] -= CFG.DT; S[o] += S[o + 2] * CFG.DT; S[o + 1] += S[o + 3] * CFG.DT; S[o + 3] += 260 * CFG.DT;
        c.fillStyle = rgba("#ffd27a", clamp(S[o + 4], 0, 1));
        c.fillRect(S[o], S[o + 1], 2.2, 2.2);
      }
      const P = this.steam, m = (26 * N) | 0;
      for (let k = 0; k < m; k++) {
        const o = k * 5;
        P[o + 4] -= CFG.DT * .5;
        if (P[o + 4] < 0) { P[o + 4] = 2.6; P[o] = 620 - cam * PX_MID + rndR(-24, 24); P[o + 1] = CFG.GROUND - 40; P[o + 2] = rndR(-9, 9); P[o + 3] = -rndR(16, 34); }
        P[o] += P[o + 2] * CFG.DT; P[o + 1] += P[o + 3] * CFG.DT;
        const a = clamp(P[o + 4] / 2.6, 0, 1);
        c.fillStyle = rgba("#e8ded0", a * .14);
        c.beginPath(); c.arc(P[o], P[o + 1], 12 + (1 - a) * 32, 0, TAU); c.fill();
      }
    } else if (id === "garage") {
      const M = this.motes, n = (90 * N) | 0;
      for (let k = 0; k < n; k++) {
        const o = k * 4;
        M[o + 3] += CFG.DT * .8; M[o] += (14 + Math.sin(M[o + 3]) * 10) * CFG.DT; M[o + 1] += Math.cos(M[o + 3] * .7) * 5 * CFG.DT;
        if (M[o] > CFG.VW + 10) M[o] = -10;
        c.fillStyle = rgba("#ffe4b0", .16 * M[o + 2]);
        c.fillRect(M[o], M[o + 1], 1.8 * M[o + 2] + .6, 1.8 * M[o + 2] + .6);
      }
      if (this.carT > 0 && this.carT < 1) {
        const x = this.carT * (CFG.VW + 200) - 100, y = CFG.GROUND - 118;
        c.fillStyle = rgba("#2a1c22", .8); c.fillRect(x, y, 34, 11);
        c.fillStyle = rgba("#ffe9b0", .6); c.fillRect(x + 30, y + 3, 10, 3);
      }
    } else if (id === "alley") {
      const P = this.steam, m = (30 * N) | 0;
      for (let k = 0; k < m; k++) {
        const o = k * 5;
        P[o + 4] -= CFG.DT * .42;
        if (P[o + 4] < 0) { P[o + 4] = 2.4; P[o] = (k % 2 ? 300 : 720) - cam * PX_NEAR + rndR(-20, 20); P[o + 1] = CFG.GROUND - 6; P[o + 2] = rndR(-7, 7); P[o + 3] = -rndR(20, 40); }
        P[o] += P[o + 2] * CFG.DT; P[o + 1] += P[o + 3] * CFG.DT;
        const a = clamp(P[o + 4] / 2.4, 0, 1);
        c.fillStyle = rgba("#b9d4e8", a * .12);
        c.beginPath(); c.arc(P[o], P[o + 1], 14 + (1 - a) * 36, 0, TAU); c.fill();
      }
      const fl = .75 + Math.sin(t * 9.3) * .06 + (Math.sin(t * 31) > .93 ? -.35 : 0);
      c.fillStyle = rgba("#ff3d94", .05 * fl); c.fillRect(0, CFG.GROUND - 260, CFG.VW, 300);
      c.fillStyle = rgba("#3df0ff", .035); c.fillRect(0, CFG.GROUND - 120, CFG.VW, 170);
    }
  },
  /* light wash + vignette drawn OVER the fighters */
  drawFore(c, q) {
    const d = this.def;
    c.drawImage(this.foreCv, 0, 0);
    if (d.id === "rooftop" && this.flash > .3) {
      c.fillStyle = rgba("#e8f2ff", this.flash * .16); c.fillRect(0, 0, CFG.VW, CFG.VH);
    }
  }
};

/* ------------------------- shared paint helpers ------------------------- */
function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function vgrad(c, x, y, w, h, a, b) { c.fillStyle = grad(c, 0, y, 0, y + h, [[0, a], [1, b]]); c.fillRect(x, y, w, h); }
function windowsGrid(c, x, y, w, h, cell, col, chance, R) {
  for (let yy = y + 4; yy < y + h - 6; yy += cell) {
    for (let xx = x + 4; xx < x + w - 6; xx += cell) {
      if (R() < chance) {
        c.fillStyle = rgba(col, .25 + R() * .6);
        c.fillRect(xx, yy, cell * .55, cell * .62);
      } else { c.fillStyle = rgba("#0a0e18", .5); c.fillRect(xx, yy, cell * .55, cell * .62); }
    }
  }
}
function pipe(c, x, y, len, w, col, vertical) {
  c.save();
  const g = vertical ? grad(c, x, 0, x + w, 0, [[0, shade(col, -.5)], [.4, shade(col, .16)], [1, shade(col, -.42)]])
    : grad(c, 0, y, 0, y + w, [[0, shade(col, -.5)], [.4, shade(col, .16)], [1, shade(col, -.42)]]);
  c.fillStyle = g;
  if (vertical) c.fillRect(x, y, w, len); else c.fillRect(x, y, len, w);
  c.fillStyle = rgba("#000", .35);
  if (vertical) { for (let i = 0; i < len; i += 70) c.fillRect(x - 2, y + i, w + 4, 5); }
  else { for (let i = 0; i < len; i += 70) c.fillRect(x + i, y - 2, 5, w + 4); }
  c.restore();
}
function crate(c, x, y, w, h, col, R) {
  c.fillStyle = grad(c, x, y, x + w, y + h, [[0, shade(col, .12)], [1, shade(col, -.35)]]);
  c.fillRect(x, y, w, h);
  c.strokeStyle = rgba(shade(col, -.6), .8); c.lineWidth = 2; c.strokeRect(x + 1, y + 1, w - 2, h - 2);
  c.beginPath(); c.moveTo(x + 3, y + 3); c.lineTo(x + w - 3, y + h - 3);
  c.moveTo(x + w - 3, y + 3); c.lineTo(x + 3, y + h - 3);
  c.strokeStyle = rgba(shade(col, -.45), .6); c.lineWidth = 3; c.stroke();
}
function neonSign(c, x, y, w, h, col, text) {
  c.save();
  c.fillStyle = rgba("#0d0d14", .85); c.fillRect(x, y, w, h);
  c.strokeStyle = rgba(col, .95); c.lineWidth = 3;
  c.strokeRect(x + 5, y + 5, w - 10, h - 10);
  c.shadowColor = col; c.shadowBlur = 18;
  c.strokeRect(x + 5, y + 5, w - 10, h - 10);
  c.shadowBlur = 0;
  if (text) {
    c.fillStyle = rgba(col, .95);
    c.font = "bold " + Math.floor(h * .38) + "px Impact, Arial Black, sans-serif";
    c.textAlign = "center"; c.textBaseline = "middle";
    c.shadowColor = col; c.shadowBlur = 14;
    c.fillText(text, x + w / 2, y + h / 2);
    c.shadowBlur = 0; c.textAlign = "left"; c.textBaseline = "alphabetic";
  }
  c.restore();
}
function floorStrip(c, w, col, gloss, R) {
  vgrad(c, 0, 0, w, 120, shade(col, .06), shade(col, -.55));
  for (let i = 0; i < 90; i++) {
    const x = R() * w, y = R() * 100, s = 4 + R() * 26;
    c.fillStyle = rgba(R() > .5 ? "#ffffff" : "#000000", .03 + R() * .05);
    c.fillRect(x, y, s, 2 + R() * 3);
  }
  if (gloss) {
    c.fillStyle = grad(c, 0, 0, 0, 60, [[0, rgba(gloss, .18)], [1, rgba(gloss, 0)]]);
    c.fillRect(0, 0, w, 60);
  }
  c.fillStyle = rgba("#000", .45); c.fillRect(0, 0, w, 3);
}

/* ============================================================================
   EFFECTS — fixed-size pools. Nothing is allocated during combat.
   ========================================================================== */
const FX = {
  MAX: 340, p: null, n: 0,
  rings: null, RMAX: 12,
  shakeX: 0, shakeY: 0, shakeMag: 0, shakeT: 0,
  hitStop: 0, flash: 0, flashCol: "#ffffff",
  sprSpark: null, sprSmoke: null, sprStar: null, sprBurst: null, sprFlare: null,

  init() {
    if (this.p) return;
    this.p = new Float32Array(this.MAX * 9);   // x,y,vx,vy,life,max,size,type,rot
    this.rings = new Float32Array(this.RMAX * 5); // x,y,life,max,power
    // pre-rendered particle sprites (avoids per-particle gradient objects)
    const mk = (size, stops) => {
      const cv = mkCanvas(size, size), g = cv.getContext("2d");
      const rg = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      stops.forEach(s => rg.addColorStop(s[0], s[1]));
      g.fillStyle = rg; g.fillRect(0, 0, size, size);
      return cv;
    };
    this.sprSpark = mk(48, [[0, "rgba(255,255,255,1)"], [.25, "rgba(255,236,180,.95)"],
    [.6, "rgba(255,150,60,.35)"], [1, "rgba(255,120,40,0)"]]);
    this.sprSmoke = mk(64, [[0, "rgba(200,205,215,.5)"], [.55, "rgba(170,178,190,.22)"], [1, "rgba(150,160,175,0)"]]);
    this.sprStar = mk(48, [[0, "rgba(255,255,255,1)"], [.3, "rgba(180,235,255,.8)"],
    [.65, "rgba(90,190,255,.28)"], [1, "rgba(60,160,255,0)"]]);
    this.sprFlare = mk(96, [[0, "rgba(255,255,255,1)"], [.18, "rgba(255,246,214,.9)"],
    [.42, "rgba(255,176,86,.42)"], [.78, "rgba(255,110,50,.12)"], [1, "rgba(255,90,40,0)"]]);
    // impact starburst: hot core + tapered spikes, drawn once and re-used
    {
      const S = 160, cv = mkCanvas(S, S), g = cv.getContext("2d");
      g.translate(S / 2, S / 2);
      const core = g.createRadialGradient(0, 0, 0, 0, 0, S * .3);
      core.addColorStop(0, "rgba(255,255,255,1)");
      core.addColorStop(.35, "rgba(255,250,225,.85)");
      core.addColorStop(.7, "rgba(255,196,110,.28)");
      core.addColorStop(1, "rgba(255,150,70,0)");
      g.fillStyle = core;
      g.beginPath(); g.arc(0, 0, S * .3, 0, TAU); g.fill();
      const spikes = 7;
      for (let i = 0; i < spikes; i++) {
        const a = i / spikes * TAU + .18, len = S * (i % 2 ? .3 : .48), w = S * (i % 2 ? .028 : .046);
        g.save(); g.rotate(a);
        const lg = g.createLinearGradient(0, 0, len, 0);
        lg.addColorStop(0, "rgba(255,255,255,.95)");
        lg.addColorStop(.35, "rgba(255,235,180,.6)");
        lg.addColorStop(1, "rgba(255,170,80,0)");
        g.fillStyle = lg;
        g.beginPath(); g.moveTo(0, -w); g.lineTo(len, 0); g.lineTo(0, w); g.closePath(); g.fill();
        g.restore();
      }
      this.sprBurst = cv;
    }
  },
  clear() { this.n = 0; this.shakeMag = 0; this.hitStop = 0; this.flash = 0; for (let i = 0; i < this.RMAX; i++) this.rings[i * 5 + 2] = 0; },
  spawn(x, y, vx, vy, life, size, type) {
    if (this.n >= this.MAX) { // recycle the oldest
      this.n = this.MAX - 1;
      this.p.copyWithin(0, 9);
    }
    const o = this.n * 9; const P = this.p;
    P[o] = x; P[o + 1] = y; P[o + 2] = vx; P[o + 3] = vy;
    P[o + 4] = life; P[o + 5] = life; P[o + 6] = size; P[o + 7] = type; P[o + 8] = rnd() * TAU;
    this.n++;
  },
  ring(x, y, power) {
    for (let i = 0; i < this.RMAX; i++) {
      const o = i * 5;
      if (this.rings[o + 2] <= 0) { this.rings[o] = x; this.rings[o + 1] = y; this.rings[o + 2] = .26; this.rings[o + 3] = .26; this.rings[o + 4] = power; return; }
    }
  },
  hit(x, y, dir, power, blocked, quality) {
    const q = quality === 0 ? .4 : quality === 1 ? .75 : 1;
    const P = clamp(power, .2, 1.2);
    if (blocked) {
      for (let i = 0; i < Math.round(9 * q); i++) {
        const a = rndR(-1.1, 1.1) + (dir > 0 ? 0 : PI);
        const sp = rndR(90, 260);
        this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 30, rndR(.14, .34), rndR(5, 12), 2);
      }
      this.spawn(x, y, 0, 0, .16, 46, 3);           // small guard flash
      this.ring(x, y, .35);
      this.shake(3.2); this.hitStop = .035;
      return;
    }
    // hot core burst, rotated so it reads as a directional strike
    this.spawn(x, y, dir * 46, -20, .18 + P * .07, 96 + P * 104, 3);
    this.spawn(x + dir * 8, y, dir * 24, -12, .15, 72 + P * 78, 5);
    // radial sparks
    const n = Math.round((11 + P * 14) * q);
    for (let i = 0; i < n; i++) {
      const a = rndR(-1.0, 1.0) + (dir > 0 ? 0 : PI);
      const sp = rndR(120, 430) * (.55 + P);
      this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 50,
        rndR(.18, .44), rndR(7, 16) * (.7 + P), 0);
    }
    // fast forward streaks along the strike direction
    const m = Math.round((3 + P * 5) * q);
    for (let i = 0; i < m; i++) {
      const a = rndR(-.45, .45) + (dir > 0 ? 0 : PI);
      const sp = rndR(420, 900) * (.6 + P);
      this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp * .5 - 30,
        rndR(.1, .2), rndR(10, 22) * (.7 + P), 4);
    }
    this.ring(x, y, P);
    this.flash = .26 * P; this.flashCol = "#ffffff";
    this.shake(4 + P * 13);
    this.hitStop = .05 + P * .1;
  },
  dust(x, y, n, up, quality) {
    const q = quality === 0 ? .3 : quality === 1 ? .65 : 1;
    n = Math.max(1, Math.round(n * q));
    for (let i = 0; i < n; i++)
      this.spawn(x + rndR(-14, 14), y, rndR(-60, 60), -rndR(6, 44) * (up || 1), rndR(.3, .7), rndR(12, 30), 1);
  },
  shake(m) { this.shakeMag = Math.max(this.shakeMag, m); this.shakeT = .28; },
  update(dt) {
    const P = this.p;
    for (let i = 0; i < this.n; i++) {
      const o = i * 9;
      P[o + 4] -= dt;
      if (P[o + 4] <= 0) {                 // swap-remove
        const l = (this.n - 1) * 9;
        for (let k = 0; k < 9; k++) P[o + k] = P[l + k];
        this.n--; i--; continue;
      }
      P[o] += P[o + 2] * dt; P[o + 1] += P[o + 3] * dt;
      const t = P[o + 7];
      if (t === 0) { P[o + 3] += 720 * dt; P[o + 2] *= 1 - 1.6 * dt; }
      else if (t === 1) { P[o + 3] -= 18 * dt; P[o + 2] *= 1 - 2.4 * dt; }
      else if (t === 3 || t === 5) { P[o + 2] *= 1 - 7 * dt; P[o + 3] *= 1 - 7 * dt; P[o + 8] += dt * 5.5; }
      else if (t === 4) { P[o + 2] *= 1 - 5.5 * dt; P[o + 3] *= 1 - 5.5 * dt; }
      else { P[o + 3] += 380 * dt; P[o + 2] *= 1 - 2.2 * dt; }
    }
    for (let i = 0; i < this.RMAX; i++) { const o = i * 5; if (this.rings[o + 2] > 0) this.rings[o + 2] -= dt; }
    if (this.shakeT > 0) {
      this.shakeT -= dt;
      const k = clamp(this.shakeT / .28, 0, 1) * this.shakeMag;
      this.shakeX = rndR(-k, k); this.shakeY = rndR(-k * .7, k * .7);
      if (this.shakeT <= 0) { this.shakeX = this.shakeY = 0; this.shakeMag = 0; }
    }
    if (this.flash > 0) this.flash -= dt * 3.4;
    if (this.hitStop > 0) this.hitStop -= dt;
  },
  /* particles live in ARENA-x / SCREEN-y space, so the camera offset is applied
     here exactly once */
  draw(c, camX) {
    const P = this.p;
    c.save();
    c.translate(-(camX || 0), 0);
    c.globalCompositeOperation = "lighter";
    for (let i = 0; i < this.n; i++) {
      const o = i * 9, a = clamp(P[o + 4] / P[o + 5], 0, 1), t = P[o + 7];
      if (t === 1) continue;
      if (t === 3) {                                   // starburst
        const k = 1 - a, s = P[o + 6] * (.42 + k * 1.25);
        c.globalAlpha = Math.pow(a, .55);
        c.save(); c.translate(P[o], P[o + 1]); c.rotate(P[o + 8]);
        c.drawImage(this.sprBurst, -s / 2, -s / 2, s, s);
        c.restore(); continue;
      }
      if (t === 5) {                                   // soft heat flare
        const k = 1 - a, s = P[o + 6] * (.6 + k * 1.6);
        c.globalAlpha = a * .8;
        c.drawImage(this.sprFlare, P[o] - s / 2, P[o + 1] - s / 2, s, s);
        continue;
      }
      if (t === 4) {                                   // velocity streak
        const vx = P[o + 2], vy = P[o + 3], L = P[o + 6] * .06;
        c.globalAlpha = a * .9;
        c.strokeStyle = "#fff3d0"; c.lineWidth = 1.4 + a * 2.4; c.lineCap = "round";
