      break;
    case "retreat":
      o[awayKey] = 1;
      if (this.intentT > .5) this.intent = "approach";
      break;
    case "block":
      o[awayKey] = 1;
      if (srnd() < .02) o.d = 1;
      if (this.intentT > .55) this.intent = "approach";
      break;
    case "rest":                                   // deliberate breathing room
      if (this.intentT > .5 + srnd() * .6) this.intent = "approach";
      break;
    case "jumpin":
      if (!f.air && f.st !== "jump") { o.u = 1; o[towardKey] = 1; }
      else if (f.air && dist < reach * 1.4) this.press("f", 3);
      if (this.intentT > .9) this.intent = "approach";
      break;
    case "attack": {
      if (dist > reach * 1.15) { o[towardKey] = 1; if (this.intentT > .6) this.intent = "approach"; break; }
      if (this.hold <= 0 && (f.st === "idle" || f.st === "walk" || f.st === "crouch" ||
        f.st === "block" || (f.st === "attack" && f.chainOK))) {
        if (this.comboLeft > 0) {
          this.comboLeft--;
          const roll = srnd();
          // deliberately weak choices for easy AI
          if (srnd() < this.throwaway) this.press(spick(["a", "k", "s", "f"]), 3);
          else if (dist < reach * .62) this.press(roll < .4 ? "a" : roll < .68 ? "s" : roll < .86 ? "k" : "f", 3);
          else this.press(roll < .3 ? "k" : roll < .6 ? "f" : roll < .82 ? "s" : "a", 3);
          if (srnd() < this.lowChance + this.lowBias * .35) o.d = 1;   // mix in lows
        } else { this.intent = srnd() < .5 ? "block" : "retreat"; }
      }

    }

  }

};

    this.p2.atlas = this.atlasFor(ROSTER[p2i]);
    this.ai = new AI(this.p2, level, 0);
    this.p2.mods = Object.assign({}, this.p2.mods);
    this.p2.mods.dmg *= (AI_LEVELS[level] || AI_LEVELS.medium).dmg;
    this.applyGuard();
    this.round = 1; this.w1 = 0; this.w2 = 0;
    this.stats = { hits: 0, guards: 0, maxCombo: 0 };
    Stage.load(stageI);
    UI.setEndlessHud(false); UI.setLabHud(false);
    this.beginRound();
    this.running = true;
    Music.play("match");
  },

  /* --------------------------- Signal Ladder -------------------------- */
  startLadder(p1i, stage) {
    this.mode = "ladder";
    this.ladderChar = p1i;
    this.ladderStage = clamp(stage | 0, 0, LADDER_LEVELS.length - 1);
    // the five other competitors, in a stable order, then the Fracture echo
    this.ladderOrder = ROSTER.map((d, i) => i).filter(i => i !== p1i);
    this.p1 = new Fighter(ROSTER[p1i], 0);
    this.p1.atlas = this.atlasFor(ROSTER[p1i]);
    this.stats = { hits: 0, guards: 0, maxCombo: 0 };
    this.spawnLadderOpponent();
    Stage.load(this.ladderStage % STAGE_DEFS.length);
    UI.setEndlessHud(false); UI.setLabHud(false);
    this.round = 1; this.w1 = 0; this.w2 = 0;
    this.beginRound();
    this.running = true;
    Music.play("ladder");
  },
  ladderOpponentDef() {
    const L = LADDER_LEVELS[this.ladderStage];
    if (L && L.fracture) return FRACTURE_DEF;
    return ROSTER[this.ladderOrder[this.ladderStage] !== undefined
      ? this.ladderOrder[this.ladderStage] : this.ladderOrder[0]];
  },
  spawnLadderOpponent() {
    const L = LADDER_LEVELS[this.ladderStage] || LADDER_LEVELS[0];
    const def = this.ladderOpponentDef();
    this.p2 = new Fighter(def, 1);
    this.p2.atlas = this.atlasFor(def);
    this.aiLevel = L.diff;
    this.ai = new AI(this.p2, L.diff, L.boost);
    this.p2.mods = Object.assign({}, def.mods);
    this.p2.mods.dmg *= (AI_LEVELS[L.diff] || AI_LEVELS.medium).dmg;
    this.applyGuard();
  },

  /* -------------------------- Endless Signal -------------------------- */
  startEndless(p1i, diff) {
    this.mode = "endless";
    this.endlessDiff = ENDLESS_TIERS[diff] ? diff : "medium";
    this.p1 = new Fighter(ROSTER[p1i], 0);
    this.p1.atlas = this.atlasFor(ROSTER[p1i]);
    this.oppIdx = 0; this.survT = 0; this.pathOff = 0; this.swapped = false;
    this.hpCarry = CFG.MAX_HP;
    this.best = (Store.data.bestBy[this.endlessDiff] || { t: 0 }).t || 0;
    this.stats = { hits: 0, guards: 0, maxCombo: 0 };
    Stage.load(0);
    this.spawnOpponent();
    this.applyGuard();
    UI.setEndlessHud(true); UI.setLabHud(false);
    this.round = 1; this.w1 = 0; this.w2 = 0;
    this.beginRound();
    this.running = true;
    Music.play("endless");
  },
  /* EXACTLY ONE active opponent at any moment: p2 is replaced, never added to */
  spawnOpponent() {
    const T = ENDLESS_TIERS[this.endlessDiff] || ENDLESS_TIERS.medium;
    const def = makeDroneDef(this.oppIdx);
    this.oppAtlas = buildAtlas(def, this.oppAtlas ? this.oppAtlas.cv : null);
    this.p2 = new Fighter(def, 1);
    this.p2.atlas = this.oppAtlas;
    const boost = clamp(this.oppIdx / T.rampOver, 0, 1);
    let lvl = this.oppIdx < T.stepMed ? "easy" : this.oppIdx < T.stepHard ? "medium" : "hard";
    if (T.floor === "medium" && lvl === "easy") lvl = "medium";
    this.oppTier = lvl; this.oppBoost = boost;
    this.ai = new AI(this.p2, lvl, boost);
    this.p2.maxHp = CFG.MAX_HP * Math.min(T.hpCap, T.hpBase + this.oppIdx * T.hpStep);
    this.p2.hp = this.p2.maxHp;
    this.p2.mods = Object.assign({}, def.mods);
    this.p2.mods.dmg *= T.dmg * (1 + boost * T.dmgRamp);
    this.p2.mods.speed *= 1 + boost * T.speedRamp;
    this.p2.x = CFG.ARENA_W / 2 + 150; this.p2.dir = -1;
    this.applyGuard();
  },

  /* -------------------------- Calibration Lab ------------------------- */
  startLab(p1i, p2i, stageI) {
    this.mode = "lab";
    this.p1 = new Fighter(ROSTER[p1i], 0);
    const oppDef = p2i < 0 ? makeDroneDef(3) : ROSTER[p2i];
    this.p2 = new Fighter(oppDef, 1);
    this.p1.atlas = this.atlasFor(ROSTER[p1i]);
    this.p2.atlas = p2i < 0 ? (this.oppAtlas = buildAtlas(oppDef, this.oppAtlas ? this.oppAtlas.cv : null))
      : this.atlasFor(oppDef);
    this.setLabDummy(this.lab.dummy);
    this.round = 1; this.w1 = 0; this.w2 = 0;
    this.stats = { hits: 0, guards: 0, maxCombo: 0 };
    this.lab.lastTech = ""; this.lab.lastIn = ""; this.lab.lastFrames = "";
    Stage.load(stageI);
    UI.setEndlessHud(false); UI.setLabHud(true);
    this.beginRound();
    this.running = true;
    Music.play("lab");
  },
  setLabDummy(kind) {
    this.lab.dummy = kind;
    if (this.mode !== "lab" || !this.p2) return;
    this.ai = (kind === "cpu") ? new AI(this.p2, "medium", 0) : null;
    if (kind !== "cpu") this.p2.setInput({ l: 0, r: 0, u: 0, d: 0, a: 0, s: 0, k: 0, f: 0 });
    this.applyGuard();
  },
  labReset() {
    if (this.mode !== "lab") return;
    this.p1.reset(CFG.ARENA_W / 2 - 145, 1);
    this.p2.reset(CFG.ARENA_W / 2 + 145, -1);
    this.p1.st = "idle"; this.p1.anim = "idle";
    this.p2.st = "idle"; this.p2.anim = "idle";
    this.lagHp1 = this.p1.hp; this.lagHp2 = this.p2.hp;
    this.stats = { hits: 0, guards: 0, maxCombo: 0 };
    FX.clear();
    this.camX = clamp((this.p1.x + this.p2.x) / 2 - CFG.VW / 2, 0, Math.max(0, CFG.ARENA_W - CFG.VW));
    UI.syncHud(true);
  },

  /* Automatic guard: off / on. It only ever applies to the competitor the
     person is controlling, plus the Lab's guarding training partner. */
  applyGuard() {
    /* Automatic guard changes canBlock() results, so it is part of the
       simulation. Offline it follows the local preference; online BOTH
       fighters take the value agreed at match start, because a preference
       that only one side knows about would desync the fight. */
    if (window.SCNet && SCNet.online) {
      const on = !!SCNet.setup.autoGuard;
      if (this.p1) this.p1.autoGuard = on;
      if (this.p2) this.p2.autoGuard = on;
      return;
    }
    const on = (Store.data.autoGuard || "on") !== "off";
    if (this.p1) this.p1.autoGuard = on;
    if (this.p2) this.p2.autoGuard = (this.mode === "lab" && this.lab.dummy === "guard");
  },

  beginRound() {
    const a = this.p1, b = this.p2;
    a.reset(CFG.ARENA_W / 2 - 145, 1);
    b.reset(CFG.ARENA_W / 2 + 145, -1);
    if (this.mode === "endless") {
      b.maxHp = this.p2.maxHp; b.hp = this.p2.maxHp;
      if (this.oppIdx > 0) a.hp = this.hpCarry;
    }
    this.timer = CFG.ROUND_TIME;
    this.phase = "intro"; this.phaseT = 0;
    this.lagHp1 = a.hp; this.lagHp2 = b.hp;
    FX.clear();
    this.camX = clamp((a.x + b.x) / 2 - CFG.VW / 2, 0, Math.max(0, CFG.ARENA_W - CFG.VW));
    let label;
    if (this.mode === "endless") label = this.oppIdx === 0 ? "ENDLESS SIGNAL" : "OPPONENT " + (this.oppIdx + 1);
    else if (this.mode === "lab") label = "CALIBRATION LAB";
    else if (this.round >= CFG.MAX_ROUNDS) label = "FINAL SIGNAL";
    else label = "ROUND " + this.round;
    UI.announce(label, true);
    this.hudCache.hp1 = -1; this.hudCache.hp2 = -1; this.hudCache.clock = -1; this.hudCache.r = -1;
    UI.syncHud(true);
  },

  /* ------------------------------ stepping ---------------------------- */
  step(dt) {
    if (!this.running || this.paused) return;
    const a = this.p1, b = this.p2;
    if (this.fade > 0 && this.phase !== "travel") this.fade = Math.max(0, this.fade - dt * 2);

    FX.update(dt);
    Stage.update(dt);

    if (this.phase === "travel") { this.stepTravel(dt); return; }

    const frozen = FX.hitStop > 0;
    if (this.phase === "intro") {
      this.phaseT += dt;
      if (this.phaseT > 1.15) {
        this.phase = "fight"; this.phaseT = 0;
        UI.announce(this.mode === "lab" ? "READY" : "SIGNAL START", false); Snd.bell();
      }
    } else if (this.phase === "fight") {
      if (this.mode === "endless") this.survT += dt;
      else if (this.mode !== "lab") {
        this.timer -= dt;
        if (this.timer <= 0) { this.timer = 0; this.endRound("time"); }
      }
    } else if (this.phase === "ko" || this.phase === "roundEnd") {
      this.phaseT += dt;
      if (this.phaseT > 2.3) this.afterRound();
    } else if (this.phase === "over") {
      this.phaseT += dt;
    }

    // the opponent drives the same input struct as the player
    if (this.ai) this.ai.update(dt, a);

    a.update(dt, b, frozen);
    b.update(dt, a, frozen);
    if (!frozen) {
      separate(a, b);
      const r = resolveHits(a, b, this.boxA, this.boxB, this.hbA, this.hbB);
      if (r === "hit") { this.stats.hits++; this.stats.maxCombo = Math.max(this.stats.maxCombo, a.combo, b.combo); }
      else if (r === "block") this.stats.guards++;
      if (this.mode === "lab") this.stepLab(dt);
      else if (this.phase === "fight") {
        if (a.hp <= 0 || b.hp <= 0) this.endRound("calibration");
      }
    }
    // Stability-bar lag
    this.lagHp1 = approach(this.lagHp1, a.hp, 42 * dt);
    this.lagHp2 = approach(this.lagHp2, b.hp, 42 * dt);
    this.camUpdate(dt);
  },
  /* the Lab never ends a round: it restores and reports instead */
  stepLab(dt) {
    const a = this.p1, b = this.p2;
    if (this.lab.regen) {
      if (b.hp < b.maxHp && b.st !== "hit" && b.st !== "blockstun" && b.st !== "knockdown" && b.st !== "downed")
        b.hp = Math.min(b.maxHp, b.hp + 26 * dt);
      if (a.hp < a.maxHp && a.st !== "hit" && a.st !== "blockstun")
        a.hp = Math.min(a.maxHp, a.hp + 18 * dt);
    }
    if (b.hp <= 0) { b.hp = b.maxHp; FX.recalibrate(b.x, CFG.GROUND, b.core); Snd.calibrate(); }
    if (a.hp <= 0) { a.hp = a.maxHp; FX.recalibrate(a.x, CFG.GROUND, a.core); Snd.calibrate(); }
    if (a.moveName && a.moveName !== this._labLast) {
      this._labLast = a.moveName;
      const mv = MOVES[a.moveName];
      const slot = TECH_SLOTS.find(s => moveKeyFor(a.def, s.key) === a.moveName || s.key === a.moveName);
      this.lab.lastTech = mv && mv.sig ? (a.sigName || techName(a.def, a.moveName)) : techName(a.def, slot ? slot.key : a.moveName);
      this.lab.lastIn = slot ? slot.in : "combination";
      this.lab.lastFrames = mv ? (mv.startup + " startup · " + mv.active + " active · " +
        Math.round(mv.recovery * (a.mods.recover || 1)) + " recovery") : "";
    } else if (!a.moveName) this._labLast = null;
  },
  /* keep everyone inside the arena after a viewport / orientation change */
  clampToArena() {
    for (const f of [this.p1, this.p2]) {
      if (!f) continue;
      const half = 30 * f.hScale;
      f.x = clamp(f.x, half, CFG.ARENA_W - half);
    }
    if (this.p1 && this.p2) {
      this.camX = this.camTarget =
        clamp((this.p1.x + this.p2.x) / 2 - CFG.VW / 2, 0, Math.max(0, CFG.ARENA_W - CFG.VW));
    }
  },
  camUpdate(dt) {
    const mid = (this.p1.x + this.p2.x) / 2;
    this.camTarget = clamp(mid - CFG.VW / 2, 0, Math.max(0, CFG.ARENA_W - CFG.VW));
    this.camX += (this.camTarget - this.camX) * Math.min(1, dt * 7);
  },

  endRound(why) {
    const a = this.p1, b = this.p2;
    let winner = null;
    if (why === "calibration") winner = a.hp <= 0 ? (b.hp <= 0 ? null : b) : a;
    else { winner = a.hp > b.hp ? a : b.hp > a.hp ? b : null; }
    this.phase = "ko"; this.phaseT = 0;
    Snd.calibrate();
    FX.shake(12);
    if (this.mode === "endless") {
      if (a.hp <= 0) {                       // the run ends here
        this.phase = "over"; this.phaseT = 0;
        UI.announce("EMERGENCY RECALIBRATION", true);
        a.st = "lose"; a.anim = "recalibrate"; a.animT = 0;
        b.st = "win"; b.anim = "victory"; b.animT = 0;
        FX.recalibrate(a.x, CFG.GROUND, a.core);
        this.saveBest();
        this.running = false;
        setTimeout(() => { if (this.mode === "endless") UI.showEndlessOver(); }, 2000);
        return;
      }
      // opponent recalibrated — it stands down, it is never left on the ground
      b.st = "lose"; b.anim = "recalibrate"; b.animT = 0;
      a.st = "win"; a.anim = "victory"; a.animT = 0;
      FX.recalibrate(b.x, CFG.GROUND, b.core);
      UI.announce("CALIBRATION", true);
      const T = ENDLESS_TIERS[this.endlessDiff] || ENDLESS_TIERS.medium;
      this.hpCarry = Math.min(CFG.MAX_HP, a.hp + T.heal);
      return;
    }
    if (winner === a) { this.w1++; UI.announce(why === "time" ? "TIME · SIGNAL HELD" : "CALIBRATION", true); }
    else if (winner === b) { this.w2++; UI.announce(why === "time" ? "TIME · SIGNAL LOST" : "CALIBRATION", true); }
    else UI.announce("EVEN SIGNAL", true);
    if (winner) {
      winner.st = "win"; winner.anim = "victory"; winner.animT = 0;
      const other = winner === a ? b : a;
      other.st = "lose"; other.anim = "recalibrate"; other.animT = 0;
      FX.recalibrate(other.x, CFG.GROUND, other.core);
      if (!(window.SCNet && SCNet.resim) && rnd() < .8) setTimeout(() => Snd.victory(), 700);
    }
    UI.syncHud(true);
  },
  afterRound() {
    if (this.mode === "endless") {
      this.phase = "travel"; this.travelT = 0; this.phaseT = 0; this.swapped = false;
      Snd.transition();
      return;
    }
    if (this.w1 >= CFG.ROUNDS_TO_WIN || this.w2 >= CFG.ROUNDS_TO_WIN || this.round >= CFG.MAX_ROUNDS) {
      this.phase = "over"; this.phaseT = 0;
      this.running = false;
      const outcome = this.w1 > this.w2 ? "win" : this.w2 > this.w1 ? "lose" : "draw";
      if (this.mode === "ladder") this.finishLadderMatch(outcome);
      else UI.showResult(outcome);
      return;
    }
    this.round++;
    this.beginRound();
  },
  finishLadderMatch(outcome) {
    const charId = ROSTER[this.ladderChar].id;
    const rec = Store.data.ladder[charId] || { stage: 0, done: 0 };
    if (outcome === "win") {
      const next = this.ladderStage + 1;
      rec.stage = Math.max(rec.stage, Math.min(next, LADDER_LEVELS.length));
      if (next >= LADDER_LEVELS.length) {
        rec.done = 1;
        Store.data.memories[charId] = 1;
        this.ladderResult = "complete";
      } else this.ladderResult = "advance";
      Store.data.ladder[charId] = rec;
      Store.save();
    } else this.ladderResult = outcome === "draw" ? "draw" : "lose";
    UI.showLadderResult(this.ladderResult, outcome);
  },
  ladderNext() {
    this.ladderStage = Math.min(this.ladderStage + 1, LADDER_LEVELS.length - 1);
    this.startLadder(this.ladderChar, this.ladderStage);
  },
  stepTravel(dt) {
    this.travelT += dt;
    const T = 2.1, t = this.travelT / T;
    this.pathOff = easeInOutSine(clamp(t, 0, 1)) * 640;
    this.fade = t < .5 ? t * 1.8 : Math.max(0, (1 - t) * 1.8);
    const a = this.p1;
    a.anim = "walkF"; a.animT += dt * 1.5; a.st = "walk"; a.dir = 1;
    if (!this.swapped && t >= .5) {
      this.swapped = true;
      this.oppIdx++;
      if (this.oppIdx % CFG.ENDLESS_STAGE_EVERY === 0)
        Stage.load((Math.floor(this.oppIdx / CFG.ENDLESS_STAGE_EVERY)) % STAGE_DEFS.length);
      this.spawnOpponent();       // replaces p2 outright — never a second actor
      this.beginRound();
      this.phase = "travel";      // beginRound sets intro; keep travelling
      this.p1.hp = this.hpCarry;
      this.lagHp1 = this.hpCarry;
    }
    if (t >= 1) {
      this.swapped = false; this.pathOff = 0; this.fade = 0;
      this.phase = "intro"; this.phaseT = 0;
      this.p1.toNeutral();
    }
  },
  saveBest() {
    const d = this.endlessDiff || "medium";
    const B = Store.data.bestBy;
    if (!B[d]) B[d] = { t: 0, f: 0 };
    this.newRecord = this.survT > B[d].t;
    if (this.newRecord) { B[d].t = this.survT; B[d].f = this.oppIdx + 1; }
    Store.rollupBest();
    Store.save();
    this.best = B[d].t;
  },

  /* ------------------------------ rendering --------------------------- */
  render(c) {
    const cam = this.camX + this.pathOff;
    c.setTransform(RSCALE, 0, 0, RSCALE, 0, 0);
    c.save();
    // Snap the shake to whole device pixels: a fractional translate pushes
    // every subsequent blit onto the resampling path.
    c.translate(Math.round(FX.shakeX * RSCALE) / RSCALE, Math.round(FX.shakeY * RSCALE) / RSCALE);
    Stage.drawBack(c, cam, this.q);
    const a = this.p1, b = this.p2;
    if (a && b) {
      if (a.y < b.y) { b.draw(c, cam); a.draw(c, cam); }
      else { a.draw(c, cam); b.draw(c, cam); }
      a.drawTrail(c, cam); b.drawTrail(c, cam);
    }
    FX.draw(c, cam);
    Stage.drawFore(c, this.q);
    FX.drawFlash(c);
    c.restore();
    if (this.fade > 0) {
      c.fillStyle = rgba("#04070f", clamp(this.fade, 0, 1));
      c.fillRect(0, 0, CFG.VW, CFG.VH);
    }
    if (DEBUG.boxes) this.debugBoxes(c, cam);
  },
  debugBoxes(c, cam) {
    const a = this.p1, b = this.p2; if (!a || !b) return;
    c.save(); c.lineWidth = 1.5;
    for (const f of [a, b]) {
      f.hurtBox(this.hbA);
      c.strokeStyle = "#3fe0ff";
      c.strokeRect(this.hbA[0] - cam, CFG.GROUND + this.hbA[1], this.hbA[2], this.hbA[3]);
      if (f.move && !f.move.noHit && f.moveT >= f.move.startup && f.moveT <= f.move.startup + f.move.active) {
        if (f.attackBox(this.boxA)) {
          c.strokeStyle = "#ffb63d";
          c.strokeRect(this.boxA[0] - cam, CFG.GROUND + this.boxA[1], this.boxA[2], this.boxA[3]);
        }
      }
    }
    c.restore();
  }
};
const DEBUG = { boxes: false };
/* ============================================================================
   INPUT — keyboard + multitouch virtual pad (analog stick + four technique
   buttons). All listeners are attached exactly once, at boot, so no menu,
   round reset or orientation change can ever create a duplicate handler.

   WASD movement is deliberately NOT bound: A, S, D are three of the four
   technique buttons, so binding them to movement would conflict. Movement is
   on the arrow keys, and the Controls screen states this plainly.
   ========================================================================== */
const Input = {
  p1: { l: 0, r: 0, u: 0, d: 0, a: 0, s: 0, k: 0, f: 0 },
  kb: { l: 0, r: 0, u: 0, d: 0, a: 0, s: 0, k: 0, f: 0 },
  tc: { l: 0, r: 0, u: 0, d: 0, a: 0, s: 0, k: 0, f: 0 },
  touchOn: false, bound: false, stickId: -1,
  baseX: 0, baseY: 0, radius: 56, defBase: null,
  btnPointers: {},                      // pointerId -> button key
  lastPointerTouch: false,

  init() {
    if (this.bound) return; this.bound = true;
    const KEYMAP = {
      ArrowLeft: "l", ArrowRight: "r", ArrowUp: "u", ArrowDown: "d",
      KeyA: "a", KeyS: "s", KeyD: "k", KeyF: "f"
    };
    window.addEventListener("keydown", e => {
      Snd.resume();
      // Escape / P / Enter all drive the SAME control as the on-screen pause
      // button; Enter only pauses while a match is live so menus keep using it
      // to confirm.
      const wantsPause = e.code === "Escape" || e.code === "KeyP" ||
        (e.code === "Enter" && Game.running && !Game.paused);
      if (wantsPause) { e.preventDefault(); this.pressPause(); return; }
      if (e.code === "F2") { DEBUG.boxes = !DEBUG.boxes; return; }
      if (e.code === "KeyR" && Game.running && Game.mode === "lab") { Game.labReset(); return; }
      const k = KEYMAP[e.code];
      if (k) { this.kb[k] = 1; e.preventDefault(); }
      if (e.code === "Enter" || e.code === "Space") { const b = UI.defaultBtn(); if (b) { e.preventDefault(); b.click(); } }
    }, { passive: false });
    window.addEventListener("keyup", e => {
      const k = KEYMAP[e.code];
      if (k) { this.kb[k] = 0; e.preventDefault(); }
    }, { passive: false });
    window.addEventListener("blur", () => { for (const k in this.kb) this.kb[k] = 0; this.releaseAll(); });
    // last-resort safety net: any pointer that ends anywhere clears its button
    document.addEventListener("pointerup", e => this.dropPointer(e.pointerId), true);
    document.addEventListener("pointercancel", e => this.dropPointer(e.pointerId), true);

    // ---- touch pad ----
    const zone = $("#stickZone"), base = $("#stickBase"), knob = $("#stickKnob");
    this.defBase = base;

    /* The stylesheet centres the stick with a transform whose SIGN depends on
       which edge it is anchored to. The landscape sheet anchors it by `bottom`
       and uses translate(-50%,-50%); the portrait sheet also anchors by
       `bottom` but uses translate(-50%,50%) to sit it inside the control strip.
       Placing the stick under a finger switches the anchor to `top`, which
       needs -50% in both layouts — so the transform is stated explicitly here
       instead of being inherited from whichever layout happens to be active.
       Without this the portrait stick drew a full diameter BELOW the finger. */
    const setBase = (x, y) => {
      base.style.left = x + "px"; base.style.top = y + "px"; base.style.bottom = "auto";
      base.style.transform = "translate(-50%,-50%)";
    };
    const resetBase = () => {
      base.style.left = ""; base.style.top = ""; base.style.bottom = ""; base.style.transform = "";
      knob.style.left = "50%"; knob.style.top = "50%";
    };
    /* Every pointer coordinate is converted out of physical screen space and
       into the game's own space before it is used for anything. When the app
       is rotated this is what keeps "push right" meaning right. The stick's
       centre and radius are read from layout, which is already app space, and
       are re-read on every grab so a rotation between touches cannot leave a
       stale radius behind. */
    const grabStick = e => {
      const p = Screen.toApp(e.clientX, e.clientY);
      this.stickId = e.pointerId;

      try { zone.setPointerCapture(e.pointerId); } catch (err) { }

      // if the stick was released programmatically (round reset, resume) while a
      // finger was still down, re-adopt that finger instead of ignoring it
      if (this.stickId === -1) { if (e.buttons || e.pressure > 0) grabStick(e); else return; }
      if (e.pointerId !== this.stickId) return;
      const p = Screen.toApp(e.clientX, e.clientY);
      const dx = p.x - this.baseX, dy = p.y - this.baseY;
      const d = Math.hypot(dx, dy) || 1;
      const cl = Math.min(d, this.radius);
      const nx = dx / d * (cl / this.radius), ny = dy / d * (cl / this.radius);
      knob.style.left = (50 + nx * 42) + "%";
      knob.style.top = (50 + ny * 42) + "%";
      const T = this.tc;
      T.l = nx < -.3 ? 1 : 0; T.r = nx > .3 ? 1 : 0;
      T.u = ny < -.52 ? 1 : 0; T.d = ny > .42 ? 1 : 0;
      if (T.u) { T.d = 0; }
      e.preventDefault();
    };
    zone.addEventListener("pointermove", moveStick, { passive: false });
    const endStick = e => {
      if (e.pointerId !== this.stickId) return;
      this.stickId = -1;
      this.tc.l = this.tc.r = this.tc.u = this.tc.d = 0;
      resetBase();
    };
    zone.addEventListener("pointerup", endStick);
    zone.addEventListener("pointercancel", endStick);
    zone.addEventListener("lostpointercapture", endStick);

    const BK = { A: "a", S: "s", D: "k", F: "f" };
    $$("#btnPad .tbtn").forEach(btn => {
      const key = BK[btn.dataset.k];
      btn.addEventListener("pointerdown", e => {
        Snd.resume();
        this.btnPointers[e.pointerId] = key;
        this.tc[key] = 1; btn.classList.add("hit");
        if (Store.data.vibrate && navigator.vibrate) { try { navigator.vibrate(12); } catch (err) { } }
        try { btn.setPointerCapture(e.pointerId); } catch (err) { }
        e.preventDefault();
      }, { passive: false });
      const up = e => {
        if (this.btnPointers[e.pointerId] !== key) return;
        delete this.btnPointers[e.pointerId];

      };
      btn.addEventListener("pointerup", up);
      btn.addEventListener("pointercancel", up);
      btn.addEventListener("lostpointercapture", up);
    });

    /* Gameplay gestures are suppressed, but a single finger inside an open
       menu is left alone so pause, settings and every list still scroll. This
       is checked against the event's own target, so it holds while a match is
       running underneath the pause screen. */
    const inMenu = t => {
      for (let n = t; n && n !== document; n = n.parentNode) {
        if (n.classList && (n.classList.contains("screen") || n.classList.contains("modalBox"))) return true;
      }

    };

      // asking anyway just logs a warning

    // reporting was wrong, this corrects it — and only in the direction of

    // back into onViewChanged(), which refreshes this layer. Adding a second
    // set here is how duplicate handlers get born.
    this.applyTouchPreference();

  /* On   — always show the pad (a desktop player can opt in)

     Auto — show it only on a device that actually has touch input */
  applyTouchPreference() {

    this.setTouch(v === "on" ? true : v === "off" ? false : Device.isTouch());
  },
  /* single entry point for every pause control, on screen or on the keyboard */
  pressPause() {

    if (btn) { btn.classList.add("hit"); setTimeout(() => btn.classList.remove("hit"), 130); }
    UI.togglePause();
  },
  /* the on-screen toggle is itself a touch affordance: it only appears where
     touch is actually available, or where the player has opted in */
  toggleVisible() { return Device.isTouch() || this.touchOn; },
  /* `no-touch` marks a machine with a keyboard rather than a touchscreen, so
     the on-screen controls can carry the keyboard equivalent where it helps. */
  syncDeviceClass() { document.body.classList.toggle("no-touch", !Device.isTouch()); },
  setTouch(on) {
    this.touchOn = !!on;
    this.syncDeviceClass();
    document.body.classList.toggle("tc-on", this.touchOn);
    $("#touch").classList.toggle("on", this.touchOn && Game.running && !Game.paused);
    $("#tcToggle").classList.toggle("on", this.toggleVisible() && Game.running && !Game.paused);
    if (!on) for (const k in this.tc) this.tc[k] = 0;
    if (typeof resize === "function") resize();
  },
  refreshVisible() {
    this.syncDeviceClass();
    document.body.classList.toggle("tc-on", this.touchOn);
    if (typeof resize === "function") resize();
    const live = Game.running && !Game.paused;
    $("#touch").classList.toggle("on", this.touchOn && live);
    $("#tcToggle").classList.toggle("on", this.toggleVisible() && live);
  },
  applyStyle() {
    const t = $("#touch");
    t.style.setProperty("--tScale", Store.data.tcScale);
    t.style.setProperty("--tOpacity", Store.data.tcOpacity);
  },
  poll() {
    const p = this.p1, k = this.kb, t = this.tc;
    p.l = k.l | t.l; p.r = k.r | t.r; p.u = k.u | t.u; p.d = k.d | t.d;
    p.a = k.a | t.a; p.s = k.s | t.s; p.k = k.k | t.k; p.f = k.f | t.f;

  dropPointer(id) {

      delete this.btnPointers[id];
      this.tc[key] = 0;
      $$("#btnPad .tbtn").forEach(b => { if (b.dataset.k && ({ A: "a", S: "s", D: "k", F: "f" })[b.dataset.k] === key) b.classList.remove("hit"); });
    }
    if (this.stickId === id) {
      this.stickId = -1;
      this.tc.l = this.tc.r = this.tc.u = this.tc.d = 0;
      const knob = $("#stickKnob"), base = $("#stickBase");
      if (knob) { knob.style.left = "50%"; knob.style.top = "50%"; }
      if (base) { base.style.left = ""; base.style.top = ""; base.style.bottom = ""; base.style.transform = ""; }
    }
  },
  /* release every held pointer and every capture. Called on pause, resume,
     round transitions, focus loss and whenever the app rotates — after a
     rotation a finger's old position means nothing. */
  releaseAll() {

    });

    this.stickId = -1;
    for (const k in this.tc) this.tc[k] = 0;
    const knob = $("#stickKnob"), base = $("#stickBase");
    if (knob) { knob.style.left = "50%"; knob.style.top = "50%"; }
    if (base) { base.style.left = ""; base.style.top = ""; base.style.bottom = ""; base.style.transform = ""; }
  },
  clearAll() {
    for (const o of [this.kb, this.p1]) for (const k in o) o[k] = 0;
    this.releaseAll();
  }

          <div class="btn wide" data-act="rematch">Run it again</div>
          <div class="btn wide ghost" data-act="changeChar">Change competitor</div>
          <div class="btn wide ghost" data-act="quit">Main menu</div>
        </div></div></div></div>`);

    mk("endlessOver", `<div class="midScroll"><div class="mid"><div class="modalBox">
        <h2 class="hd" id="eoTitle">Emergency Recalibration</h2><p>You held the signal for</p>
        <div class="bigStat" id="eoTime">0:00.0</div>
        <div class="subStat" id="eoSub">—</div>
        <div class="menu" style="margin-top:0">
          <div class="btn wide" data-act="retryEndless">Run again</div>
          <div class="btn wide ghost" data-act="quit">Main menu</div>
        </div></div></div></div>`);

    mk("ladderResult", `<div class="midScroll"><div class="mid"><div class="modalBox">
        <h2 class="hd" id="lrTitle">Signal Victory</h2>
        <p id="lrSub">—</p>
        <div class="memo" id="lrMemo" style="display:none"></div>
        <div class="menu" style="margin-top:0">
          <div class="btn wide" data-act="ladderNext" id="lrNext">Next opponent</div>
          <div class="btn wide ghost" data-act="ladderRetry" id="lrRetry">Try again</div>
          <div class="btn wide ghost" data-act="quit">Main menu</div>
        </div></div></div></div>`);

    this.buildCards();
    this.bindOnce();
    this.syncOptionUI();
  },
  /* `mute` adds a one-tap silence button beside the slider. Dragging a 16px
     thumb to the very end of a 130px track is fiddly on a phone, and "off"
     should not require precision — the button sets the level to exactly zero
     and puts it back where it was on a second tap. */
  rowSlider(label, key, min, max, mute) {
    min = min === undefined ? 0 : min; max = max === undefined ? 1 : max;
    /* the slider and its readout travel together, so a narrow row wraps them
       onto one new line instead of stranding the number on its own */
    return `<div class="row"><div class="lbl">${label}</div>
      <div class="sld">${mute ? `<div class="muteBtn" data-mute="${key}" role="button" tabindex="0">Off</div>` : ""}<input type="range" min="${min}" max="${max}" step="0.05" data-set="${key}">
      <div class="val" data-val="${key}">—</div></div></div>`;
  },
  rowSeg(label, key, opts, sub) {
    return `<div class="row"><div class="lbl">${label}${sub ? "<s>" + sub + "</s>" : ""}</div>
      <div class="seg">${opts.map(o => `<b data-seg="${key}" data-v="${o[0]}">${o[1]}</b>`).join("")}</div></div>`;
  },

  buildCards() {
    ["P1", "P2"].forEach(which => {
      const g = $("#grid" + which);
      g.innerHTML = "";
      ROSTER.forEach((d, i) => {
        const card = el("div", "card");
        card.dataset.act = "pick" + which; card.dataset.i = i;
        card.dataset.tag = which === "P1" ? "YOU" : "CPU";
        const cv = mkCanvas(150, 200); cv.className = "pt";
        card.appendChild(cv);
        card.appendChild(el("div", "nm", d.name));
        g.appendChild(card);
      });
    });
    const sg = $("#gridStage"); sg.innerHTML = "";
    STAGE_DEFS.forEach((s, i) => {
      const c = el("div", "stageCard");
      c.dataset.act = "pickStage"; c.dataset.i = i;
      const cv = mkCanvas(288, 162); c.appendChild(cv);
      c.appendChild(el("div", "nm", s.name + "<span class='sub'>" + s.sub + "</span>"));
      sg.appendChild(c);
    });
  },

  buildMoveList() {
    const tabs = $("#mlTabs");
    if (!tabs.childElementCount) {
      ROSTER.forEach((d, i) => {
        const b = el("div", "mlTab", d.name);
        b.dataset.act = "mlPick"; b.dataset.i = i;
        tabs.appendChild(b);
      });
    }
    this.paintMoveList();
  },
  paintMoveList() {
    const i = clamp(this.mlChar, 0, ROSTER.length - 1);
    const d = ROSTER[i];
    $$("#mlTabs .mlTab").forEach((t, k) => t.classList.toggle("on", k === i));
    const L = $("#mlList");
    const row = (input, name, note, dmg, cls) =>
      '<div class="mlRow' + (cls ? " " + cls : "") + '"><span class="in">' + input + '</span>' +
      '<span class="nm">' + name + (note ? "<s>" + note + "</s>" : "") + '</span>' +
      (dmg ? '<span class="dm">' + dmg + '</span>' : "") + "</div>";
    const dmgOf = k => {
      const mv = MOVES[moveKeyFor(d, k)] || MOVES[k];
      if (!mv || !mv.dmg) return "";
      const mul = d.mods.dmg * (mv.type === "hand" ? d.mods.punch : d.mods.kick);
      return "-" + Math.round(mv.dmg * mul);
    };
    const frames = k => {
      const mv = MOVES[moveKeyFor(d, k)] || MOVES[k];
      if (!mv) return "";
      return mv.startup + "f startup · " + mv.active + "f active · " +
        Math.round(mv.recovery * (d.mods.recover || 1)) + "f recovery";
    };
    let html = "";
    for (let cat = 0; cat < TECH_CATS.length; cat++) {
      html += '<div class="mlSec">' + TECH_CATS[cat] + "</div>";
      TECH_SLOTS.filter(s => s.cat === cat).forEach(s => {
        const note = techNote(d, s.key);
        html += row(s.in, techName(d, s.key), (note ? note + " · " : "") + frames(s.key), dmgOf(s.key));
      });
    }
    html += '<div class="mlSec">Combination routes — shared by every competitor</div>';
    CHAIN_ROUTES.forEach(c => { html += row(c.in, c.note, "", ""); });
    const sigs = SIGS[d.id];
    if (sigs) {
      html += '<div class="mlSec">' + d.name + " — signature routes</div>";
      for (const k in sigs) {
        const s = sigs[k], parts = k.split(",");
        const inp = parts.map(mk2 => ({ jab: "A", cross: "S", lowKick: "D", roundKick: "F" })[mk2] || mk2).join(" → ");
        const mv = MOVES[s.move];
        const mul = d.mods.dmg * (mv.type === "hand" ? d.mods.punch : d.mods.kick);
        html += row(inp, s.name, "safe break · " + parts.length + " contacts",
          "-" + Math.round(mv.dmg * mul), "sig");
      }
    }
    L.innerHTML = html;
  },
  paintPortraits() {
    const pose = P({});
    ["P1", "P2"].forEach(which => {
      $$("#grid" + which + " .card").forEach((card, i) => {
        const cv = card.querySelector("canvas"), g = cv.getContext("2d");
        const d = ROSTER[i], at = Game.atlasFor(d);
        g.clearRect(0, 0, cv.width, cv.height);
        const bg = g.createLinearGradient(0, 0, 0, cv.height);
        bg.addColorStop(0, "#152238"); bg.addColorStop(1, "#080d16");
        g.fillStyle = bg; g.fillRect(0, 0, cv.width, cv.height);
        g.fillStyle = rgba(d.core, .16);
        g.beginPath(); g.arc(cv.width / 2, cv.height * .42, cv.width * .42, 0, TAU); g.fill();
        // a faint hexagonal signal ring behind the frame
        g.strokeStyle = rgba(d.core, .3); g.lineWidth = 1.4;
        g.beginPath();
        for (let k = 0; k <= 6; k++) {
          const a = k / 6 * TAU, r = cv.width * .38;
          const x = cv.width / 2 + Math.cos(a) * r, y = cv.height * .42 + Math.sin(a) * r;
          k ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.stroke();
        g.save();
        g.translate(cv.width / 2 - 4, cv.height - 26);
        g.scale(.88, .88);
        sampleAnim(A.pose, .25, pose);
        drawPosed(g, at, pose, true);
        g.restore();
        g.fillStyle = grad(g, 0, cv.height - 60, 0, cv.height, [[0, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,.7)"]]);
        g.fillRect(0, cv.height - 60, cv.width, 60);
      });
    });
  },

  /* ------------------------------- events -------------------------------- */
  bindOnce() {
    document.addEventListener("click", e => {
      const t = e.target.closest("[data-act]");
      if (!t) return;
      Snd.resume();
      const act = t.dataset.act;
      if (act !== "pickP1" && act !== "pickP2" && act !== "pickStage") Snd.menu(act === "back" ? "back" : "ok");
      else Snd.menu("move");
      this.action(act, t);
    });
    document.addEventListener("input", e => {
      const t = e.target;
      if (t.dataset && t.dataset.set) {
        const k = t.dataset.set, v = parseFloat(t.value);
        Store.data[k] = v; Store.save();
        const lab = document.querySelector('[data-val="' + k + '"]');
        if (lab) lab.textContent = Math.round(v * 100) + "%";
        Snd.applyVolumes(); Input.applyStyle(); Game.applyQuality();
      }
    });
    /* one-tap silence. The level it was at is remembered so the second tap
       restores it; muting something already at zero and tapping again brings
       it back to a sensible default rather than staying silent. */
    document.addEventListener("click", e => {
      const t = e.target.closest("[data-mute]");
      if (!t) return;
      const k = t.dataset.mute, s = Store.data;
      if (s[k] > 0) { s["prev_" + k] = s[k]; s[k] = 0; }
      else { const p = s["prev_" + k]; s[k] = (typeof p === "number" && p > 0) ? p : .7; }
      Store.save();
      Snd.applyVolumes();
      this.syncOptionUI();
      Snd.menu("move");
    });
    document.addEventListener("click", e => {
      const t = e.target.closest("[data-seg]");
      if (!t) return;
      const k = t.dataset.seg; let v = t.dataset.v;
      if (v === "true") v = true; else if (v === "false") v = false;
      if (k === "labDummy") { Game.lab.dummy = v; Game.setLabDummy(v); }
      else if (k === "labRegen") { Game.lab.regen = v; }
      else if (k === "labFrames") { Game.lab.frames = v; this.setLabHud(Game.mode === "lab" && Game.running); }
      else { Store.data[k] = v; Store.save(); }
      this.syncOptionUI();
      Game.applyQuality();
      if (k === "autoGuard") Game.applyGuard();
      if (k === "tcVisible") Input.applyTouchPreference();
      if (k === "orientation") {
        Screen.releaseLock();
        resize();
        Input.releaseAll(); Input.refreshVisible();
        if (Store.data.orientation === "autoLandscape") Screen.tryLock();
      }
      Snd.menu("move");
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && Game.running && !Game.paused) this.togglePause(true);
    });
  },
  action(act, t) {
    switch (act) {
      case "go": this.push(t.dataset.to); break;
      case "back": this.back(); break;
      case "modeMatch": this.mode = "match"; this.push("p1"); this.refreshPicks(); break;
      case "modeEndless": this.mode = "endless"; this.push("p1"); this.refreshPicks(); break;
      case "modeLab": this.mode = "lab"; this.push("p1"); this.refreshPicks(); break;
      case "modeLadder": this.mode = "ladder"; this.push("p1"); this.refreshPicks(); break;
      case "pickP1": this.sel.p1 = +t.dataset.i; Store.data.lastChar = this.sel.p1; Store.save(); this.refreshPicks(); break;
      case "pickP2": this.sel.p2 = +t.dataset.i; this.refreshPicks(); break;
      case "pickP2Random": this.sel.p2 = -1; this.refreshPicks(); this.action("confirmP2", t); break;
      case "pickStage": this.sel.stage = +t.dataset.i; this.refreshPicks(); break;
      case "pickStageRandom": this.sel.stage = -1; this.refreshPicks(); this.action("confirmStage", t); break;
      case "confirmP1":
        if (this.mode === "endless") this.push("diff");
        else if (this.mode === "ladder") this.push("ladder");
        else this.push("p2");
        this.refreshPicks(); break;
      case "confirmP2": this.push("stage"); this.refreshPicks(); break;
      case "confirmStage": this.push(this.mode === "lab" ? "lab" : "diff"); break;
      case "start":
        this.sel.diff = t.dataset.diff;
        Store.data.lastDiff = this.sel.diff; Store.save();
        if (this.mode === "endless") this.startEndless(); else this.startMatch();
        break;
      case "labStart": this.startLab(); break;
      case "labResetBtn": Game.labReset(); this.togglePause(false); break;
      case "ladderStart": this.startLadder(false); break;
      case "ladderRestart": this.startLadder(true); break;
      case "ladderNext": Game.ladderNext(); this.enterMatchUI(); break;
      case "ladderRetry": this.startLadderStage(Game.ladderStage); break;
      case "resume": this.togglePause(false); break;
      case "quit": this.quit(); break;
      case "rematch":
        if (this.mode === "endless") this.startEndless();
        else if (this.mode === "lab") this.startLab();
        else this.startMatch();
        break;
      case "changeChar": this.hideAll(); this.stack = ["mode"]; this.push("p1"); this.refreshPicks(); break;
      case "retryEndless": this.startEndless(); break;
      case "pause": Input.pressPause(); break;
      case "tctoggle":
        Input.setTouch(!Input.touchOn);
        Store.data.tcVisible = Input.touchOn ? "on" : "off"; Store.save(); this.syncOptionUI();
        break;
      case "mlPick": this.mlChar = +t.dataset.i; this.paintMoveList(); break;
      case "clearBest":
        Store.data.bestBy = { easy: { t: 0, f: 0 }, medium: { t: 0, f: 0 }, hard: { t: 0, f: 0 } };
        Store.rollupBest(); Store.save(); this.syncOptionUI(); this.refreshBest();
        break;
      case "clearLadder":
        Store.data.ladder = {}; Store.data.memories = {};
        Store.save(); this.syncOptionUI(); this.refreshPicks();
        break;
    }
  },

  /* ------------------------------ navigation ----------------------------- */
  hideAll() {
    for (const k in this.screens) this.screens[k].classList.remove("on");
    this.cur = null; document.body.classList.remove("inMenu");
  },
  show(name) {
    this.hideAll();
    if (!name) return;
    const s = this.screens[name]; if (!s) return;
    s.classList.add("on"); this.cur = name;
    /* anything except the title is something the player is reading, so
       transient overlays stay off it */
    document.body.classList.toggle("inMenu", name !== "title");
    if (name === "settings") this.syncOptionUI();
    if (name === "diff") this.syncDiffScreen();
    if (name === "ladder") this.buildLadder();
    if (name === "lab") this.syncOptionUI();
    if (name === "moves") {
      this.mlChar = Game.running && Game.p1 && ROSTER.indexOf(Game.p1.def) >= 0
        ? ROSTER.indexOf(Game.p1.def) : this.sel.p1;
      this.buildMoveList();
    }
    if (name === "mode") this.refreshBest();
    if (name === "pause") {
      const r = $("#pauseLabReset");
      if (r) r.style.display = Game.mode === "lab" ? "" : "none";
    }
    if (name === "title" || name === "mode") Music.play("menu");
    else if (name === "p1" || name === "p2" || name === "stage" || name === "diff" ||
      name === "ladder" || name === "lab") { if (!Game.running) Music.play("select"); }
    Input.refreshVisible();
  },
  push(name) { if (this.cur) this.stack.push(this.cur); this.show(name); },
  back() {
    const prev = this.stack.pop();
    if (prev) this.show(prev);
    else if (Game.running) this.togglePause(false);
    else this.show("title");
  },
  quit() {
    Game.running = false; Game.paused = false; Game.mode = "menu";
    Game.startAttract();
    Music.play("menu");
    $("#hud").classList.remove("on");
    this.setEndlessHud(false); this.setLabHud(false);
    Input.clearAll(); Input.refreshVisible();
    this.stack = []; this.show("title");
  },
  togglePause(force) {
    if (!Game.running) return;
    const want = force === undefined ? !Game.paused : !!force;
    if (want === Game.paused) return;
    Game.paused = want;
    if (want) { this.push("pause"); Music.stop(); }
    else {
      this.hideAll(); this.stack = [];
      Music.play(Game.mode === "endless" ? "endless" : Game.mode === "lab" ? "lab" :
        Game.mode === "ladder" ? "ladder" : "match");
    }
    Input.clearAll(); Input.refreshVisible();
  },

  /* ------------------------------- launching ----------------------------- */
  enterMatchUI() {
    this.hideAll(); this.stack = [];
    $("#hud").classList.add("on");
    Game.applyQuality();
    Game.paused = false;
    Input.clearAll(); Input.refreshVisible();
  },
  /* The touch pad is only shown while a match is actually live, so its
     visibility has to be refreshed AFTER the mode has started running — not
     before it, which is when enterMatchUI runs. */
  afterStart() { Input.refreshVisible(); },
  resolveStage() { return this.sel.stage < 0 ? rndI(0, STAGE_DEFS.length - 1) : this.sel.stage; },
  resolveOpp() { return this.sel.p2 < 0 ? rndI(0, ROSTER.length - 1) : this.sel.p2; },
  startMatch() {
    this.mode = "match";
    const opp = this.resolveOpp();
    this.enterMatchUI();
    Game.startMatch(this.sel.p1, opp, this.resolveStage(), this.sel.diff);
    this.afterStart();
  },
  startEndless() {
    this.mode = "endless";
    this.enterMatchUI();
    Game.startEndless(this.sel.p1, this.sel.diff);
    this.afterStart();
  },
  startLab() {
    this.mode = "lab";
    const opp = this.resolveOpp();
    this.enterMatchUI();
    Game.startLab(this.sel.p1, opp, this.resolveStage());
    this.afterStart();
  },
  startLadder(restart) {
    this.mode = "ladder";
    const id = ROSTER[this.sel.p1].id;
    const rec = Store.data.ladder[id] || { stage: 0, done: 0 };
    let stage = restart ? 0 : Math.min(rec.stage || 0, LADDER_LEVELS.length - 1);
    if (restart) { Store.data.ladder[id] = { stage: 0, done: rec.done || 0 }; Store.save(); }
    this.startLadderStage(stage);
  },
  startLadderStage(stage) {
    this.mode = "ladder";
    this.enterMatchUI();
    Game.startLadder(this.sel.p1, stage);
    this.afterStart();
  },

  /* -------------------------------- panes -------------------------------- */
  refreshPicks() {
    $$("#gridP1 .card").forEach((c, i) => c.classList.toggle("sel", i === this.sel.p1));
    $$("#gridP2 .card").forEach((c, i) => c.classList.toggle("sel2", i === this.sel.p2));
    $$("#gridStage .stageCard").forEach((c, i) => c.classList.toggle("sel", i === this.sel.stage));
    this.info("#infoP1", ROSTER[this.sel.p1]);
    this.info("#infoP2", this.sel.p2 < 0 ? null : ROSTER[this.sel.p2]);
    const titles = {
      match: 'Choose your competitor<small>Signal Match</small>',
      endless: 'Choose your competitor<small>Endless Signal</small>',
      lab: 'Choose your competitor<small>Calibration Lab</small>',
      ladder: 'Choose your competitor<small>Signal Ladder</small>'
    };
    const p1t = $("#p1Title"); if (p1t) p1t.innerHTML = titles[this.mode] || titles.match;
    const p2t = $("#p2Title");
    if (p2t) p2t.innerHTML = this.mode === "lab"
      ? 'Choose the training partner<small>Calibration Lab</small>'
      : 'Choose the opponent<small>Computer controlled</small>';
  },
  info(sel, d) {
    const n = $(sel); if (!n) return;
    if (!d) { n.innerHTML = '<h3>Random</h3><div class="tagline">Chosen at the start of the match</div>'; return; }
    const bar = (lb, v) => `<div class="stat"><b>${lb}</b><div class="bar"><i style="width:${v * 20}%;background:linear-gradient(90deg,${d.core},${shade(d.core, -.45)})"></i></div></div>`;
    const done = Store.data.memories[d.id] ? '<div class="tagline" style="color:var(--acc3)">Memory unlocked</div>' : "";
    n.innerHTML =
      `<h3>${d.name}</h3><div class="tagline">${d.tag}</div>${done}` +
      bar("Power", d.stats.pow) + bar("Speed", d.stats.spd) + bar("Reach", d.stats.rng) + bar("Guard", d.stats.def) +
      `<div class="desc">${d.desc}</div>`;
  },
  DIFF_COPY: {
    match: {
      title: 'Opponent skill<small>Difficulty</small>',
      easy: "Slower reactions · short combinations · guards rarely",
      medium: "Balanced reactions · uses movement, guarding and combinations",
      hard: "Fast reactions · tight spacing · punishes recovery — still fair, never reads your inputs",
      foot: "Best two of three rounds"
    },
    endless: {
      title: 'Run difficulty<small>Endless Signal</small>',
      easy: "Opponents stay simple longer · +24% Stability back per match",
      medium: "Steady ramp · +16% Stability back per match",
      hard: "Starts at Medium skill · fast ramp · +9% Stability back",
      foot: "Best times are kept separately for each difficulty"
    }
  },
  syncDiffScreen() {
    const m = this.mode === "endless" ? "endless" : "match";
    const C = this.DIFF_COPY[m];
    $("#diffTitle").innerHTML = C.title;
    $$("#sc-diff .dsub").forEach(s => { s.textContent = C[s.dataset.d]; });
    const f = $("#diffFoot");
    if (m === "endless") {
      const B = Store.data.bestBy || {};
      f.textContent = "Best · " + ["easy", "medium", "hard"].map(k =>
        k.toUpperCase() + " " + ((B[k] && B[k].t > 0) ? fmtTime(B[k].t) : "—")).join(" · ");
    } else f.textContent = C.foot;
  },
  buildLadder() {
    const d = ROSTER[this.sel.p1];
    const rec = Store.data.ladder[d.id] || { stage: 0, done: 0 };
    const order = ROSTER.map((x, i) => i).filter(i => i !== this.sel.p1);
    $("#ladTitle").innerHTML = "Signal Ladder<small>" + d.name + "</small>";
    let html = "";
    LADDER_LEVELS.forEach((L, i) => {
      const oppDef = L.fracture ? FRACTURE_DEF : ROSTER[order[i]];
      const cls = rec.stage > i ? "done" : (rec.stage === i ? "now" : "");
      html += '<div class="ladRow ' + cls + '"><span class="ix">' + (i + 1) + '</span>' +
        '<span class="who">' + oppDef.name + '<s>' + oppDef.tag + ' · ' +
        (AI_LEVELS[L.diff] ? AI_LEVELS[L.diff].name : L.diff) + '</s></span>' +
        '<span class="mk">' + (rec.stage > i ? "Cleared" : rec.stage === i ? "Next" : "Locked") + '</span></div>';
    });
    if (rec.done) html += '<div class="row head"><div class="lbl">Ladder complete — memory entry unlocked</div></div>';
    $("#ladList").innerHTML = html;
    const b = $("#sc-ladder [data-act=ladderStart]");
    if (b) b.textContent = rec.stage > 0 && rec.stage < LADDER_LEVELS.length ? "Continue" : "Begin";
  },
  bestSummary() {
    const B = Store.data.bestBy || {};
    return ["easy", "medium", "hard"].map(k =>
      k.charAt(0).toUpperCase() + k.slice(1) + " " +
      ((B[k] && B[k].t > 0) ? fmtTime(B[k].t) : "—")).join("  ·  ");
  },
  ladderSummary() {
    const done = ROSTER.filter(d => (Store.data.ladder[d.id] || {}).done).length;
    return done + " of " + ROSTER.length + " ladders complete";
  },
  refreshBest() {
    const line = $("#bestLine");
    if (line) line.textContent = "Endless Signal best · " + this.bestSummary();
  },
  syncOptionUI() {
    const s = Store.data;
    $$("[data-set]").forEach(inp => {
      const k = inp.dataset.set;
      if (s[k] === undefined) return;
      inp.value = s[k];

/* Start it. boot() has already been called above, so the game loads behind the
   sequence and is ready by the time it clears — the player never waits twice.

   It starts on its own, at load, before anything else. Nothing is asked of the
   player: no card, no prompt, no click.

   SOUND. Where the browser permits audio at that moment, the whoosh plays from
   the first frame. Where it does not, the picture still runs and the sound is
   lost — that is a deliberate trade, chosen with the cost known.

   The cost, measured rather than assumed: a page opened from a downloaded file
   never earns an autoplay exemption. On file://, over five consecutive loads
   with real clicks and real audio playback in between, a fresh AudioContext
   reported "suspended" every time. So a downloaded copy will run this silently.
   Served over http(s), a browser can grant autoplay from prior engagement, and
   there it is heard.

   Best effort in between: the audio context is resumed at load and again on the
   first interaction of any kind, from a capture-phase listener that runs before
   the sequence's own skip handler. The menu music is held back until the end so
   it can never start underneath the whoosh. */
(function () {
  const W = window;
  let started = false, ctx = null;

  /* The sequence uses the GAME'S audio context, not one of its own. That means
     one context instead of two, nothing to close afterwards, and — the reason
     it matters here — a context this file can keep trying to resume. */
  try { Snd.init(); ctx = Snd.ctx || null; } catch (e) { ctx = null; }
  if (ctx) W.EONS_INTRO_AUDIO_CONTEXT = ctx;
  const wake = () => { try { if (ctx && ctx.state === "suspended") ctx.resume(); } catch (e) { } };
  wake();
  /* Capture phase, so this runs BEFORE the sequence's own skip handler: an
     interaction that is not a skip brings the sound in for the rest of the run,
     and one that is a skip still leaves the game's audio unlocked. */
  ["pointerdown", "touchstart", "mousedown", "keydown"].forEach(t =>
    W.addEventListener(t, wake, true));

  /* Hold the menu music until the sequence is over. Boot finishes underneath
     it, and the title screen asks for music the moment it appears; without
     this the track would start underneath the whoosh. */
  let heldTrack = null, realPlay = null;
  try {
    realPlay = Music.play.bind(Music);
    Music.play = name => { heldTrack = name; };
  } catch (e) { realPlay = null; }
  const releaseMusic = () => {
    try {
      if (realPlay) { Music.play = realPlay; realPlay = null; if (heldTrack) Music.play(heldTrack); }
    } catch (e) { }
  };

  const done = () => {
    W.__INTRO_DONE = true;
    try { Snd.resume(); } catch (e) { }
    releaseMusic();
    try { Screen.schedule(); } catch (e) { }
  };
  const start = () => {
    if (started) return; started = true;
    wake();
    try {
      if (W.Eons2EonsIntro && W.EONS_INTRO_ENABLED !== false) W.Eons2EonsIntro.play(done);
      else done();
    } catch (e) { console.error("intro failed to start:", e); done(); }
  };

  if (W.EONS_INTRO_ENABLED === false) { releaseMusic(); done(); }
  else start();
})();

<script>
/* ===========================================================================
   EonNet — drop-in multiplayer client
   ---------------------------------------------------------------------------
   One file. No dependencies. Works from any origin (itch.io, GitHub Pages,
   your own site, file://). Same file for every game — only `game` changes.

       const net = EonNet.create({
         url:   'wss://eonnet.<subdomain>.workers.dev',
         game:  'signal-clash',
         build: '1.21',
         name:  'GUY',
         input: 'pointer'          // 'pointer' | 'touch'
       });

   CONTROL PLANE  -> WebSocket to the lobby (cheap, free tier)
   DATA PLANE     -> WebRTC DataChannel peer-to-peer (free at any scale),
                     with automatic relay fallback when ICE fails.
   =========================================================================== */
(function (root) {
  'use strict';

  var PROTO = 1;
  var DEF_ICE = [
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'stun:stun.l.google.com:19302' }
  ];

  function now() { return Date.now(); }
  function noop() { }

  /* tiny event emitter */
  function Bus() { this.m = {}; }
  Bus.prototype.on = function (k, fn) { (this.m[k] || (this.m[k] = [])).push(fn); return this; };
  Bus.prototype.off = function (k, fn) {
    var a = this.m[k]; if (!a) return this;
    var i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); return this;
  };
  Bus.prototype.emit = function (k, a, b) {
    var l = this.m[k]; if (!l) return;
    for (var i = 0; i < l.length; i++) { try { l[i](a, b); } catch (e) { console.error('[eonnet]', k, e); } }
  };

  /* a wrong server URL must fail with a clear error, not a JSON parse crash */
  function readJson(r) {
    var ct = r.headers.get('content-type') || '';
    if (ct.indexOf('json') < 0) {
      return r.text().then(function () { throw new Error('bad_server_response'); });
    }
    return r.json();
  }

  function httpBase(url) {
    return url.replace(/^ws/, 'http').replace(/\/+$/, '');
  }

  function EonNet(opt) {
    Bus.call(this);
    this.opt = opt || {};
    this.url = (this.opt.url || '').replace(/\/+$/, '');
    this.http = httpBase(this.url);
    this.game = this.opt.game || 'game';
    this.build = String(this.opt.build || '0');
    this.name = this.opt.name || 'PLAYER';
    this.input = this.opt.input || (matchMedia && matchMedia('(pointer:coarse)').matches ? 'touch' : 'pointer');
    this.ice = this.opt.iceServers || DEF_ICE;
    this.relayAfterMs = this.opt.relayAfterMs || 6000;

    this.ws = null;
    this.code = null;
    this.me = null;
    this.token = null;
    this.lobby = null;
    this.peers = {};          // id -> {pc, r, u, relay, state}
    this.closed = false;
    this._retry = 0;
    this._hb = 0;
    this._wantOpen = false;
  }
  EonNet.prototype = Object.create(Bus.prototype);
  EonNet.prototype.constructor = EonNet;

  /* ---- REST: list / create / quick ---------------------------------- */
  EonNet.prototype._get = function (path, q) {
    var u = this.http + path + '?game=' + encodeURIComponent(this.game);
    for (var k in q) if (q[k] != null && q[k] !== '') u += '&' + k + '=' + encodeURIComponent(q[k]);
    return fetch(u, { method: 'GET' }).then(readJson);
  };
  EonNet.prototype._post = function (path, body) {
    return fetch(this.http + path + '?game=' + encodeURIComponent(this.game), {
      method: 'POST', body: JSON.stringify(body || {})
    }).then(readJson);
  };

  /** Browse public lobbies. Always filtered to this build. */
  EonNet.prototype.list = function (o) {
    o = o || {};
    return this._get('/api/lobbies', {
      mode: o.mode, build: this.build,
      inputClass: o.inputClass || (o.anyInput ? '' : this.input)
    }).then(function (j) { return (j && j.lobbies) || []; });
  };

  /** Create a lobby. Returns the code. Does not join — call join(code). */
  EonNet.prototype.createLobby = function (o) {
    o = o || {};
    return this._post('/api/create', {
      mode: o.mode || 'solo-sim',
      build: this.build,
      visibility: o.visibility || 'public',
      /* separate-by-input is the DEFAULT; pass 'mixed' deliberately */
      inputClass: o.inputClass || this.input,
      maxPlayers: o.maxPlayers,
      region: o.region, name: o.name
    }).then(function (j) {
      if (j.type !== 'created') throw new Error(j.code || 'create_failed');
      return j.code;
    });
  };

  /** Join the best open lobby for this mode, or create one. */
  EonNet.prototype.quick = function (o) {
    o = o || {};
    var self = this;
    return this._post('/api/quick', {
      mode: o.mode || 'solo-sim', build: this.build,
      inputClass: o.inputClass || this.input,
      maxPlayers: o.maxPlayers, region: o.region
    }).then(function (j) {

      return self.join(j.code).then(function () { return j; });

  EonNet.prototype.join = function (code, opt) {

    opt = opt || {};

    this._wantOpen = true;
    /* reuse a held slot if we were here before (page refresh, phone lock) */
    this.token = this._loadToken(this.code);

    return new Promise(function (res, rej) {

         reconnect opens a NEW socket, and the caller still awaiting join()
         must be settled by whichever attempt finally succeeds. */
      self._pending = { res: res, rej: rej };
      clearTimeout(self._joinTimer);
      self._joinTimer = setTimeout(function () {
        /* never leave a game stuck on a loading screen */
        self._settle(false, new Error('join_timeout'));

  EonNet.prototype._loadToken = function (code) {
    try { return sessionStorage.getItem(this._sessKey(code)) || null; } catch (e) { return null; }
  };
  EonNet.prototype._saveToken = function (t) {
    try { sessionStorage.setItem(this._sessKey(this.code), t); } catch (e) { }
  };

  EonNet.prototype._openSocket = function () {
    var self = this;
    var q = '?game=' + encodeURIComponent(this.game) +
      '&code=' + encodeURIComponent(this.code) +
      '&build=' + encodeURIComponent(this.build) +
      '&name=' + encodeURIComponent(this.name) +
      '&input=' + encodeURIComponent(this.input) +
      (this.token ? '&token=' + encodeURIComponent(this.token) : '');

    try { ws = new WebSocket(this.url + '/ws' + q); }
    catch (e) { return this._settle(false, e); }

      self.emit('disconnected', { code: e.code, reason: e.reason });

         lobby, rate limited). Retrying can never succeed, so stop and tell
         the game instead of looping silently forever. */
      if (e.code >= 4000 && e.code < 5000) {

        self._settle(false, new Error(self._fatal || e.reason || 'refused'));

        P.discT = setTimeout(function () {
          if (pc.connectionState === 'disconnected') self._useRelay(id);
        }, 4000);
      } else clearTimeout(P.discT);
    };
    pc.ondatachannel = function (e) { self._bindChannel(id, e.channel); };

    if (polite) {
      /* reliable+ordered for events, unreliable+unordered for state/input */
      this._bindChannel(id, pc.createDataChannel('r', { ordered: true }));
      this._bindChannel(id, pc.createDataChannel('u', { ordered: false, maxRetransmits: 0 }));
      pc.createOffer().then(function (o) {
        return pc.setLocalDescription(o);
      }).then(function () {
        self._send({ type: 'signal', to: id, data: { sdp: pc.localDescription } });
      }).catch(function () { self._useRelay(id); });
    }

    /* if we can't get a direct path in time, fall back to the lobby relay */
    P.timer = setTimeout(function () { if (!P.open) self._useRelay(id); }, this.relayAfterMs);
  };

  EonNet.prototype._bindChannel = function (id, ch) {
    var self = this, P = this.peers[id];
    if (!P) return;
    P[ch.label === 'u' ? 'u' : 'r'] = ch;
    ch.binaryType = 'arraybuffer';
    ch.onopen = function () {
      if (P.open) return;
      P.open = true;
      clearTimeout(P.timer);
      var q = P.queue; P.queue = [];
      for (var i = 0; i < q.length; i++) self.sendTo(id, q[i].d, q[i].u);
      self.emit('peer', { id: id, transport: 'p2p' });
    };
    ch.onmessage = function (e) {
      var d = e.data;
      if (typeof d === 'string') { try { d = JSON.parse(d); } catch (x) { } }
      self.emit('data', d, id);
    };
    ch.onclose = function () { if (P.open && !P.relay) self._useRelay(id); };
  };

  EonNet.prototype._onSignal = function (from, data) {
    var self = this;
    var P = this.peers[from];
    if (!P) { this._makePeer(from, false); P = this.peers[from]; }
    if (!P || !P.pc) return;
    var pc = P.pc;

    if (data.sdp) {
      pc.setRemoteDescription(data.sdp).then(function () {
        if (data.sdp.type !== 'offer') return null;
        return pc.createAnswer().then(function (a) {
          return pc.setLocalDescription(a);
        }).then(function () {
          self._send({ type: 'signal', to: from, data: { sdp: pc.localDescription } });
        });
      }).catch(function () { self._useRelay(from); });
    } else if (data.ice) {
      pc.addIceCandidate(data.ice).catch(function () { });
    }
  };

  EonNet.prototype._useRelay = function (id) {
    var P = this.peers[id] || (this.peers[id] = { queue: [] });
    if (P.relay) return;
    P.relay = true; P.open = true;
    clearTimeout(P.timer); clearTimeout(P.discT);
    try { P.pc && P.pc.close(); } catch (e) { }
    P.pc = null; P.r = null; P.u = null;
    /* tell the other side too, so it stops waiting on a channel we abandoned */
    this._send({ type: 'relay', to: id, data: { __eon: 'relay' } });
    var q = P.queue || []; P.queue = [];
    for (var i = 0; i < q.length; i++) this.sendTo(id, q[i].d, q[i].u);
    this.emit('peer', { id: id, transport: 'relay' });
  };

  EonNet.prototype._dropPeer = function (id) {
    var P = this.peers[id];
    if (!P) return;
    clearTimeout(P.timer); clearTimeout(P.discT);
    try { P.r && P.r.close(); } catch (e) { }
    try { P.u && P.u.close(); } catch (e) { }
    try { P.pc && P.pc.close(); } catch (e) { }
    delete this.peers[id];
  };

  /* ---- data plane ------------------------------------------------------ */
  /** Send to one peer. `unreliable` = drop rather than delay (inputs/state). */
  EonNet.prototype.sendTo = function (id, data, unreliable) {
    var P = this.peers[id];
    if (!P) return false;
    if (P.relay) return this._send({ type: 'relay', to: id, data: data });
    var ch = unreliable ? (P.u || P.r) : P.r;
    if (ch && ch.readyState === 'open') {
      try { ch.send(typeof data === 'string' ? data : JSON.stringify(data)); return true; }
      catch (e) { this.emit('error', { code: 'send_failed', peer: id }); return false; }
    }
    /* unreliable traffic is per-frame state: dropping it is correct, and
       queueing it would deliver a stale burst the moment the channel opens */
    if (unreliable) return false;
    var q = P.queue || (P.queue = []);
    if (q.length >= 64) q.shift();          /* bounded: never grow forever */
    q.push({ d: data, u: unreliable });
    return false;
  };

  EonNet.prototype.broadcast = function (data, unreliable) {
    var n = 0;
    for (var id in this.peers) if (this.sendTo(id, data, unreliable)) n++;
    return n;
  };

  EonNet.prototype.transportOf = function (id) {
    var P = this.peers[id];
    return !P ? 'none' : (P.relay ? 'relay' : (P.open ? 'p2p' : 'connecting'));
  };

  root.EonNet = {
    PROTO: PROTO,
    create: function (opt) { return new EonNet(opt); },
    MODES: { '1v1': 2, 'coop': 4, 'solo-sim': 8, 'team-sim': 8 }
  };
})(typeof window !== 'undefined' ? window : globalThis);
