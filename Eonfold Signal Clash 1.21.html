<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<title>EONFOLD: Signal Clash</title>
<style>
/* ============================================================
   EONFOLD: SIGNAL CLASH — all styles.
   No external resources, no web fonts, no network requests.
   ============================================================ */
:root{
  --void:#050810;
  --void2:#0a1020;
  --panel:rgba(10,16,30,.93);
  --edge:#1d3050;
  --edge2:#2f4a72;
  --ink:#e6f0ff;
  --dim:#8ea4c6;
  --acc:#3fe0ff;      /* primary accent — signal cyan */
  --acc2:#b06bff;     /* violet */
  --acc3:#ffb63d;     /* amber */
  --uiScale:1;
  --flashK:1;
  /* Safe-area insets, expressed in the APP's own axes. When the application is
     rotated 90deg clockwise its top edge lies along the physical screen's
     right edge, so the four insets rotate with it. Every rule below uses these
     variables instead of env() directly. */
  --sat:env(safe-area-inset-top,0px);
  --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  /* touch control sizing — see the mobile controls block near the bottom */
  --tScale:.82;
  --tbtnRaw:clamp(62px,16.5vmin,78px);
  --tbtn:clamp(44px,calc(var(--tbtnRaw) * var(--tScale)),92px);
  --tstickRaw:clamp(120px,34vmin,150px);
  --tstick:clamp(84px,calc(var(--tstickRaw) * var(--tScale)),190px);
  /* One source of truth for the pause control's box. The keyboard reminder
     positions itself from these, so the two can never drift apart. */
  --pauseTop:calc(var(--sat) + 4px);
  --pauseH:max(44px,calc(44px * var(--tScale)));
}
html.rot90{
  /* NOTE: these must name env() directly. Writing them in terms of each other
     (--sat:var(--sar) and so on) is a circular reference, which makes all four
     invalid at computed-value time and silently drops every rule that uses
     them — the touch pad, the HUD padding and the pause control all collapse
     into the top-left corner. */
  --sat:env(safe-area-inset-right,0px);
  --sar:env(safe-area-inset-bottom,0px);
  --sab:env(safe-area-inset-left,0px);
  --sal:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:none;overscroll-behavior:none;position:fixed;inset:0;
}
body{font-size:calc(16px * var(--uiScale));line-height:1.35}
canvas{display:block;image-rendering:auto}
.hd{font-family:Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",system-ui,sans-serif;
    letter-spacing:.05em;text-transform:uppercase;font-weight:400}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace}

/* The application box. Its size is written from JS after measuring
   visualViewport, and it carries the 90deg rotation when the game has to turn
   itself upright on a portrait phone. It is hidden until the very first
   orientation pass has run, so the title screen is never seen in portrait. */
#app{position:fixed;left:0;top:0;right:auto;bottom:auto;
  width:100%;height:100%;background:#000;overflow:hidden;
  transform-origin:0 0;visibility:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
html.ready #app{visibility:visible}
html.rot90,html.rot90 body{overflow:hidden;background:#000}
#stageWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#game{position:absolute;left:0;top:0;transform-origin:0 0;background:#04070f}

/* ---------- generic UI overlay ---------- */
#ui{position:absolute;inset:0;pointer-events:none;z-index:40}
.screen{
  position:absolute;inset:0;display:none;flex-direction:column;pointer-events:auto;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px)
          calc(var(--sab) + 10px) calc(var(--sal) + 14px);
  background:
    radial-gradient(120% 90% at 50% 0%,rgba(63,224,255,.08),transparent 60%),
    linear-gradient(180deg,rgba(4,7,16,.94),rgba(5,9,20,.97));
  animation:fadeIn .18s ease-out;
  overflow:hidden;
}
.screen.on{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
  background:repeating-linear-gradient(180deg,rgba(120,200,255,.030) 0 1px,transparent 1px 3px);
}
.screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(150% 120% at 50% 45%,transparent 52%,rgba(0,0,0,.62) 100%);
}
body.reduce .screen{animation:none}
body.reduce .screen::before{display:none}
.sc-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;min-height:0}
/* Centre content vertically, but never hide the top of it when the content is
   taller than the space available. `justify-content:center` pushes overflow out
   of BOTH ends, so on a short screen the first menu button ends up above the
   header and cannot be scrolled to. A block scroll container holding a
   min-height:100% flex box centres when there is room and falls back to a
   plain top-aligned scroll when there is not. */
.midScroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:block;
  touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.midScroll>.mid{min-height:100%;display:flex;flex-direction:column;
  justify-content:center;align-items:center;padding:2px 0}
.midScroll>.mid>*{flex:0 0 auto;max-width:100%}

/* ---------- title ---------- */
#sc-title,#sc-mode,#sc-diff{background:
  radial-gradient(120% 90% at 50% 0%,rgba(63,224,255,.07),transparent 60%),
  linear-gradient(180deg,rgba(4,7,16,.82),rgba(5,9,20,.94))}
#sc-title .sc-body{justify-content:center}
#sc-title .logo{margin:auto;text-align:center;padding:0 10px;max-width:100%}
.logo h1{
  font-family:Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",system-ui,sans-serif;
  font-size:clamp(36px,12vw,96px);line-height:1.02;letter-spacing:.06em;text-transform:uppercase;
  color:#eafaff;
  text-shadow:0 0 34px rgba(63,224,255,.5),0 0 8px rgba(63,224,255,.7),0 6px 0 rgba(0,0,0,.75);
}
.logo h2{
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;
  font-size:clamp(15px,4.6vw,34px);letter-spacing:.42em;text-transform:uppercase;
  color:var(--acc3);text-indent:.42em;margin-top:6px;
  text-shadow:0 0 20px rgba(255,182,61,.5),0 3px 0 rgba(0,0,0,.7);
}
.logo .sub{font-size:clamp(9px,2.4vw,12px);letter-spacing:.36em;color:#b9cbe4;text-transform:uppercase;margin-top:16px}
.logo .rule{height:2px;margin:12px auto 0;width:min(420px,80vw);
  background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent);opacity:.75}
.blink{animation:bl 1.5s steps(2,end) infinite}
body.reduce .blink{animation:none}
@keyframes bl{50%{opacity:.28}}

/* ---------- buttons / menus ---------- */
.menu{display:flex;flex-direction:column;gap:9px;align-items:center;margin-top:20px}
.btn{
  position:relative;pointer-events:auto;cursor:pointer;
  min-width:min(320px,74vw);padding:11px 22px;
  font-family:Impact,"Arial Narrow Bold","Arial Black",system-ui,sans-serif;
  letter-spacing:.09em;text-transform:uppercase;font-size:clamp(14px,3.6vw,20px);
  color:var(--ink);text-align:center;
  background:linear-gradient(180deg,rgba(26,44,74,.94),rgba(7,12,22,.96));
  border:1px solid var(--edge2);
  box-shadow:0 4px 18px rgba(0,0,0,.45);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
  transition:transform .08s ease,background .12s ease,border-color .12s ease,color .12s;
}
.btn:hover,.btn.sel{background:linear-gradient(180deg,rgba(63,224,255,.26),rgba(12,52,68,.62));
  border-color:var(--acc);color:#fff;transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.sm{min-width:auto;padding:8px 15px;font-size:clamp(11px,2.9vw,15px)}
.btn.wide{min-width:min(430px,88vw)}
.btn.ghost{background:linear-gradient(180deg,rgba(13,19,34,.72),rgba(7,11,20,.82))}
.btn.amber:hover{background:linear-gradient(180deg,rgba(255,182,61,.26),rgba(64,42,10,.62));border-color:var(--acc3)}
.btn.danger:hover{background:linear-gradient(180deg,rgba(176,107,255,.26),rgba(44,20,68,.62));border-color:var(--acc2)}
.btn[disabled]{opacity:.35;pointer-events:none}
.dsub{display:block;margin-top:3px;font-size:clamp(9px,2.2vw,11px);letter-spacing:.06em;
  text-transform:none;opacity:.72;font-family:"Segoe UI",system-ui,sans-serif}

.sc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;position:relative;z-index:3}
.sc-title{font-size:clamp(16px,4.4vw,30px);color:#fff;min-width:0;
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.sc-title small{display:block;font-size:10px;letter-spacing:.4em;color:var(--acc);font-family:inherit;
  white-space:nowrap;overflow:hidden;text-overflow:clip}
/* a narrow header tightens the tracking rather than wrapping the subtitle
   onto a second line and pushing the list down */
body.uiNarrow .sc-title small{letter-spacing:.18em;font-size:9px}
.spacer{flex:1}

/* ---------- competitor select ---------- */
.selWrap{flex:1;display:flex;gap:12px;min-height:0;margin-top:8px}
.selGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;align-content:center;
  flex:1;overflow-y:auto;padding:2px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card{
  position:relative;cursor:pointer;background:linear-gradient(180deg,#111c30,#070c17);
  border:1px solid var(--edge);overflow:hidden;aspect-ratio:3/4;min-height:78px;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  transition:border-color .12s,transform .1s;
}
.card canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:4px 5px;font-size:clamp(8px,2.1vw,11px);
  background:linear-gradient(0deg,rgba(0,0,0,.92),rgba(0,0,0,0));
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;
  text-align:center;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:hover{border-color:#48618c;transform:translateY(-2px)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 22px rgba(63,224,255,.32)}
.card.sel2{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2),0 0 22px rgba(176,107,255,.32)}
.card.sel::after,.card.sel2::after{content:attr(data-tag);position:absolute;top:0;left:0;
  background:var(--acc);color:#04202b;font-size:9px;font-weight:700;padding:1px 6px;letter-spacing:.1em}
.card.sel2::after{background:var(--acc2);color:#150a24}
.card.locked{opacity:.55}
.card.locked::before{content:"";position:absolute;inset:0;z-index:2;
  background:repeating-linear-gradient(135deg,rgba(0,0,0,.42) 0 6px,rgba(0,0,0,0) 6px 12px)}

.infoPane{width:min(290px,34%);display:flex;flex-direction:column;gap:7px;overflow-y:auto;touch-action:pan-y}
.infoPane h3{font-size:clamp(15px,3.6vw,24px);color:#fff;
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.infoPane .tagline{color:var(--acc);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.infoPane .desc{color:var(--dim);font-size:12px}
.stat{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.stat b{width:62px;font-weight:400;flex:0 0 auto}
.bar{flex:1;height:6px;background:#101a2b;border:1px solid #24354f;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#1470a8)}

/* arena picker */
.stageGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;overflow-y:auto;
  padding:2px;align-content:center;flex:1;touch-action:pan-y;margin-top:8px}
.stageCard{position:relative;cursor:pointer;border:1px solid var(--edge);aspect-ratio:16/9;overflow:hidden;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.stageCard canvas{position:absolute;inset:0;width:100%;height:100%}
.stageCard .nm{position:absolute;left:0;right:0;bottom:0;padding:5px 7px;
  background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);font-size:12px;
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.stageCard .nm .sub{display:block;opacity:.58;font-size:9px;letter-spacing:.14em;margin-top:1px}
.stageCard.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 20px rgba(63,224,255,.3)}

/* rows / settings */
.rows{display:flex;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;
  padding:4px 2px;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* A flex child shrinks by default. Inside a scrolling list that is exactly the
   wrong behaviour: the box gets squeezed, the text inside does not, and the
   words spill onto the row above and below. Every row in every list is
   therefore fixed at its natural height and the LIST scrolls instead.
   Nested scroll containers (.rows inside .ladWrap, .mlList, .selGrid) are
   deliberately NOT listed here — they must stay flexible so they can shrink
   and scroll rather than push the footer off the screen. */
.rows>*,.menu>*,.infoPane>*{flex:0 0 auto}
.row{display:flex;align-items:center;gap:9px;padding:7px 10px;background:rgba(11,18,32,.75);
  border:1px solid var(--edge);min-height:40px;flex-wrap:wrap}
.row.head{background:rgba(63,224,255,.07);border-color:var(--edge2);min-height:0;padding:4px 10px}
.row.head .lbl{font-size:clamp(10px,2.4vw,12px);letter-spacing:.22em;color:var(--acc)}
/* min-width:0 lets a long label wrap instead of forcing the row wider than the
   screen; flex-basis keeps the control beside it whenever there is room. */
.row .lbl{flex:1 1 150px;min-width:0;font-size:clamp(11px,2.7vw,13px);letter-spacing:.05em;
  text-transform:uppercase;color:#c6d6ee;overflow-wrap:anywhere}
.row .lbl s{display:block;text-decoration:none;font-size:10px;line-height:1.32;color:var(--dim);
  letter-spacing:.01em;text-transform:none;margin-top:2px;overflow-wrap:anywhere}
/* Controls shrink and wrap before the row ever overflows sideways. */
.seg{display:flex;border:1px solid var(--edge);overflow:hidden;flex:0 1 auto;flex-wrap:wrap;
  max-width:100%;margin-left:auto}
.seg b{cursor:pointer;font-weight:400;padding:6px 9px;font-size:clamp(10px,2.4vw,12px);letter-spacing:.06em;
  text-transform:uppercase;background:rgba(8,13,24,.9);color:var(--dim);border-right:1px solid var(--edge);
  white-space:nowrap}
.seg b:last-child{border-right:0}
.seg b.on{background:var(--acc);color:#04202b}
.sld{display:flex;align-items:center;gap:7px;flex:0 1 auto;margin-left:auto;max-width:100%}
input[type=range]{-webkit-appearance:none;appearance:none;width:min(150px,34vw);height:22px;background:transparent;flex:0 1 auto;min-width:88px}
/* One-tap silence. Reaching the far end of a short track with a fingertip is
   fiddly, and "off" should never need precision. 44px tall so it is a real
   touch target. */
/* Fixed width, so swapping the caption between Off and Muted cannot nudge the
   slider sideways under the player's finger. */
.muteBtn{flex:0 0 auto;cursor:pointer;pointer-events:auto;user-select:none;
  width:58px;min-height:34px;padding:5px 6px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(9px,2.2vw,11px);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--edge);background:rgba(8,13,24,.9);color:var(--dim)}
.muteBtn:hover{border-color:var(--acc);color:#fff}
.muteBtn.on{background:var(--acc2);border-color:var(--acc2);color:#150a24}
body.hicon .muteBtn.on{background:#fff;border-color:#fff;color:#000}
/* On a narrow layout the control already has its own line, so give the track
   the whole width — the end of the slider stops being a pixel-hunt. */
body.uiNarrow .sld{width:100%;margin-left:0}
body.uiNarrow .sld input[type=range]{flex:1 1 auto;width:auto;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:#182437;border:1px solid #27395a}
input[type=range]::-moz-range-track{height:5px;background:#182437;border:1px solid #27395a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;
  background:var(--acc);border:1px solid #073744;cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--acc);border:1px solid #073744;cursor:pointer}
.val{width:38px;flex:0 0 auto;text-align:right;font-size:11px;color:var(--acc)}

.foot{display:flex;gap:8px;justify-content:center;flex:0 0 auto;padding-top:8px;flex-wrap:wrap}
.hintline{text-align:center;color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding-top:6px}
/* keyboard-only wording: a player holding a phone has no Esc key to be told about */
.kbdOnly{display:none}
body.no-touch .kbdOnly{display:inline}

/* ---------- menu density ----------
   Driven by body classes that doResize() sets from the measured APP box, not
   by CSS media queries — under rotation the physical viewport is tall while
   the app box is short, and a media query would tighten the wrong one. */
body.uiShort .btn{padding:8px 18px;font-size:clamp(13px,3.2vw,17px)}
body.uiShort .btn.sm{padding:6px 13px;font-size:clamp(10px,2.6vw,13px)}
body.uiShort .menu{gap:6px;margin-top:8px}
body.uiShort .dsub{margin-top:1px;font-size:clamp(9px,2vw,10px)}
body.uiShort .sc-title{font-size:clamp(15px,3.4vw,22px)}
body.uiShort .sc-title small{font-size:9px;letter-spacing:.26em}
body.uiShort .row{min-height:34px;padding:5px 9px}
body.uiShort .rows{gap:5px}
body.uiShort .row .lbl{font-size:clamp(10px,2.4vw,12px)}
body.uiShort .row .lbl s{font-size:9px;line-height:1.28}
body.uiShort .seg b{padding:5px 8px;font-size:clamp(9px,2.2vw,11px)}
body.uiShort .hintline{padding-top:4px;font-size:9px}
body.uiShort .foot{padding-top:6px}
body.uiShort .modalBox{padding:14px 16px}
body.uiShort .modalBox h2{font-size:clamp(18px,4.6vw,26px)}
body.uiShort .modalBox p{margin-bottom:9px;font-size:11px}
body.uiTiny .btn{padding:6px 14px;font-size:clamp(12px,3vw,15px)}
body.uiTiny .menu{gap:5px;margin-top:5px}
body.uiTiny .logo h1{font-size:clamp(30px,9vw,60px)}
body.uiTiny .logo h2{font-size:clamp(12px,3.4vw,22px)}
body.uiTiny .logo .sub{margin-top:8px}
body.uiTiny .logo .rule{margin-top:8px}
/* On a narrow app box the control drops onto its own line under the label
   rather than squeezing both into a strip too thin to read or press. */
body.uiNarrow .row{align-items:flex-start}
body.uiNarrow .row .lbl{flex:1 1 100%}
body.uiNarrow .row .seg,body.uiNarrow .row .sld{margin-left:0}

/* ---------- HUD ---------- */
#hud::before{content:"";position:absolute;left:0;right:0;top:0;height:120px;pointer-events:none;
  background:linear-gradient(180deg,rgba(3,6,14,.75),rgba(3,6,14,0))}
#hud{position:absolute;inset:0;pointer-events:none;z-index:20;display:none;
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) 0 calc(var(--sal) + 8px)}
#hud.on{display:block}
body.portrait #hud,body.portrait #announce{top:var(--playT,0px);height:var(--playH,100%);bottom:auto}
body.portrait #hud .nm{font-size:clamp(8px,2.7vw,11px);letter-spacing:.04em}
body.portrait .center{min-width:56px}
body.portrait #hud{padding-left:calc(var(--sal) + 5px);padding-right:calc(var(--sar) + 5px)}
body.portrait.tc-on #hud{padding-right:calc(var(--sar) + 52px)}
body.portrait{--pauseH:max(44px,calc(40px * var(--tScale)))}
body.portrait #btnPause{width:max(44px,calc(46px * var(--tScale)));right:calc(var(--sar) + 6px)}
body.portrait #btnPause i{height:14px;width:4px}
body.portrait #clock{font-size:clamp(19px,7vw,32px)}
body.portrait .hpbar{height:clamp(11px,3.4vw,16px)}
body.portrait .pip{width:7px;height:7px}
body.portrait .hp .nameRow{gap:4px}
body.portrait #announce{top:calc(var(--playT,0px) + var(--playH,100%) * .12);height:auto}
body.tc-on #hud{padding-right:calc(var(--sar) + 60px)}
.hudTop{display:flex;align-items:flex-start;gap:8px}
.hp{flex:1;min-width:0}
.hp .nameRow{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.hp .nm{font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.11em;text-transform:uppercase;

.pip{width:11px;height:11px;border:1px solid #3d5b86;background:rgba(0,0,0,.45);transform:rotate(45deg)}

.hpbar{position:relative;height:clamp(13px,3vw,20px);border:2px solid #071019;background:#0d1626;
  box-shadow:0 0 0 1px rgba(150,210,255,.18),0 3px 12px rgba(0,0,0,.6);overflow:hidden}
.hpbar .lag{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(180deg,#ffd79a,#b06a12);transition:width .35s ease .12s}
.hpbar .fill{position:absolute;top:0;bottom:0;left:0;
  background:linear-gradient(180deg,#c9f7ff 0%,#3fe0ff 30%,#1284c6 78%,#0a5a8c 100%);transition:width .09s linear}
.hp.right .hpbar .lag,.hp.right .hpbar .fill{left:auto;right:0}
.hp.p2 .hpbar .fill{background:linear-gradient(180deg,#eddcff 0%,#b06bff 28%,#7a2fd0 78%,#4a1690 100%)}
.hpbar .gloss{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 46%,rgba(0,0,0,.32))}
.hpbar .ticks{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.34) 0 1px,transparent 1px 25%)}
.hpbar.low .fill{animation:lowhp .5s ease-in-out infinite alternate}
body.reduce .hpbar.low .fill{animation:none;filter:brightness(1.4)}
@keyframes lowhp{to{filter:brightness(1.6) saturate(1.3)}}
.center{flex:0 0 auto;text-align:center;min-width:70px}
#clock{font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;font-size:clamp(22px,6.4vw,44px);line-height:1;
  color:#fff;text-shadow:0 0 14px rgba(63,224,255,.5),0 3px 0 rgba(0,0,0,.85)}
#clock.small{font-size:clamp(15px,4.2vw,30px);color:var(--acc);text-shadow:0 0 14px rgba(63,224,255,.55),0 2px 0 #000}
#clock.warn{color:var(--acc3);text-shadow:0 0 16px rgba(255,182,61,.75),0 3px 0 rgba(0,0,0,.85)}
.roundLbl{font-size:9px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase;margin-top:1px}
#comboP1,#comboP2{position:absolute;top:16%;font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;
  font-size:clamp(15px,4vw,26px);color:#fff;text-shadow:0 0 12px rgba(255,182,61,.9),0 3px 0 #000;opacity:0;transition:opacity .18s}
#comboP1{left:14px;text-align:left}#comboP2{right:14px;text-align:right}
#comboP1.on,#comboP2.on{opacity:1}
#comboP1 b,#comboP2 b{color:var(--acc3)}
#abilityCue{position:absolute;left:calc(var(--sal) + 10px);
  top:calc(var(--sat) + 46px);display:none;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  padding:2px 8px;border:1px solid var(--edge2);background:rgba(6,11,20,.72);
  color:var(--dim);text-shadow:0 1px 2px #000}
#abilityCue.on{display:block}
#abilityCue.ready{color:#04202b;background:var(--acc);border-color:var(--acc)}
body.portrait #abilityCue{top:calc(var(--playT,0px) + 44px)}
#labHud{position:absolute;left:10px;bottom:12px;max-width:52%;pointer-events:none;display:none;
  font-size:11px;color:#cfe2f5;text-shadow:0 1px 3px #000;line-height:1.5}
#labHud.on{display:block}
#labHud b{color:var(--acc);font-weight:400;letter-spacing:.1em;text-transform:uppercase}
#labHud .frm{color:var(--acc3);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px}

#sigBanner{position:absolute;left:0;right:0;top:42%;text-align:center;pointer-events:none;opacity:0}
#sigBanner span{
  display:inline-block;padding:5px 20px;
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;
  font-size:clamp(15px,3.8vw,30px);
  background:linear-gradient(180deg,rgba(63,224,255,.95),rgba(20,132,198,.95));
  border:1px solid #cdf3ff;color:#04202b;
  clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%);
  text-shadow:0 1px 0 rgba(255,255,255,.4);
  box-shadow:0 0 26px rgba(63,224,255,.55);
}
#sigBanner.go{animation:sigPop 1.25s cubic-bezier(.14,.9,.3,1) forwards}
body.reduce #sigBanner.go{animation:sigPopR 1.2s linear forwards}
@keyframes sigPop{
  0%{opacity:0;transform:translateY(14px) scale(.7)}
  14%{opacity:1;transform:translateY(0) scale(1.1)}
  26%{transform:scale(1)}
  74%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:translateY(-16px) scale(1.05)}
}
@keyframes sigPopR{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* technique list */
.mlWrap{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:8px}
.mlTabs{display:flex;gap:5px;flex-wrap:wrap;flex:0 0 auto;margin-bottom:8px}
.mlTab{cursor:pointer;padding:6px 12px;font-size:clamp(10px,2.6vw,13px);letter-spacing:.08em;text-transform:uppercase;
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;
  background:rgba(10,16,28,.85);border:1px solid var(--edge);color:var(--dim)}
.mlTab.on{background:var(--acc);color:#04202b;border-color:var(--acc)}
.mlList{flex:1;overflow-y:auto;touch-action:pan-y;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px;align-content:start;padding-right:2px}
.mlSec{grid-column:1/-1;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);
  padding:8px 2px 2px;border-bottom:1px solid var(--edge)}
.mlRow{display:flex;align-items:center;gap:9px;padding:6px 9px;background:rgba(11,18,32,.62);border:1px solid #1b2c46}
.mlRow .in{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#dcecff;
  background:#132135;border:1px solid #294059;border-bottom-width:2px;padding:2px 7px;white-space:nowrap;flex:0 0 auto;min-width:64px;text-align:center}
.mlRow .nm{flex:1;font-size:12px;color:#c6d6ee}
.mlRow .nm s{display:block;text-decoration:none;font-size:10px;color:var(--dim)}
.mlRow .dm{font-size:11px;color:var(--acc3);flex:0 0 auto}
.mlRow.sig{background:linear-gradient(90deg,rgba(63,224,255,.14),rgba(11,18,32,.6));border-color:#22536b}
.mlRow.sig .nm{color:#b8ecff}

/* endless HUD */
#endlessHud{position:absolute;left:50%;transform:translateX(-50%);
  top:calc(var(--sat) + 56px);text-align:center;display:none}
#endlessHud.on{display:block}
#survTime{font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;font-size:clamp(17px,4.6vw,30px);
  color:var(--acc);text-shadow:0 0 14px rgba(63,224,255,.55),0 2px 0 #000;line-height:1}
#survMeta{font-size:9px;letter-spacing:.2em;color:#b6c8e2;text-transform:uppercase;text-shadow:0 1px 2px #000}

/* announcer */
#announce{position:absolute;left:0;right:0;top:16%;height:30%;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:30}
#announce .txt{
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.07em;
  font-size:clamp(24px,7.4vw,64px);color:#fff;opacity:0;transform:scale(.55);text-align:center;
  text-shadow:0 0 30px rgba(63,224,255,.65),0 6px 0 rgba(0,0,0,.8);
}
#announce .txt.go{animation:ann 1.05s cubic-bezier(.16,.9,.3,1) forwards}
#announce .txt.hold{animation:ann2 .5s cubic-bezier(.16,.9,.3,1) forwards}
body.reduce #announce .txt.go{animation:annR 1s linear forwards}
body.reduce #announce .txt.hold{animation:annR2 .4s linear forwards}
@keyframes ann{0%{opacity:0;transform:scale(.5)}18%{opacity:1;transform:scale(1.06)}
  30%{transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
@keyframes ann2{0%{opacity:0;transform:scale(.5)}40%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes annR{0%{opacity:0;transform:scale(1)}15%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes annR2{0%{opacity:0;transform:scale(1)}100%{opacity:1;transform:scale(1)}}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;z-index:35;display:none;pointer-events:none;
  opacity:var(--tOpacity,.8);touch-action:none}
#padPanel{position:absolute;left:0;right:0;bottom:0;height:var(--padH,0px);display:none;
  pointer-events:none;z-index:34;
  background:linear-gradient(180deg,#070c16 0%,#05080f 100%);
  border-top:1px solid #1a2a44;
  box-shadow:inset 0 12px 22px rgba(0,0,0,.6)}
#padPanel::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(63,224,255,.5),transparent)}
body.portrait #padPanel.on{display:block}
body.portrait #stickZone{left:0;bottom:0;width:52%;height:var(--padH,0px)}
body.portrait #stickBase{
  width:calc(var(--tstick) * 1.1);height:calc(var(--tstick) * 1.1);
  left:calc(var(--sal) + 25%);
  bottom:calc(var(--sab) + var(--padH,0px) * .5);
  transform:translate(-50%,50%)}
body.portrait #btnPad{
  right:auto;left:72%;transform:translate(-50%,50%);
  bottom:calc(var(--sab) + var(--padH,0px) * .5);
  width:calc(var(--tbtn) * 1.18 * 2.52);height:calc(var(--tbtn) * 1.18 * 2.52)}
body.portrait .tbtn{width:calc(var(--tbtn) * 1.18);height:calc(var(--tbtn) * 1.18);
  font-size:calc(var(--tbtn) * 1.18 * .36)}
body.portrait .tbtn[data-k=A]{left:0;top:calc(var(--tbtn) * 1.18 * .76)}
body.portrait .tbtn[data-k=S]{left:calc(var(--tbtn) * 1.18 * .76);top:0}
body.portrait .tbtn[data-k=D]{left:calc(var(--tbtn) * 1.18 * .76);top:calc(var(--tbtn) * 1.18 * 1.52)}
body.portrait .tbtn[data-k=F]{left:calc(var(--tbtn) * 1.18 * 1.52);top:calc(var(--tbtn) * 1.18 * .76)}
body.portrait #tcToggle{bottom:calc(var(--sab) + 4px)}
#touch.on{display:block}
#touch .zone{position:absolute;pointer-events:auto;touch-action:none}
#stickZone{left:0;bottom:0;width:44%;height:74%}
#stickBase{
  position:absolute;width:var(--tstick);height:var(--tstick);
  border-radius:50%;border:2px solid rgba(150,215,255,.5);
  background:radial-gradient(circle at 50% 42%,rgba(40,70,110,.44),rgba(5,9,18,.5));
  transform:translate(-50%,-50%);pointer-events:none;
  left:calc(var(--sal) + var(--tstick) * .62);
  bottom:calc(var(--sab) + var(--tstick) * .52);top:auto;
  box-shadow:inset 0 0 22px rgba(0,0,0,.55);
}
#stickBase .ring{position:absolute;inset:16%;border-radius:50%;border:1px dashed rgba(150,215,255,.24)}
#stickKnob{
  position:absolute;left:50%;top:50%;width:46%;height:46%;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 42% 34%,#e6faff,#3f7aa8 58%,#16243c);
  border:1px solid rgba(200,240,255,.6);box-shadow:0 3px 12px rgba(0,0,0,.6)
}
/* --- action cluster ------------------------------------------------------
   Diameter is responsive and clamped: never under 44px (the accessibility
   floor for a touch target) and never over 92px however far the size slider
   is pushed. The diamond is tucked to 0.76 of a diameter, which leaves a small
   visible gap between neighbours while keeping the whole cluster compact. */
#btnPad{position:absolute;pointer-events:none;
  right:calc(var(--sar) + 12px);
  bottom:calc(var(--sab) + 12px);
  width:calc(var(--tbtn) * 2.52);height:calc(var(--tbtn) * 2.52)}
.tbtn{position:absolute;pointer-events:auto;width:var(--tbtn);height:var(--tbtn);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;
  font-size:calc(var(--tbtn) * .36);line-height:1;
  color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.8);border:2px solid rgba(190,230,255,.45);
  background:radial-gradient(circle at 40% 32%,rgba(80,130,190,.5),rgba(9,14,26,.64));
  box-shadow:0 4px 14px rgba(0,0,0,.5);touch-action:none;transition:transform .05s}
.tbtn.hit{transform:scale(.9);background:radial-gradient(circle at 40% 32%,rgba(63,224,255,.85),rgba(10,62,84,.8));
  border-color:var(--acc)}
.tbtn[data-k=A]{left:0;top:calc(var(--tbtn) * .76)}
.tbtn[data-k=S]{left:calc(var(--tbtn) * .76);top:0}
.tbtn[data-k=D]{left:calc(var(--tbtn) * .76);top:calc(var(--tbtn) * 1.52)}
.tbtn[data-k=F]{left:calc(var(--tbtn) * 1.52);top:calc(var(--tbtn) * .76)}
#btnPause{position:absolute;pointer-events:auto;
  top:var(--pauseTop);right:calc(var(--sar) + 8px);
  width:max(44px,calc(50px * var(--tScale)));height:var(--pauseH);
  display:flex;align-items:center;justify-content:center;gap:4px;
  border:1px solid rgba(190,230,255,.42);background:rgba(6,11,20,.62);border-radius:5px}
#btnPause i{width:5px;height:15px;background:#dcecff;display:block}
/* Keyboard reminder under the on-screen pause control. It exists only where
   there is no touch input — a player who is holding a phone has no keyboard to
   be reminded about, and the tap target already speaks for itself. */
/* The reminder is anchored to the pause control's own measured box rather than
   to a copy of its numbers, so resizing the button can never leave the two
   overlapping again. */
#pauseHint{
  position:absolute;pointer-events:none;display:none;
  top:calc(var(--pauseTop) + var(--pauseH) + 6px);
  right:calc(var(--sar) + 8px);
  padding:3px 8px;border:1px solid rgba(190,230,255,.24);border-radius:5px;
  background:rgba(6,11,20,.66);
  font-size:clamp(8px,1.7vw,10px);letter-spacing:.13em;text-transform:uppercase;
  color:#a4b6d2;text-shadow:0 1px 3px #000;white-space:nowrap;text-align:right}
body.no-touch #pauseHint{display:block}
body.portrait #pauseHint{right:calc(var(--sar) + 6px)}   /* flush with the portrait pause button */
body.hicon #pauseHint{background:#000;border-color:#7fdcff;color:#fff}
#tcToggle{position:absolute;pointer-events:auto;z-index:36;
  bottom:calc(var(--sab) + 6px);left:50%;transform:translateX(-50%);
  padding:5px 11px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid rgba(190,230,255,.3);background:rgba(6,11,20,.58);color:#a4b6d2;border-radius:5px;display:none}
#tcToggle.on{display:block}

/* pause + results */
.modalBox{margin:auto;width:min(470px,92vw);background:var(--panel);border:1px solid var(--edge);
  padding:18px 16px;position:relative;z-index:3;max-height:94%;overflow-y:auto;touch-action:pan-y;
  clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px)}
.modalBox h2{font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;
  font-size:clamp(19px,5vw,32px);text-align:center;margin-bottom:4px}
.modalBox p{text-align:center;color:var(--dim);font-size:12px;margin-bottom:14px}
.bigStat{text-align:center;font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;
  font-size:clamp(26px,7vw,46px);color:var(--acc);text-shadow:0 0 18px rgba(63,224,255,.4);line-height:1.05}
.subStat{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
.memo{background:rgba(63,224,255,.06);border:1px solid var(--edge2);padding:10px 12px;margin-bottom:12px;
  font-size:12px;color:#cfe2f5;line-height:1.55}
.memo b{display:block;color:var(--acc3);font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;
  letter-spacing:.14em;text-transform:uppercase;font-weight:400;margin-bottom:4px;font-size:12px}

/* ladder */
.ladWrap{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:8px;gap:8px}
.ladRow{display:flex;align-items:center;gap:10px;padding:8px 11px;background:rgba(11,18,32,.72);
  border:1px solid var(--edge);flex:0 0 auto;flex-wrap:wrap}
.ladRow .who{min-width:0}
.ladRow.done{border-color:#1d6a53;background:rgba(30,140,110,.13)}
.ladRow.now{border-color:var(--acc);box-shadow:0 0 0 1px rgba(63,224,255,.4)}
.ladRow .ix{width:26px;flex:0 0 auto;text-align:center;font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;
  color:var(--acc);letter-spacing:.05em}
.ladRow .who{flex:1;font-size:clamp(11px,2.8vw,14px);letter-spacing:.08em;text-transform:uppercase}
.ladRow .who s{display:block;text-decoration:none;font-size:10px;color:var(--dim);letter-spacing:.02em;text-transform:none}
.ladRow .mk{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.ladRow.done .mk{color:#4fe0b0}

#boot{position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:#04070f}
#boot .bl{width:min(320px,70vw);height:4px;background:#101a2b;border:1px solid #24384f;overflow:hidden}
#boot .bl i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1470a8,var(--acc));transition:width .2s}
#boot .st{font-size:10px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}

.kbdmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:6px;width:100%}
.kbdmap div{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}
.kbdmap kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;background:#132135;
  border:1px solid #294059;border-bottom-width:2px;padding:2px 6px;color:#dcecff;min-width:30px;text-align:center}
.warnbox{border:1px solid #1d4f66;background:rgba(14,52,68,.5);padding:8px 10px;font-size:11px;color:#9fe0f5}

/* When the app is rotated, the app's vertical axis lies along the physical
   screen's horizontal axis, so a `pan-y` restriction would block menu
   scrolling entirely. Rotated scrollers accept panning on either axis; the
   page itself cannot scroll because body is fixed and overflow hidden. */
html.rot90 .rows,html.rot90 .selGrid,html.rot90 .stageGrid,html.rot90 .mlList,
html.rot90 .infoPane,html.rot90 .modalBox,html.rot90 .ladWrap,html.rot90 .midScroll,
html.rot90 .screen{touch-action:auto}

/* a small, non-blocking startup note */
#rotNote{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(var(--sab) + 36px);z-index:60;pointer-events:none;display:none;
  padding:5px 12px;border:1px solid var(--edge2);border-radius:5px;
  background:rgba(6,11,20,.82);color:#b9cbe4;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
#rotNote.on{display:block;animation:rotNote 3.6s ease forwards}
/* Never print it across a menu. The title screen is the only place it has a
   clear background to sit on; anywhere else the player is reading something. */
body.inMenu #rotNote{display:none}
body.reduce #rotNote.on{animation:none;opacity:.9}
@keyframes rotNote{0%{opacity:0}12%{opacity:1}72%{opacity:1}100%{opacity:0}}

/* high-contrast HUD option */
body.hicon .hpbar{border-color:#000;box-shadow:0 0 0 2px #fff,0 3px 12px rgba(0,0,0,.8)}
body.hicon .hpbar .fill{background:#4ff0ff}
body.hicon .hp.p2 .hpbar .fill{background:#ffca4d}
body.hicon .hpbar .gloss,body.hicon .hpbar .ticks{display:none}
body.hicon .hp .nm,body.hicon #clock{color:#fff;text-shadow:0 0 0 #000,0 2px 3px #000}
body.hicon .row{background:rgba(0,0,0,.86)}
body.hicon .screen{background:linear-gradient(180deg,rgba(0,0,0,.96),rgba(0,0,0,.98))}
body.hicon .btn{background:#000;border-color:#7fdcff;color:#fff}
body.hicon .btn:hover,body.hicon .btn.sel{background:#0d4a5e;border-color:#fff}
body.hicon .mlRow,body.hicon .ladRow{background:rgba(0,0,0,.85)}

@media (max-width:980px){
  .selGrid{grid-template-columns:repeat(auto-fit,minmax(72px,1fr))}
  .infoPane{width:min(240px,30%)}
}
@media (max-width:640px){
  .selWrap{flex-direction:column;gap:8px}
  .infoPane{width:100%;flex-direction:row;flex-wrap:wrap;gap:5px 12px;align-items:center;max-height:140px}
  .infoPane h3,.infoPane .tagline{width:100%}
  .infoPane .stat{flex:1 1 calc(50% - 12px);min-width:132px}
  .infoPane .stat b{width:54px}
  .infoPane .desc{width:100%}
}

<body>
<div id="app">
  <div id="stageWrap"><canvas id="game"></canvas></div>

  <!-- ============ HUD ============ -->
  <div id="hud">
    <div class="hudTop">

<script>
"use strict";

/* ============================================================================
   EONFOLD: SIGNAL CLASH — core config, math, storage
   ----------------------------------------------------------------------------
   Signal Clash is a virtual training system built by resistance engineers of
   the Eonfold Network. Every technique is projected as harmless kinetic light;
   nothing here is real force and no competitor is ever damaged.

   Everything in this file is original work written for this project. No assets,
   code, audio, names or designs are taken from any existing product.
   ========================================================================== */

/* ---- THE ONE PLACE TO CHANGE THE TITLE -------------------------------- */
const GAME_TITLE = "EONFOLD";
const GAME_SUBTITLE = "Signal Clash";
const GAME_FULL = "EONFOLD: Signal Clash";
/* ----------------------------------------------------------------------- */

/* Two authored viewports. The world, the competitors and every arena are
   shared; only the window onto them changes, so rotating a phone mid-match is
   completely safe. */
const VIEWS = {
  landscape: { VW: 960, VH: 540, GROUND: 462, ARENA: 1720 },
  portrait: { VW: 560, VH: 680, GROUND: 545, ARENA: 980 }
};
let VIEW_MODE = "landscape";

const CFG = {
  title: GAME_TITLE,
  subtitle: GAME_SUBTITLE,
  full: GAME_FULL,
  version: "1.0.0",
  VW: 960, VH: 540,            // logical render resolution (current viewport)
  GROUND: 462,                 // y of the arena floor line in logical px
  FPS: 60, DT: 1 / 60,
  ROUND_TIME: 99,
  ROUNDS_TO_WIN: 2,
  MAX_ROUNDS: 3,               // best two of three
  MAX_HP: 100,                 // Stability points
  ARENA_W: 1720,               // arena walk-space width
  PUSH_MIN: 52,                // min horizontal separation between competitors
  COMBO_HARD_CAP: 5,           // hit N forces a safe break -> combination must end
  COMBO_SCALE: [1, .86, .72, .58, .45, .34],
  AUTO_CHIP: .12,              // fraction that leaks through the automatic guard
  ENDLESS_HEAL: 16,            // % Stability restored after each Endless match
  ENDLESS_STAGE_EVERY: 3,      // change arena every N opponents
  STORE_KEY: "eonfold_signal_clash_v1",
  LEGACY_KEYS: ["v01d_beatdown_v1"]
};

/* The landscape window is authored at 960x540, which is 16:9. A real phone
   turned on its side is wider than that — 844x390 is 2.16:1 — so a fixed 16:9
   window has to be pillarboxed, and that is what put black bars down each side
   of the arena on a phone.

   Instead the landscape window WIDENS to match the screen. The height, the
   ground line and the arena's walk-space are all left exactly as authored, so
   nothing about the fight changes: because the on-screen scale is set by
   height, the competitors stay precisely the same size and the bars are simply
   replaced by more of the same arena.

   Clamped at both ends. It never goes below the authored width, so a squarer
   screen still shows at least as much as it always did (letterboxed top and
   bottom, as before). It never goes above 1440 either, so the camera keeps
   real panning room inside the 1720-wide arena and the shot never becomes a
   wide-angle view of the whole stage. Quantised to 16px so that dragging a
   window edge does not rebuild the stage canvases for every pixel. */
const VIEW_FIT = { minVW: 960, maxVW: 1440, step: 16 };
function fitLandscapeVW(w, h) {
  const base = VIEWS.landscape;
  if (!(w > 0 && h > 0)) return base.VW;
  const want = base.VH * (w / h);
  const snapped = Math.round(want / VIEW_FIT.step) * VIEW_FIT.step;
  return snapped < VIEW_FIT.minVW ? VIEW_FIT.minVW
    : snapped > VIEW_FIT.maxVW ? VIEW_FIT.maxVW : snapped;
}

/* switch viewport; returns true if anything actually changed.
   `vw` is honoured for the landscape window only; portrait stays authored. */
/* While an online match is live the two physics-bearing dimensions are frozen.
   GROUND and ARENA_W are normally re-derived from the viewport (landscape
   462/1720 vs portrait 545/980) and fed straight into Fighter.update() and
   separate() — so without this lock a phone in portrait and a desktop in
   landscape would simulate two differently sized arenas, and a mid-match
   window resize would silently move both fighters on one side only.
   VW/VH stay live: they only move the camera, which is not simulation. */
const NETLOCK = { on: false, GROUND: 0, ARENA_W: 0 };
function lockArena(ground, arena) {
  NETLOCK.on = true;
  NETLOCK.GROUND = ground; NETLOCK.ARENA_W = arena;
  CFG.GROUND = ground; CFG.ARENA_W = arena;
}
function unlockArena() { NETLOCK.on = false; applyView(VIEW_MODE, CFG.VW); }

function applyView(mode, vw) {
  if (!VIEWS[mode]) mode = "landscape";
  const v = VIEWS[mode];
  const wantVW = (mode === "landscape" && vw > 0) ? vw : v.VW;
  const locked = NETLOCK.on;
  if (mode === VIEW_MODE && CFG.VW === wantVW) return false;
  VIEW_MODE = mode;
  CFG.VW = wantVW; CFG.VH = v.VH;
  if (locked) { CFG.GROUND = NETLOCK.GROUND; CFG.ARENA_W = NETLOCK.ARENA_W; }
  else { CFG.GROUND = v.GROUND; CFG.ARENA_W = v.ARENA; }
  return true;
}

/* ------------------------------ math utils ------------------------------ */
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const rad = d => d * PI / 180;
const approach = (v, t, s) => v < t ? Math.min(v + s, t) : Math.max(v - s, t);
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutSine(t) { return -(Math.cos(PI * t) - 1) / 2; }
function shortAngle(a, b) { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; }
function lerpAngle(a, b, t) { return a + shortAngle(a, b) * t; }

/* deterministic RNG so procedural art is identical every boot */
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const RNG = mulberry(0x5EED1);          // art / arena RNG

/* ---------------------------------------------------------------------------
   TWO GAMEPLAY RNG STREAMS  (required for deterministic netplay)

   The cosmetic stream (gRnd) is consumed by particles, stage ambience and
   audio variation. Its draw COUNT is not deterministic across machines: stage
   ambience is called from Game.render(), which runs at the display's refresh
   rate, and FX particle loops scale with Game.q, the per-device auto-tuned
   quality level. Two players would burn through it at different speeds.

   The simulation stream (simRnd) is consumed ONLY from inside Game.step(), by
   code whose call count cannot vary by device or frame rate. It is reseeded
   from the match seed so both peers roll identically, and its internal state
   is saveable/restorable so rollback can rewind it.

   Rule for anything added later: if it can change the outcome of a fight, it
   uses srnd(). If it is only seen, it uses rnd().
   ------------------------------------------------------------------------- */
let gRnd = mulberry(0xB00B5);           // COSMETIC — never networked
const rnd = () => gRnd();
const rndR = (a, b) => a + gRnd() * (b - a);
const rndI = (a, b) => Math.floor(a + gRnd() * (b - a + 1));
const pick = arr => arr[Math.floor(gRnd() * arr.length)];

function mulberryS(seed) {              // same generator, with a readable cursor
  let a = seed >>> 0;
  const f = function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  f.get = () => a >>> 0;
  f.set = v => { a = v >>> 0; };
  return f;
}
let simRnd = mulberryS(0xB00B5);        // SIMULATION — synced, rollback-safe

/* Which stream simulation code draws from depends on whether a networked match
   is live. OFFLINE it is gRnd, exactly as in the original build and in exactly
   the original call order, so single-player AI behaviour is bit-for-bit
   unchanged. ONLINE it is simRnd, which no cosmetic code can touch. */
function simSrc() { return (window.SCNet && SCNet.online) ? simRnd : gRnd; }
const srnd = () => simSrc()();
const srndR = (a, b) => a + simSrc()() * (b - a);
const srndI = (a, b) => Math.floor(a + simSrc()() * (b - a + 1));
const spick = arr => arr[Math.floor(simSrc()() * arr.length)];
function seedSim(seed) { simRnd = mulberryS(seed >>> 0); }

/* ------------------------------ colour utils ---------------------------- */
function hex2rgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
function rgb2hex(r, g, b) {
  return "#" + ((1 << 24) + (Math.round(clamp(r, 0, 255)) << 16) +
    (Math.round(clamp(g, 0, 255)) << 8) + Math.round(clamp(b, 0, 255))).toString(16).slice(1);
}
function shade(hexc, amt) {           // amt -1..1  (negative = darker)
  const [r, g, b] = hex2rgb(hexc);
  if (amt >= 0) return rgb2hex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
  const k = 1 + amt; return rgb2hex(r * k, g * k, b * k);
}
function mixc(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}
function rgba(hexc, a) { const [r, g, b] = hex2rgb(hexc); return `rgba(${r},${g},${b},${a})`; }

/* ------------------------------ device ----------------------------------
   "Is this a touch device?" is answered from capabilities, never from window
   shape — a narrow desktop window is still a desktop, and it should not be
   handed a virtual pad. The answer can only ever flip from false to true, and
   only when the browser reports a genuine touch pointer.
   ------------------------------------------------------------------------ */
const Device = {
  _touch: null,
  isTouch() {
    if (this._touch !== null) return this._touch;
    let t = false;
    try {
      // 1. the browser says so outright (Chromium family)
      const uad = navigator.userAgentData;
      if (uad && uad.mobile === true) t = true;
      // 2. capability test: real touch points AND a coarse primary pointer.
      //    Both are required, so a laptop with a touchscreen and a mouse keeps
      //    the keyboard layout it expects.
      if (!t && (navigator.maxTouchPoints || 0) > 0 &&
        window.matchMedia && matchMedia("(pointer: coarse)").matches) t = true;
      // 3. a tablet asking for the desktop site reports a desktop platform
      //    while still exposing several touch points. Restricted to Mac: a
      //    Linux desktop with a multi-touch trackpad must not match here.
      if (!t && (navigator.maxTouchPoints || 0) >= 2 &&
        /Mac/.test(navigator.platform || "")) t = true;
    } catch (e) { }
    this._touch = t;
    return t;
  },
  /* a genuine touch pointer was observed — capability reporting can be wrong */
  confirmTouch() {
    const changed = this._touch !== true;
    this._touch = true;
    return changed;
  },
  /* the shape the device is actually held in right now */
  deviceOrientation() { return Screen.vpH > Screen.vpW ? "portrait" : "landscape"; },
  /* which of the two authored viewports the game should compose into. This is
     answered from the APP's coordinate space, which may have been rotated. */
  /* Which authored layout to compose into the space we actually have.

     The SHAPE OF THE BOX decides, in every mode. The tall layout is 560x680
     and needs a tall box; forced into a wide one it cannot fill anything — it
     can only sit in the middle as a narrow column, with its control strip
     crushed to nothing. That is what produced a small portrait window on a
     phone held sideways.

     So a wide box always gets the wide layout, even when the player has asked
     for Portrait. The Portrait setting still does what it says on a screen
     that can hold the tall layout, and it still guarantees the app is never
     rotated; it just no longer forces a composition that cannot fit. */
  wantedOrientation() {
    return Screen.appW >= Screen.appH ? "landscape" : "portrait";
  }
};

/* ------------------------------ screen ----------------------------------
   The arena is authored for a wide viewport. On a phone held upright, asking
   the browser to rotate the physical screen is unreliable (every engine
   refuses outside fullscreen), so the game rotates ITSELF: the whole #app
   subtree — title, menus, arena, HUD, pause, settings and the touch pad — is
   turned 90 degrees with a CSS transform and given a landscape-shaped box.

   The transform is `rotate(90deg) translate(0,-100%)` about the top-left
   corner. For an app box of appW x appH sitting in a vpW x vpH viewport:

       app (ax, ay)  ->  screen (vpW - ay, ax)
       screen (sx, sy) ->  app (sy, vpW - sx)

   The inverse is what every pointer calculation has to go through, because a
   finger reports where it is on the PHYSICAL screen, not where it is in the
   rotated game.
   ------------------------------------------------------------------------ */
const Screen = {
  rot: false,                 // is the application-level rotation active?
  appW: 960, appH: 540,       // the app's own coordinate space
  vpW: 0, vpH: 0,             // the real viewport, measured
  el: null, bound: false, applies: 0, lockTried: false, lockState: "untried",
  _raf: 0, _settleT: 0, onChange: null,

  /* Resolved orientation mode. Legacy values fold forward so an old save can
     never leave the game in a state this build no longer supports.
       autoLandscape — always play landscape, rotating the app if necessary
       device        — follow however the device is held
       portrait      — always compose into the tall viewport            */
  mode() {
    const o = Store.data.orientation;
    return (o === "device" || o === "portrait") ? o : "autoLandscape";
  },

  /* visualViewport is the only measurement that tracks mobile browser bars
     and pinch-zoom; innerWidth/Height is the fallback, then the document. */
  measure() {
    const vv = window.visualViewport;
    let w = 0, h = 0;
    if (vv && vv.width > 0 && vv.height > 0) { w = vv.width; h = vv.height; }
    if (!(w > 0 && h > 0)) { w = window.innerWidth; h = window.innerHeight; }
    if (!(w > 0 && h > 0)) {
      const d = document.documentElement;
      w = d && d.clientWidth; h = d && d.clientHeight;
    }
    this.vpW = Math.max(1, Math.round(w || 960));
    this.vpH = Math.max(1, Math.round(h || 540));
    return this;
  },

  /* Decide and apply the rotation. Safe to call as often as you like: it is
     idempotent and does no work beyond writing the same values back. */
  apply() {
    this.measure();
    if (!this.el) this.el = document.getElementById("app");
    const devicePortrait = this.vpH > this.vpW;
    // Rotation is a phone remedy. A desktop browser in a tall window is not a
    // phone: it keeps the portrait layout it has always had, the right way up.
    const rot = this.mode() === "autoLandscape" && devicePortrait && Device.isTouch();
    this.rot = rot;
    this.appW = rot ? this.vpH : this.vpW;
    this.appH = rot ? this.vpW : this.vpH;
    document.documentElement.classList.toggle("rot90", rot);
    const el = this.el;
    if (el) {
      const w = this.appW + "px", h = this.appH + "px";
      if (el.style.width !== w) el.style.width = w;
      if (el.style.height !== h) el.style.height = h;
      el.style.transformOrigin = "0 0";
      const t = rot ? "rotate(90deg) translate(0px, -100%)" : "none";
      if (el.style.transform !== t) el.style.transform = t;
    }
    this.applies++;
    return this;
  },

  /* physical screen coordinates -> the game's logical coordinate space */
  toApp(cx, cy) {
    if (!this.rot) return { x: cx, y: cy };
    return { x: cy, y: this.vpW - cx };
  },
  /* and back again, used only by the verification hooks */
  toScreen(ax, ay) {
    if (!this.rot) return { x: ax, y: ay };
    return { x: this.vpW - ay, y: ax };
  },

  /* Best effort, never relied upon. If the browser does honour the request the
     viewport genuinely becomes landscape, the next measurement sees it, and
     the CSS rotation drops away on its own. If it refuses — which is the norm
     outside fullscreen — nothing happens and the rotation stays. Either way
     the player sees landscape. */
  tryLock() {
    if (this.lockTried) return this.lockState;
    this.lockTried = true;
    try {
      const so = window.screen && screen.orientation;
      if (!so) { this.lockState = "unsupported"; return this.lockState; }
      if (this.mode() !== "autoLandscape") {
        if (so.unlock) { so.unlock(); this.lockState = "unlocked"; }
        return this.lockState;
      }
      if (!so.lock) { this.lockState = "unsupported"; return this.lockState; }
      const p = so.lock("landscape");
      this.lockState = "requested";
      if (p && p.then) p.then(
        () => { this.lockState = "granted"; this.schedule(); setTimeout(() => this.schedule(), 120); },
        () => { this.lockState = "refused"; this.schedule(); });
    } catch (e) { this.lockState = "refused"; }
    return this.lockState;
  },
  /* when the player picks a different mode, an existing lock must not stick */
  releaseLock() {
    this.lockTried = false;
    try { const so = window.screen && screen.orientation; if (so && so.unlock) so.unlock(); } catch (e) { }
  },

  /* One coalesced relayout per frame, no matter how many events arrive. */
  schedule() {
    if (this._raf) return;
    this._raf = requestAnimationFrame(() => {
      this._raf = 0;
      if (typeof this.onChange === "function") this.onChange();
    });
  },

  /* Does our measurement agree with what the device says it is doing?
     Returns true when there is nothing to compare against, so a browser
     without the orientation API is never held up by this. */
  agrees() {
    try {
      const so = window.screen && screen.orientation;
      let deviceLandscape = null;
      if (so && typeof so.type === "string") deviceLandscape = so.type.indexOf("landscape") === 0;
      else if (typeof window.orientation === "number") deviceLandscape = Math.abs(window.orientation) === 90;
      if (deviceLandscape === null) return true;
      return deviceLandscape === (this.vpW > this.vpH);
    } catch (e) { return true; }
  },

  /* A turn is not one event, it is a transition.

     Real mobile browsers report the OLD viewport for a while after the device
     turns — often for a few hundred milliseconds, and iOS Safari keeps moving
     for longer while the URL bar animates. Measuring once, when the event
     fires, can therefore read the pre-turn size, and the game is left
     composing the tall layout into a wide screen with nothing to correct it.

     So a turn starts a short settle loop: re-measure and relayout until the
     numbers stop changing AND agree with the device's own reported
     orientation. It is bounded (eight retries, under three seconds), only ever
     has one timer outstanding, and the next event cancels and restarts it — so
     it can never accumulate or become permanent. */
  settle() {
    if (this._settleT) { clearTimeout(this._settleT); this._settleT = 0; }
    let i = 0, lastW = -1, lastH = -1, stable = 0;
    const STEPS = [30, 70, 130, 220, 340, 500, 700, 950];
    const tick = () => {
      this._settleT = 0;
      this.measure();
      stable = (this.vpW === lastW && this.vpH === lastH) ? stable + 1 : 0;
      lastW = this.vpW; lastH = this.vpH;
      this.schedule();
      if (i >= STEPS.length) return;
      if (stable >= 2 && this.agrees()) return;
      this._settleT = setTimeout(tick, STEPS[i++]);
    };
    tick();
  },

  /* Every listener here is attached exactly once, guarded by `bound`. */
  init(onChange) {
    this.onChange = onChange;
    if (this.bound) return this;
    this.bound = true;
    /* Some browsers announce a turn only as a plain resize, with no
       orientationchange and no media-query event. So any resize that flips the
       viewport between wide and tall is treated as a turn and gets the full
       settle loop; everything else is a single coalesced relayout. */
    let wasLandscape = null;
    const go = () => {
      this.measure();
      const nowLandscape = this.vpW > this.vpH;
      const flipped = wasLandscape !== null && nowLandscape !== wasLandscape;
      wasLandscape = nowLandscape;
      if (flipped) this.settle(); else this.schedule();
    };
    const goLate = () => this.settle();   // a turn needs measuring until it settles
    window.addEventListener("resize", go);
    window.addEventListener("orientationchange", goLate);
    window.addEventListener("pageshow", goLate);
    window.addEventListener("focus", go);
    document.addEventListener("fullscreenchange", goLate);
    document.addEventListener("webkitfullscreenchange", goLate);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) goLate(); });
    const vv = window.visualViewport;
    if (vv) {
      vv.addEventListener("resize", go);
      vv.addEventListener("scroll", go);
    }
    if (window.matchMedia) {
      const mq = window.matchMedia("(orientation: portrait)");
      if (mq.addEventListener) mq.addEventListener("change", goLate);
      else if (mq.addListener) mq.addListener(goLate);
    }
    return this;
  }
};

/* ------------------------------ formatting ------------------------------ */
function fmtTime(sec) {
  if (!(sec > 0)) sec = 0;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60), d = Math.floor((sec * 10) % 10);
  return m + ":" + (s < 10 ? "0" : "") + s + "." + d;
}

/* ------------------------------ persistence -----------------------------
   The game boots and plays normally when localStorage is unavailable — every
   access is wrapped, and a memory-only mirror keeps the session consistent.
   ------------------------------------------------------------------------ */
const Store = {
  available: true,
  data: {
    /* Endless Signal records, kept per difficulty */
    bestTime: 0, bestOpponents: 0,
    bestBy: { easy: { t: 0, f: 0 }, medium: { t: 0, f: 0 }, hard: { t: 0, f: 0 } },
    /* audio */
    volMaster: .9, volMusic: .55, volSfx: .8, volUi: .7,
    /* presentation + accessibility */
    orientation: "device",        // device | autoLandscape | portrait
    quality: "auto", lowFx: false, reduced: false,
    shake: .7, flashK: .7, textSize: 1, hiContrast: false,
    /* assist */

  },
  freq(n) { return 440 * Math.pow(2, (n - 69) / 12); },
  ensure() {
    if (!Snd.ok || this.out) return;
    const c = Snd.ctx;
    this.out = c.createGain(); this.out.gain.value = .9;
    this.delay = c.createDelay(1);
    this.delay.delayTime.value = .26;
    const fb = c.createGain(); fb.gain.value = .3;
    const dl = c.createBiquadFilter(); dl.type = "lowpass"; dl.frequency.value = 2400;
    this.delay.connect(dl); dl.connect(fb); fb.connect(this.delay);
    const wet = c.createGain(); wet.gain.value = .3;
    dl.connect(wet); wet.connect(Snd.busMusic);
    this.out.connect(Snd.busMusic); this.out.connect(this.delay);
  },
  play(name) {
    if (!this.TRACKS[name]) name = "menu";
    if (!Snd.ok) { this.cur = name; return; }         // remembered until audio exists
    this.ensure();
    if (this.cur === name && this.playing) return;    // never restart the same track
    const sameTempoFamily = this.cur === name;
    this.cur = name;
    if (!sameTempoFamily) this.step = 0;
    this.playing = true;
    this.nextT = Snd.t() + .06;
    if (!this.timer) this.timer = setInterval(() => this.sched(), 26);
  },
  stop() { this.playing = false; if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  sched() {
    if (!this.playing || !Snd.ok || !this.cur) return;
    const T = this.TRACKS[this.cur]; if (!T) return;
    const spb = 60 / T.bpm / 4;                       // 16th note
    const now = Snd.t();
    let guard = 0;
    if (this.nextT < now) this.nextT = now + .02;     // recover cleanly after a tab pause
    while (this.nextT < now + .18 && guard++ < 40) {
      this.note(T, this.step % 16, this.nextT);
      this.step++; this.nextT += spb;
    }
  },
  note(T, i, t) {
    const B = Snd.busMusic, c = Snd.ctx, o = this.out;
    if (T.kick[i]) { Snd.tone("sine", 160, 44, .18, o, .46, t); Snd.noise(.03, o, .09, "lowpass", 900, .7, t); }
    if (T.snare[i]) { Snd.noise(.1, o, .16, "bandpass", 2100, .9, t); Snd.tone("triangle", 240, 160, .07, o, .08, t); }
    if (T.hat[i]) Snd.noise(.03, o, .05 * (i % 2 ? .6 : 1), "highpass", 8600, .8, t);
    const bn = T.bass[i];
    if (bn != null) {
      const f = this.freq(T.root + bn);
      const osc = c.createOscillator(); osc.type = "sawtooth"; osc.frequency.value = f;
      const sub = c.createOscillator(); sub.type = "square"; sub.frequency.value = f / 2;
      const flt = c.createBiquadFilter(); flt.type = "lowpass"; flt.Q.value = 6;
      flt.frequency.setValueAtTime(300 + T.mood * 750, t);
      flt.frequency.exponentialRampToValueAtTime(170, t + .22);
      const g = c.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.19, t + .01);
      g.gain.exponentialRampToValueAtTime(.001, t + .24);
      osc.connect(flt); sub.connect(flt); flt.connect(g); g.connect(B);
      osc.start(t); sub.start(t); osc.stop(t + .26); sub.stop(t + .26);
    }
    const ln = T.lead[i];
    if (ln != null) {
      const f = this.freq(T.root + 24 + ln);
      const a = c.createOscillator(); a.type = "square"; a.frequency.value = f;
      const b = c.createOscillator(); b.type = "triangle"; b.frequency.value = f; b.detune.value = 8;
      const flt = c.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = 2800; flt.Q.value = 1.3;
      const g = c.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.08, t + .008);
      g.gain.exponentialRampToValueAtTime(.0009, t + .2);
      a.connect(flt); b.connect(flt); flt.connect(g); g.connect(o);
      a.start(t); b.start(t); a.stop(t + .22); b.stop(t + .22);
    }
    const pn = T.pad[i];
    if (pn != null) {
      const f = this.freq(T.root + 12 + pn);
      [0, 7, 16].forEach((iv, k) => {
        const p = c.createOscillator(); p.type = "sawtooth";
        p.frequency.value = f * Math.pow(2, iv / 12); p.detune.value = (k - 1) * 6;
        const flt = c.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = 950 + T.mood * 700;
        const g = c.createGain();
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.032, t + .25);
        g.gain.linearRampToValueAtTime(.0001, t + 1.5);
        p.connect(flt); flt.connect(g); g.connect(B);
        p.start(t); p.stop(t + 1.55);
      });
    }
  }
};
/* ============================================================================
   COMPETITOR ART — procedural, pre-rendered machine-part sprite atlases.
   Every competitor gets ONE atlas canvas built at boot containing each frame
   component drawn at 2x with plate shading, seam lines, joint hardware and
   emissive core light. Poses are composed at runtime by blitting atlas cells
   through the skeleton, so nothing is allocated inside the match loop.

   All frames, heads, plating and silhouettes below are original designs
   authored for EONFOLD: Signal Clash.
   ========================================================================== */
const ART_S = 2;               // atlas supersample
const CELL = 128;              // atlas cell (device px at ART_S)
const ATLAS_COLS = 6, ATLAS_ROWS = 4;

/* ---------------- generic drawing helpers ---------------- */
function smoothClosed(c, pts) {
  const n = pts.length; if (n < 3) return;
  let mx = (pts[n - 1].x + pts[0].x) / 2, my = (pts[n - 1].y + pts[0].y) / 2;
  c.beginPath(); c.moveTo(mx, my);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    c.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
  }
  c.closePath();
}
/* segs: [{y,w,cx}] top->bottom. Builds a smooth tapered component outline. */
function limbPath(c, segs) {
  const R = [], L = [];
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i], cx = s.cx || 0;
    R.push({ x: cx + s.w / 2, y: s.y });
    L.push({ x: cx - s.w / 2, y: s.y });
  }
  smoothClosed(c, R.concat(L.reverse()));
}
/* hard-edged variant for angular armour plates */
function hardPath(c, segs) {
  c.beginPath();
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i], cx = s.cx || 0;
    i ? c.lineTo(cx + s.w / 2, s.y) : c.moveTo(cx + s.w / 2, s.y);
  }
  for (let i = segs.length - 1; i >= 0; i--) {
    const s = segs[i], cx = s.cx || 0;
    c.lineTo(cx - s.w / 2, s.y);
  }
  c.closePath();
}
function grad(c, x0, y0, x1, y1, stops) {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  return g;
}
/* soft elliptical light/shadow blob (radial falloff, no hard edges) */
function blob(c, x, y, rx, ry, col, a, rot) {
  c.save();
  c.translate(x, y); if (rot) c.rotate(rot);
  c.scale(1, ry / rx);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, rgba(col, a));
  g.addColorStop(.55, rgba(col, a * .55));
  g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g;
  c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill();
  c.restore();
}
/* metal form shading: key light from the upper front (+x), cool bounce behind.
   Harder falloff than organic shading so surfaces read as machined plate.   */
function shadeLimb(c, segs, base, opt) {
  opt = opt || {};
  const hard = !!opt.hard;
  const wMax = Math.max.apply(null, segs.map(s => s.w));
  const cx = segs[0].cx || 0;
  const y0 = segs[0].y, y1 = segs[segs.length - 1].y, len = y1 - y0 || 1;
  const path = hard ? hardPath : limbPath;
  path(c, segs);
  c.fillStyle = grad(c, cx - wMax * .52, 0, cx + wMax * .52, 0, [
    [0, shade(base, -.44)], [.10, shade(base, -.24)], [.34, shade(base, .0)],
    [.54, shade(base, .2)], [.62, shade(base, .1)], [.86, shade(base, -.24)], [1, shade(base, -.46)]
  ]);
  c.fill();
  c.save(); c.clip();
  // joint occlusion at both ends
  blob(c, cx, y0 + len * .02, wMax * .8, len * .12, "#000000", .26);
  blob(c, cx, y1 - len * .02, wMax * .8, len * .11, "#000000", .22);
  if (opt.forms) for (const m of opt.forms)
    blob(c, cx + m[0], m[1], m[2], m[3], m[5] > 0 ? "#ffffff" : "#000000", Math.abs(m[5]), m[4] || 0);
  // specular strip down the lit side
  blob(c, cx + wMax * .2, (y0 + y1) / 2, wMax * .12, len * .4, "#ffffff", opt.gloss === undefined ? .14 : opt.gloss);
  // cool rim on the shadow side
  c.globalAlpha = .34;
  c.strokeStyle = opt.rim || "#7fc8ff"; c.lineWidth = 1.4;
  c.beginPath();
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i], sx = (s.cx || 0) - s.w / 2 + .7;
    i ? c.lineTo(sx, s.y) : c.moveTo(sx, s.y);
  }
  c.stroke(); c.globalAlpha = 1;
  c.restore();
  path(c, segs);
  c.strokeStyle = rgba(shade(base, -.78), .7); c.lineWidth = 1.05; c.stroke();
}
/* brushed-metal micro texture + panel seams inside the current clip */
function panelNoise(c, x, y, w, h, col, seedn, seams) {
  const r = mulberry(seedn);
  c.save();
  c.lineCap = "butt";
  for (let i = 0; i < 9; i++) {
    const yy = y + h * r();
    c.beginPath(); c.moveTo(x, yy); c.lineTo(x + w, yy + (r() - .5) * 2);
    c.strokeStyle = rgba(r() > .5 ? shade(col, .45) : shade(col, -.5), .07 + r() * .07);
    c.lineWidth = .6 + r() * .5; c.stroke();
  }
  const n = seams || 2;
  for (let i = 0; i < n; i++) {
    const yy = y + h * (.2 + .62 * (i + .5) / n);
    c.beginPath(); c.moveTo(x + w * .06, yy); c.lineTo(x + w * .94, yy);
    c.strokeStyle = rgba(shade(col, -.72), .5); c.lineWidth = 1; c.stroke();
    c.beginPath(); c.moveTo(x + w * .06, yy + 1.1); c.lineTo(x + w * .94, yy + 1.1);
    c.strokeStyle = rgba(shade(col, .6), .16); c.lineWidth = .8; c.stroke();
  }
  c.restore();
}
/* emissive element: a saturated core with a soft halo. Used for every energy
   feature so the whole roster glows with one consistent language.          */
function emit(c, x, y, w, h, col, a, round) {
  c.save();
  blob(c, x + w / 2, y + h / 2, Math.max(w, h) * .95, Math.max(w, h) * .95, col, (a === undefined ? .5 : a) * .55);
  c.fillStyle = rgba(shade(col, .55), a === undefined ? .95 : a);
  if (round) { c.beginPath(); c.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, TAU); c.fill(); }
  else c.fillRect(x, y, w, h);
  c.fillStyle = rgba("#ffffff", .55);
  if (round) { c.beginPath(); c.ellipse(x + w / 2, y + h / 2, w * .26, h * .26, 0, 0, TAU); c.fill(); }
  else c.fillRect(x + w * .28, y + h * .22, w * .44, h * .3);
  c.restore();
}
/* louvre / vent grill */
function vents(c, x, y, w, h, n, col) {
  const step = h / n;
  for (let i = 0; i < n; i++) {
    c.fillStyle = rgba("#000000", .48);
    c.fillRect(x, y + i * step, w, step * .5);
    c.fillStyle = rgba(shade(col, .5), .18);
    c.fillRect(x, y + i * step + step * .5, w, step * .2);
  }
}
/* small mechanical fastener */
function bolt(c, x, y, r, col) {
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  c.fillStyle = shade(col, -.42); c.fill();
  c.beginPath(); c.arc(x - r * .22, y - r * .24, r * .52, 0, TAU);
  c.fillStyle = rgba(shade(col, .55), .7); c.fill();
}

/* ---- geometry derived from build (logical px, competitor ~176 tall) ---- */
function bodyMetrics(d) {
  const B = d.build, h = B.h;
  return {
    headH: 27 * h, headW: 22 * h,
    neck: 6.5 * h * B.neck,
    torsoH: 52 * h, chestW: 41 * h * B.sh, waistW: 30 * h * (.86 + B.mass * .16),
    pelvisH: 14 * h, pelvisW: 32 * h * (.9 + B.mass * .12),
    uArm: 35 * h * B.arm, fArm: 32 * h * B.arm,
    uArmW: 13 * h * B.mass, fArmW: 10.6 * h * B.mass,
    thigh: 40 * h * B.leg, shin: 38 * h * B.leg,
    thighW: 18 * h * B.mass, shinW: 13 * h * B.mass,
