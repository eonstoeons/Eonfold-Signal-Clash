/* =========================== PART PAINTERS ==============================
   Every component is drawn facing +x (forward). Back-side components are
   painted from a darkened palette so depth reads instantly.
   ======================================================================== */
function palOf(d, back) {
  const k = back ? -.32 : 0;
  const f = c => back ? shade(c, k) : c;
  // a little of the competitor's own energy colour is mixed into the plating so
  // each frame reads as itself at a glance, even in a dark arena
  const fr = mixc(d.frame, d.core, .15), frD = mixc(d.frameD, d.core, .12);
  const tr = mixc(d.trim, d.core, .12), trD = mixc(d.trimD, d.core, .1);
  return {
    frame: f(fr), frameD: f(frD), trim: f(tr), trimD: f(trD),
    core: back ? shade(d.core, -.3) : d.core, visor: back ? shade(d.visor, -.3) : d.visor,
    coreA: back ? .5 : 1,
    rim: back ? "#3f6f96" : "#8fd8ff"
  };
}
const F0 = d => d.form || {};

function drawUpperArm(c, d, m, back) {
  const P = palOf(d, back), F = F0(d);
  const w = m.uArmW, L = m.uArm, pa = F.pauld || 1;
  /* upper actuator housing */
  const segs = [
    { y: -w * .2, w: w * 1.02 }, { y: L * .18, w: w * 1.12 },
    { y: L * .58, w: w * .94 }, { y: L, w: w * .8 }
  ];
  shadeLimb(c, segs, P.frame, { rim: P.rim, gloss: .16 });
  c.save(); limbPath(c, segs); c.clip();
  panelNoise(c, -w, 0, w * 2, L, P.frame, 311 + (back ? 5 : 0), 2);
  /* piston rod down the shadow side */
  c.fillStyle = rgba(shade(P.trim, .28), .8);
  c.fillRect(-w * .42, L * .16, w * .16, L * .68);
  c.fillStyle = rgba("#000", .3); c.fillRect(-w * .42, L * .16, w * .06, L * .68);
  /* energy band */
  emit(c, -w * .3, L * .44, w * .6, w * .17, P.core, .8 * P.coreA);
  c.restore();
  /* shoulder pauldron over the top of the housing */
  const pw = w * 1.85 * pa, ph = w * .78 * pa;
  c.save();
  c.beginPath();
  c.moveTo(-pw * .40, -ph * .18);
  c.quadraticCurveTo(-pw * .48, -ph * .74, 0, -ph * .84);
  c.quadraticCurveTo(pw * .5, -ph * .74, pw * .52, -ph * .1);
  c.quadraticCurveTo(pw * .5, ph * .5, pw * .2, ph * .62);
  c.lineTo(-pw * .3, ph * .5);
  c.closePath();
  c.fillStyle = grad(c, -pw * .5, 0, pw * .55, 0, [
    [0, shade(P.trim, -.3)], [.3, shade(P.frame, -.1)], [.6, shade(P.frame, .24)], [1, shade(P.frame, -.3)]
  ]);
  c.fill();
  c.save(); c.clip();
  blob(c, pw * .16, -ph * .5, pw * .3, ph * .3, "#ffffff", .2);
  blob(c, -pw * .2, ph * .3, pw * .3, ph * .3, "#000000", .28);
  /* rim accent following the pauldron edge */
  c.strokeStyle = rgba(P.core, .55 * P.coreA); c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(-pw * .3, -ph * .5); c.quadraticCurveTo(pw * .12, -ph * .78, pw * .46, -ph * .12); c.stroke();
  vents(c, pw * .1, -ph * .1, pw * .3, ph * .42, 3, P.trim);
  c.restore();
  c.strokeStyle = rgba(shade(P.trim, -.6), .8); c.lineWidth = 1.1; c.stroke();
  bolt(c, -pw * .22, -ph * .1, w * .12, P.trim);
  bolt(c, pw * .3, ph * .24, w * .11, P.trim);
  c.restore();
}

function drawForeArm(c, d, m, back) {
  const P = palOf(d, back), w = m.fArmW, L = m.fArm;
  const segs = [
    { y: -w * .3, w: w * 1.24 }, { y: L * .24, w: w * 1.3 },
    { y: L * .68, w: w * .96 }, { y: L, w: w * .74 }
  ];
  shadeLimb(c, segs, P.frame, { rim: P.rim, gloss: .17, hard: false });
  c.save(); limbPath(c, segs); c.clip();
  panelNoise(c, -w, 0, w * 2, L, P.frame, 419 + (back ? 3 : 0), 1);
  /* forward guard plate — the surface a Repulse Guard presents */
  c.beginPath();
  c.moveTo(w * .18, L * .04); c.lineTo(w * .66, L * .2);
  c.lineTo(w * .6, L * .74); c.lineTo(w * .16, L * .84); c.closePath();
  c.fillStyle = grad(c, w * .1, 0, w * .7, 0, [[0, shade(P.trim, .16)], [1, shade(P.trim, -.36)]]);
  c.fill();
  c.strokeStyle = rgba(shade(P.trim, -.7), .7); c.lineWidth = .9; c.stroke();
  vents(c, -w * .52, L * .3, w * .3, L * .38, 4, P.trim);
  emit(c, w * .24, L * .3, w * .3, L * .34, P.core, .72 * P.coreA);
  c.restore();
  /* wrist collar */
  c.beginPath(); c.ellipse(0, L, w * .48, w * .21, 0, 0, TAU);
  c.fillStyle = grad(c, -w * .5, 0, w * .5, 0, [[0, shade(P.trim, -.4)], [.6, shade(P.trim, .22)], [1, shade(P.trim, -.4)]]);
  c.fill();
  c.strokeStyle = rgba(shade(P.trim, -.7), .7); c.lineWidth = .9; c.stroke();
}

function drawFist(c, d, m, back) {
  const P = palOf(d, back), w = m.fArmW;
  /* closed manipulator: a segmented block with a knuckle ridge on +x */
  c.beginPath();
  c.moveTo(-w * .44, w * .02);
  c.quadraticCurveTo(-w * .54, w * .5, -w * .3, w * .84);
  c.quadraticCurveTo(w * .06, w * 1.04, w * .42, w * .8);
  c.quadraticCurveTo(w * .66, w * .54, w * .6, w * .2);
  c.quadraticCurveTo(w * .5, w * -.04, w * .3, w * .0);
  c.closePath();
  c.fillStyle = grad(c, -w * .5, 0, w * .66, 0, [
    [0, shade(P.frame, -.5)], [.28, shade(P.frame, -.2)], [.6, shade(P.frame, .22)], [1, shade(P.frame, -.28)]
  ]);
  c.fill();
  c.save(); c.clip();
  /* knuckle plates */
  for (let i = 0; i < 3; i++) {
    const y = w * (.2 + i * .22);
    c.beginPath();
    c.moveTo(w * .16, y); c.lineTo(w * .58, y - w * .04);
    c.lineTo(w * .58, y + w * .14); c.lineTo(w * .16, y + w * .17); c.closePath();
    c.fillStyle = rgba(shade(P.trim, .1), .85); c.fill();
    c.strokeStyle = rgba("#000", .34); c.lineWidth = .7; c.stroke();
    c.fillStyle = rgba("#ffffff", .2); c.fillRect(w * .3, y + w * .01, w * .2, w * .04);
  }
  /* palm emitter */
  emit(c, -w * .3, w * .34, w * .26, w * .3, P.core, .8 * P.coreA, true);
  blob(c, -w * .3, w * .8, w * .5, w * .3, "#000000", .3);
  c.restore();
  c.strokeStyle = rgba(shade(P.frame, -.8), .75); c.lineWidth = 1; c.stroke();
  /* wrist ring so there is never a seam against the forearm */
  c.beginPath(); c.ellipse(0, w * .02, w * .44, w * .18, 0, 0, TAU);
  c.fillStyle = grad(c, -w * .45, 0, w * .45, 0, [[0, shade(P.trim, -.42)], [.6, shade(P.trim, .26)], [1, shade(P.trim, -.42)]]);
  c.fill();
}

function drawHand(c, d, m, back) {
  const P = palOf(d, back), F = F0(d), w = m.fArmW;
  const n = clamp(F.digits || 4, 3, 5);
  /* wrist ring */
  c.beginPath(); c.ellipse(0, w * .02, w * .44, w * .18, 0, 0, TAU);
  c.fillStyle = grad(c, -w * .45, 0, w * .45, 0, [[0, shade(P.trim, -.42)], [.6, shade(P.trim, .26)], [1, shade(P.trim, -.42)]]);
  c.fill();
  /* palm plate */
  c.beginPath();
  c.moveTo(-w * .38, w * .1);
  c.quadraticCurveTo(-w * .46, w * .48, -w * .22, w * .7);
  c.quadraticCurveTo(w * .12, w * .82, w * .38, w * .6);
  c.quadraticCurveTo(w * .5, w * .34, w * .4, w * .1);
  c.closePath();
  c.fillStyle = grad(c, -w * .45, 0, w * .5, 0, [
    [0, shade(P.frame, -.46)], [.34, shade(P.frame, -.12)], [.66, shade(P.frame, .2)], [1, shade(P.frame, -.3)]
  ]);
  c.fill();
  c.save(); c.clip();
  emit(c, -w * .16, w * .3, w * .3, w * .28, P.core, .7 * P.coreA, true);
  c.restore();
  c.strokeStyle = rgba(shade(P.frame, -.8), .7); c.lineWidth = .9; c.stroke();
  /* articulated digits, splayed forward */
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? .5 : i / (n - 1);
    const a = -.42 + t * .95;
    const len = w * (.62 + (i === 0 ? -.14 : 0) + Math.sin(t * PI) * .16);
    c.save();
    c.translate(lerp(-w * .2, w * .34, t), w * (.6 + Math.sin(t * PI) * .06));
    c.rotate(a);
    c.fillStyle = grad(c, -w * .1, 0, w * .1, 0, [[0, shade(P.trim, -.34)], [.6, shade(P.frame, .1)], [1, shade(P.frame, -.34)]]);
    c.beginPath(); c.moveTo(-w * .09, 0); c.lineTo(w * .09, 0);
    c.lineTo(w * .06, len); c.lineTo(-w * .06, len); c.closePath(); c.fill();
    c.strokeStyle = rgba("#000", .4); c.lineWidth = .7; c.stroke();
    c.fillStyle = rgba(shade(P.trim, .3), .8);
    c.fillRect(-w * .08, len * .48, w * .16, w * .07);
    c.restore();
  }
  /* opposed thumb module */
  c.save();
  c.translate(-w * .34, w * .3); c.rotate(-1.15);
  c.fillStyle = grad(c, -w * .09, 0, w * .09, 0, [[0, shade(P.trim, -.34)], [.6, shade(P.frame, .08)], [1, shade(P.frame, -.34)]]);
  c.beginPath(); c.moveTo(-w * .09, 0); c.lineTo(w * .09, 0); c.lineTo(w * .06, w * .44); c.lineTo(-w * .06, w * .44); c.closePath(); c.fill();
  c.strokeStyle = rgba("#000", .4); c.lineWidth = .7; c.stroke();
  c.restore();
}

function drawThigh(c, d, m, back) {
  const P = palOf(d, back), w = m.thighW, L = m.thigh;
  const segs = [
    { y: -w * .12, w: w * .96 }, { y: L * .22, w: w * 1.08 },
    { y: L * .62, w: w * .9 }, { y: L, w: w * .72 }
  ];
  shadeLimb(c, segs, P.frame, { rim: P.rim, gloss: .15 });
  c.save(); limbPath(c, segs); c.clip();
  panelNoise(c, -w, 0, w * 2, L, P.frame, 733 + (back ? 7 : 0), 2);
  /* actuator channel */
  c.fillStyle = rgba(shade(P.trim, -.2), .85);
  c.fillRect(-w * .34, L * .14, w * .2, L * .68);
  emit(c, w * .06, L * .28, w * .18, L * .34, P.core, .6 * P.coreA);
  blob(c, -w * .3, L * .8, w * .6, L * .2, "#000000", .28);
  c.restore();
  /* hip joint ring at the top */
  c.beginPath(); c.ellipse(0, 0, w * .52, w * .3, 0, 0, TAU);
  c.fillStyle = grad(c, -w * .5, 0, w * .5, 0, [[0, shade(P.trim, -.44)], [.55, shade(P.trim, .24)], [1, shade(P.trim, -.44)]]);
  c.fill();
  c.strokeStyle = rgba(shade(P.trim, -.7), .7); c.lineWidth = .9; c.stroke();
  bolt(c, 0, 0, w * .12, P.trim);
}

function drawShin(c, d, m, back) {
  const P = palOf(d, back), F = F0(d), w = m.shinW, L = m.shin, gr = F.greave || 1;
  const segs = [
    { y: -w * .1, w: w * 1.02 }, { y: L * .26, w: w * 1.0 },
    { y: L * .7, w: w * .78 }, { y: L, w: w * .66 }
  ];
  shadeLimb(c, segs, P.frame, { rim: P.rim, gloss: .14 });
  c.save(); limbPath(c, segs); c.clip();
  panelNoise(c, -w, 0, w * 2, L, P.frame, 857 + (back ? 3 : 0), 1);
  vents(c, -w * .44, L * .3, w * .26, L * .34, 4, P.trim);
  c.restore();
  /* forward greave plate */
  const gw = w * .92 * gr;
  c.beginPath();
  c.moveTo(w * .04, L * .02);
  c.lineTo(w * .04 + gw * .62, L * .16);
  c.lineTo(w * .04 + gw * .5, L * .78);
  c.lineTo(w * .02, L * .92);
  c.closePath();
  c.fillStyle = grad(c, 0, 0, gw, 0, [[0, shade(P.frame, .06)], [.5, shade(P.frame, .2)], [1, shade(P.trim, -.3)]]);
  c.fill();
  c.save(); c.clip();
  emit(c, w * .1, L * .3, gw * .3, L * .3, P.core, .62 * P.coreA);
  c.restore();
  c.strokeStyle = rgba(shade(P.trim, -.7), .8); c.lineWidth = 1; c.stroke();
  /* knee cap */
  c.beginPath(); c.ellipse(w * .08, 0, w * .5, w * .34, 0, 0, TAU);
  c.fillStyle = grad(c, -w * .5, 0, w * .6, 0, [[0, shade(P.trim, -.44)], [.55, shade(P.frame, .26)], [1, shade(P.trim, -.4)]]);
  c.fill();
  c.strokeStyle = rgba(shade(P.trim, -.72), .75); c.lineWidth = .9; c.stroke();
  /* ankle collar */
  c.beginPath(); c.ellipse(0, L, w * .42, w * .19, 0, 0, TAU);
  c.fillStyle = shade(P.trim, -.12); c.fill();
}

function drawFoot(c, d, m, back) {
  const P = palOf(d, back), Lf = m.footL, H = m.footH, w = m.shinW;
  /* wedge chassis: heel block, arch, toe plate */
  c.beginPath();
  c.moveTo(-Lf * .34, -H * .16);
  c.lineTo(Lf * .34, -H * .28);
  c.quadraticCurveTo(Lf * .62, -H * .1, Lf * .66, H * .5);
  c.lineTo(Lf * .58, H * .86);
  c.lineTo(-Lf * .38, H * .86);
  c.quadraticCurveTo(-Lf * .46, H * .3, -Lf * .34, -H * .16);
  c.closePath();
  c.fillStyle = grad(c, 0, -H * .3, 0, H * .9, [
    [0, shade(P.frame, .18)], [.45, shade(P.frame, -.06)], [1, shade(P.trim, -.42)]
  ]);
  c.fill();
  c.save(); c.clip();
  /* toe segmentation */
  c.strokeStyle = rgba("#000", .4); c.lineWidth = .9;
  c.beginPath(); c.moveTo(Lf * .28, -H * .3); c.lineTo(Lf * .34, H * .9); c.stroke();
  emit(c, Lf * .38, H * .06, Lf * .2, H * .22, P.core, .55 * P.coreA);
  /* contact pads on the sole */
  c.fillStyle = rgba("#000", .45);
  c.fillRect(-Lf * .36, H * .62, Lf * .3, H * .24);
  c.fillRect(Lf * .12, H * .62, Lf * .42, H * .24);
  blob(c, 0, H * .9, Lf * .6, H * .3, "#000000", .3);
  c.restore();
  c.strokeStyle = rgba(shade(P.trim, -.78), .8); c.lineWidth = 1; c.stroke();
  /* ankle pivot */
  c.beginPath(); c.ellipse(0, -H * .2, w * .34, w * .26, 0, 0, TAU);
  c.fillStyle = shade(P.trim, .08); c.fill();
  c.strokeStyle = rgba("#000", .4); c.lineWidth = .8; c.stroke();
}

function drawPelvis(c, d, m, back) {
  const P = palOf(d, back), w = m.pelvisW, h = m.pelvisH;
  const segs = [{ y: -h * .68, w: w * .96 }, { y: 0, w: w * 1.02 }, { y: h * .7, w: w * .82 }];
  shadeLimb(c, segs, P.trim, { rim: P.rim, gloss: .12 });
  c.save(); limbPath(c, segs); c.clip();
  panelNoise(c, -w / 2, -h / 2, w, h, P.trim, 941, 1);
  /* central power coupling */
  emit(c, -w * .12, -h * .3, w * .24, h * .62, P.core, .72 * P.coreA, true);
  /* hip ball housings */
  c.fillStyle = rgba(shade(P.frame, -.2), .9);
  c.beginPath(); c.ellipse(-w * .42, h * .1, w * .16, h * .38, 0, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(w * .42, h * .1, w * .16, h * .38, 0, 0, TAU); c.fill();
  c.restore();
  c.strokeStyle = rgba(shade(P.trim, -.75), .7); c.lineWidth = 1; limbPath(c, segs); c.stroke();
}

function drawTorso(c, d, m, back) {
  const P = palOf(d, back), F = F0(d);
  const H = m.torsoH, cw = m.chestW, ww = m.waistW;
  const style = F.torso || "athletic";
  const shoulder = style === "heavy" ? 1.06 : style === "slim" ? .92 : style === "slab" ? 1.03 : 1.0;
  const pinch = style === "slim" ? .86 : style === "heavy" ? 1.04 : 1.0;
  /* torso pivot at pelvis top, art extends UP (negative y) */
  const segs = [
    { y: -H, w: cw * .42, cx: -cw * .02 },              // collar ring base
    { y: -H * .94, w: cw * .82 * shoulder, cx: -cw * .01 },
    { y: -H * .8, w: cw * 1.02 * shoulder, cx: cw * .02 },  // shoulder shelf
    { y: -H * .58, w: cw * .97 * shoulder, cx: cw * .03 },  // chest
    { y: -H * .34, w: cw * .76 * pinch, cx: cw * .01 },     // mid frame
    { y: -H * .14, w: ww * .96 },                            // waist
    { y: 0, w: ww * 1.08 }                                   // hip mount
  ];
  shadeLimb(c, segs, P.frame, { rim: P.rim, gloss: .16 });
  c.save(); limbPath(c, segs); c.clip();
  panelNoise(c, -cw / 2, -H, cw, H, P.frame, 1013 + (back ? 11 : 0), 3);
  /* chest plate */
  c.beginPath();
  c.moveTo(-cw * .3, -H * .86);
  c.lineTo(cw * .36, -H * .82);
  c.lineTo(cw * .34, -H * .36);
  c.lineTo(-cw * .24, -H * .3);
  c.closePath();
  c.fillStyle = grad(c, -cw * .3, 0, cw * .4, 0, [
    [0, shade(P.trim, -.24)], [.45, shade(P.trim, .16)], [1, shade(P.trim, -.34)]
  ]);
  c.fill();
  c.strokeStyle = rgba(shade(P.trim, -.7), .75); c.lineWidth = 1; c.stroke();
  /* the core emitter — every competitor's signature light */
  const coreR = cw * (style === "heavy" ? .17 : style === "slim" ? .13 : .15);
  emit(c, cw * .04 - coreR, -H * .64 - coreR, coreR * 2, coreR * 2, P.core, .95 * P.coreA, true);
  c.strokeStyle = rgba(shade(P.core, .4), .5 * P.coreA); c.lineWidth = 1.3;
  c.beginPath(); c.arc(cw * .04, -H * .64, coreR * 1.5, 0, TAU); c.stroke();
  /* abdominal segment bands */
  for (let i = 0; i < 3; i++) {
    const y = -H * (.3 - i * .07);
    c.fillStyle = rgba(shade(P.trim, -.1), .8);
    c.fillRect(-ww * .38, y, ww * .76, H * .045);
    c.fillStyle = rgba(shade(P.frame, .45), .16);
    c.fillRect(-ww * .38, y + H * .045, ww * .76, H * .012);
  }
  /* intake vents on the shadow side */
  vents(c, -cw * .44, -H * .74, cw * .18, H * .3, 4, P.trim);
  if (style === "modular") {
    /* asymmetric add-on module for Riff */
    c.fillStyle = rgba(shade(P.trim, .1), .95);
    c.fillRect(cw * .18, -H * .3, cw * .22, H * .2);
    c.strokeStyle = rgba("#000", .45); c.lineWidth = .9; c.strokeRect(cw * .18, -H * .3, cw * .22, H * .2);
    emit(c, cw * .22, -H * .26, cw * .06, H * .06, P.core, .8 * P.coreA, true);
  }
  if (style === "smooth") {
    /* Mend's circular Stability projectors */
    for (const s of [[-cw * .3, -H * .68, cw * .09], [cw * .3, -H * .48, cw * .075]]) {
      c.beginPath(); c.arc(s[0], s[1], s[2], 0, TAU);
      c.fillStyle = rgba(shade(P.frame, .4), .9); c.fill();
      c.strokeStyle = rgba(P.core, .7 * P.coreA); c.lineWidth = 1.3; c.stroke();
      emit(c, s[0] - s[2] * .4, s[1] - s[2] * .4, s[2] * .8, s[2] * .8, P.core, .7 * P.coreA, true);
    }
  }
  if (style === "slab") {
    /* Forge's reinforcement ribs */
    for (let i = 0; i < 2; i++) {
      c.fillStyle = rgba(shade(P.frame, -.34), .8);
      c.fillRect(-cw * .18 + i * cw * .3, -H * .84, cw * .07, H * .5);
    }
  }
  blob(c, -cw * .3, -H * .5, cw * .3, H * .35, "#000000", .3);
  c.restore();
  /* collar ring on top */
  const cr = cw * .21 * (F.collar || 1);
  c.beginPath(); c.ellipse(-cw * .02, -H, cr, cr * .42, 0, 0, TAU);
  c.fillStyle = grad(c, -cr, 0, cr, 0, [[0, shade(P.trim, -.44)], [.55, shade(P.trim, .26)], [1, shade(P.trim, -.44)]]);
  c.fill();
  c.strokeStyle = rgba(shade(P.trim, -.72), .8); c.lineWidth = 1; c.stroke();
}

/* crest / heat sink behind the head; drawn before the head module */
function drawCrest(c, d, m) {
  const P = palOf(d, false), F = F0(d), s = F.crest || "fin";
  const W = m.headW, H = m.headH, cy = -m.neck - H * .52;
  c.save();
  if (s === "fin") {
    c.beginPath();
    c.moveTo(-W * .1, cy - H * .5);
    c.lineTo(-W * .1, cy - H * .92);
    c.lineTo(-W * .62, cy - H * .3);
    c.lineTo(-W * .5, cy + H * .16);
    c.closePath();
    c.fillStyle = grad(c, -W * .6, 0, W * 0, 0, [[0, shade(P.trim, -.44)], [1, shade(P.frame, -.02)]]);
    c.fill();
    c.strokeStyle = rgba(shade(P.trim, -.7), .8); c.lineWidth = 1; c.stroke();
    for (let i = 0; i < 3; i++) {
      c.fillStyle = rgba(P.core, .4);
      c.fillRect(-W * .5 + i * W * .12, cy - H * .5 + i * H * .1, W * .06, H * .3);
    }
  } else if (s === "spine") {
    for (let i = 0; i < 4; i++) {
      const t = i / 3;
      c.beginPath();
      c.moveTo(-W * .06, cy - H * (.4 + t * .3));
      c.lineTo(-W * (.34 + t * .3), cy - H * (.1 + t * .38));
      c.lineTo(-W * (.28 + t * .26), cy + H * (.06 - t * .16));
      c.closePath();
      c.fillStyle = rgba(shade(P.frame, -.2 - t * .2), .95); c.fill();
      c.strokeStyle = rgba(P.core, .35); c.lineWidth = .9; c.stroke();
    }
  } else if (s === "cowl") {
    c.beginPath();
    c.ellipse(-W * .12, cy - H * .1, W * .78, H * .78, .12, 0, TAU);
    c.fillStyle = grad(c, -W * .8, 0, W * .5, 0, [[0, shade(P.trim, -.5)], [1, shade(P.trim, -.1)]]);
    c.fill();
    c.strokeStyle = rgba(shade(P.trim, -.75), .8); c.lineWidth = 1.1; c.stroke();
    c.beginPath(); c.arc(-W * .3, cy - H * .2, W * .3, .6, 3.2);
    c.strokeStyle = rgba(P.core, .35); c.lineWidth = 1.4; c.stroke();
  } else if (s === "halo") {
    c.beginPath(); c.arc(0, cy - H * .12, W * .82, PI * .88, PI * 2.12);
    c.strokeStyle = rgba(shade(P.frame, .3), .95); c.lineWidth = W * .12; c.stroke();
    c.beginPath(); c.arc(0, cy - H * .12, W * .82, PI * .88, PI * 2.12);
    c.strokeStyle = rgba(P.core, .5); c.lineWidth = W * .05; c.stroke();
    for (let i = 0; i < 3; i++) {
      const a = PI * (1.05 + i * .45);
      emit(c, Math.cos(a) * W * .82 - W * .05, cy - H * .12 + Math.sin(a) * W * .82 - W * .05, W * .1, W * .1, P.core, .8, true);
    }
  } else { /* antenna */
    c.strokeStyle = shade(P.trim, .1); c.lineWidth = W * .075; c.lineCap = "round";
    c.beginPath(); c.moveTo(-W * .18, cy - H * .48); c.quadraticCurveTo(-W * .6, cy - H * .8, -W * .44, cy - H * 1.02); c.stroke();
    emit(c, -W * .52, cy - H * 1.14, W * .16, W * .16, P.core, .9, true);
    c.strokeStyle = shade(P.trim, -.2); c.lineWidth = W * .06;
    c.beginPath(); c.moveTo(-W * .1, cy - H * .4); c.lineTo(-W * .56, cy - H * .58); c.stroke();
    c.beginPath(); c.ellipse(-W * .5, cy - H * .3, W * .18, H * .3, -.4, 0, TAU);
    c.fillStyle = rgba(shade(P.frame, -.1), .95); c.fill();
    c.strokeStyle = rgba("#000", .4); c.lineWidth = .8; c.stroke();
  }
  c.restore();
}

/* head module. `noise` renders brief signal interference across the visor:
   a display artefact of a Stability dip, and nothing more. */
function drawHead(c, d, m, noise) {
  const P = palOf(d, false), F = F0(d), W = m.headW, H = m.headH;
  const style = F.head || "visorwide";
  c.save();
  /* neck column */
  c.beginPath();
  c.moveTo(-W * .2, 0); c.lineTo(-W * .17, -m.neck - 2);
  c.lineTo(W * .19, -m.neck - 2); c.lineTo(W * .22, 0); c.closePath();
  c.fillStyle = grad(c, -W * .25, 0, W * .25, 0, [[0, shade(P.trim, -.5)], [.6, shade(P.trim, .06)], [1, shade(P.trim, -.34)]]);
  c.fill();
  c.strokeStyle = rgba(shade(P.trim, -.75), .7); c.lineWidth = .9; c.stroke();
  for (let i = 0; i < 2; i++) {
    c.fillStyle = rgba(shade(P.frame, .3), .35);
    c.fillRect(-W * .19, -m.neck * (.35 + i * .42), W * .4, m.neck * .16);
  }
  const cy = -m.neck - H * .52;             // head centre
  /* skull shell — a different silhouette per competitor */
  c.beginPath();
  if (style === "block") {
    c.moveTo(-W * .5, cy + H * .1); c.lineTo(-W * .46, cy - H * .44);
    c.lineTo(W * .3, cy - H * .52); c.lineTo(W * .52, cy - H * .2);
    c.lineTo(W * .5, cy + H * .2); c.lineTo(W * .1, cy + H * .46);
    c.lineTo(-W * .4, cy + H * .4); c.closePath();
  } else if (style === "wedge") {
    c.moveTo(-W * .44, cy - H * .04); c.lineTo(-W * .3, cy - H * .48);
    c.lineTo(W * .22, cy - H * .5); c.lineTo(W * .62, cy - H * .06);
    c.lineTo(W * .44, cy + H * .34); c.lineTo(-W * .26, cy + H * .4); c.closePath();
  } else if (style === "dome") {
    c.moveTo(-W * .52, cy + H * .16);
    c.quadraticCurveTo(-W * .56, cy - H * .42, W * .0, cy - H * .56);
    c.quadraticCurveTo(W * .56, cy - H * .42, W * .54, cy + H * .1);
    c.quadraticCurveTo(W * .42, cy + H * .48, -W * .1, cy + H * .46);
    c.closePath();
  } else if (style === "round") {
    c.ellipse(W * .02, cy - H * .02, W * .5, H * .53, 0, 0, TAU);
  } else if (style === "asym") {
    c.moveTo(-W * .46, cy + H * .06); c.lineTo(-W * .34, cy - H * .5);
    c.lineTo(W * .14, cy - H * .56); c.lineTo(W * .54, cy - H * .24);
    c.lineTo(W * .46, cy + H * .28); c.lineTo(W * .04, cy + H * .48);
    c.lineTo(-W * .3, cy + H * .34); c.closePath();
  } else { /* visorwide */
    c.moveTo(-W * .48, cy + H * .1);
    c.quadraticCurveTo(-W * .5, cy - H * .4, -W * .04, cy - H * .52);
    c.quadraticCurveTo(W * .44, cy - H * .46, W * .54, cy - H * .1);
    c.quadraticCurveTo(W * .48, cy + H * .34, W * .0, cy + H * .44);
    c.quadraticCurveTo(-W * .36, cy + H * .38, -W * .48, cy + H * .1);
    c.closePath();
  }
  c.fillStyle = grad(c, -W * .5, cy, W * .58, cy, [
    [0, shade(P.frame, -.5)], [.26, shade(P.frame, -.2)], [.58, shade(P.frame, .22)], [1, shade(P.frame, -.24)]
  ]);
  c.fill();
  c.save(); c.clip();
  panelNoise(c, -W * .6, cy - H * .6, W * 1.2, H * 1.2, P.frame, 1279, 0);
  /* crown plate seam */
  c.strokeStyle = rgba("#000", .34); c.lineWidth = 1;
  c.beginPath(); c.moveTo(-W * .5, cy - H * .26); c.lineTo(W * .56, cy - H * .34); c.stroke();
  /* jaw / intake block */
  c.fillStyle = rgba(shade(P.trim, -.1), .92);
  c.beginPath();
  c.moveTo(-W * .3, cy + H * .16); c.lineTo(W * .44, cy + H * .1);
  c.lineTo(W * .34, cy + H * .44); c.lineTo(-W * .22, cy + H * .42); c.closePath();
  c.fill();
  vents(c, W * .0, cy + H * .18, W * .3, H * .2, 3, P.trim);
  blob(c, -W * .34, cy - H * .1, W * .26, H * .34, "#000000", .3);
  c.restore();
  c.strokeStyle = rgba(shade(P.frame, -.82), .8); c.lineWidth = 1.1; c.stroke();

  /* visor housing */
  c.save();
  c.beginPath();
  if (style === "round") {
    c.ellipse(W * .1, cy - H * .1, W * .34, H * .2, -.05, 0, TAU);
  } else if (style === "asym") {
    c.moveTo(-W * .26, cy - H * .18); c.lineTo(W * .46, cy - H * .26);
    c.lineTo(W * .42, cy + H * .0); c.lineTo(-W * .24, cy + H * .04); c.closePath();
  } else {
    c.moveTo(-W * .34, cy - H * .2); c.lineTo(W * .48, cy - H * .28);
    c.lineTo(W * .44, cy + H * .02); c.lineTo(-W * .3, cy + H * .06); c.closePath();
  }
  c.fillStyle = rgba("#050a12", .96); c.fill();
  c.save(); c.clip();
  if (noise) {
    /* signal interference: horizontal scan bars across the display */
    for (let i = 0; i < 6; i++) {
      c.fillStyle = rgba(P.visor, i % 2 ? .5 : .16);
      c.fillRect(-W * .4, cy - H * .22 + i * H * .05, W * .95, H * .022);
    }
    emit(c, W * .3, cy - H * .16, W * .12, H * .1, P.visor, .5, true);
  } else {
    c.fillStyle = grad(c, -W * .3, 0, W * .5, 0, [
      [0, rgba(P.visor, .28)], [.5, rgba(P.visor, .85)], [1, rgba(shade(P.visor, .4), 1)]
    ]);
    c.fillRect(-W * .4, cy - H * .3, W * .95, H * .4);
    /* optic focus */
    emit(c, W * .26, cy - H * .18, W * .16, H * .14, "#ffffff", .85, true);
    c.fillStyle = rgba("#ffffff", .3);
    c.fillRect(-W * .32, cy - H * .16, W * .8, H * .028);
  }
  c.restore();
  c.strokeStyle = rgba(shade(P.trim, .2), .85); c.lineWidth = 1.3; c.stroke();
  c.restore();
  blob(c, W * .18, cy - H * .12, W * .5, H * .3, P.visor, noise ? .1 : .2);

  /* side sensor pod / ear module */
  c.beginPath(); c.ellipse(-W * .3, cy - H * .04, W * .11, H * .17, 0, 0, TAU);
  c.fillStyle = shade(P.trim, .04); c.fill();
  c.strokeStyle = rgba("#000", .45); c.lineWidth = .8; c.stroke();
  emit(c, -W * .34, cy - H * .04, W * .07, W * .07, P.core, .75, true);
  c.restore();
}

/* -------- training drones: original frames generated from a small grammar,
   used only in Endless Signal. Clearly robotic, always intact.            */
const DRONE_FRAMES = ["#9fb0c4", "#6d7c92", "#8a99a8", "#7c8fa6", "#93a2b6", "#68788e", "#a4b2c0"];
const DRONE_TRIMS = ["#2f4664", "#22394f", "#3b3f5c", "#1f4a4a", "#4a3560", "#264f3f", "#54413a"];
const DRONE_CORES = ["#3fe0ff", "#4fe6a0", "#ffb63d", "#b06bff", "#4d7dff", "#ff7fd0", "#8fff5a"];
const DRONE_NAMES = ["Trainer", "Sparring Unit", "Practice Frame", "Drill Unit",
  "Pattern Unit", "Tempo Unit", "Form Unit", "Range Unit"];
const DRONE_HEADS = ["block", "wedge", "dome", "visorwide", "round", "asym"];

function makeDroneDef(n) {
  const r = mulberry(0xD0E0 + n * 7919);
  const frame = DRONE_FRAMES[(r() * DRONE_FRAMES.length) | 0];
  const trim = DRONE_TRIMS[(r() * DRONE_TRIMS.length) | 0];
  const core = DRONE_CORES[(r() * DRONE_CORES.length) | 0];
  const heavy = r() > .62, light = !heavy && r() > .5;
  return {
    id: "drone" + n,
    name: DRONE_NAMES[n % DRONE_NAMES.length] + " " + String(n + 1).padStart(2, "0"),
    tag: "Endless Signal",
    desc: "A simulated training drone generated by the Signal Clash system.",
    core, visor: shade(core, .55),
    frame, frameD: shade(frame, -.42), trim, trimD: shade(trim, -.4),
    drone: 1,
    form: {
      head: DRONE_HEADS[(r() * DRONE_HEADS.length) | 0],
      torso: heavy ? "heavy" : light ? "slim" : "athletic",
      pauld: heavy ? 1.3 : light ? .85 : 1.02,
      greave: heavy ? 1.2 : .95, digits: 3 + ((r() * 2) | 0),
      crest: DRONE_CRESTS[(r() * DRONE_CRESTS.length) | 0],
      collar: 1, plate: (r() * 4) | 0
    },
    build: {
      h: heavy ? 1.05 + r() * .06 : light ? .93 + r() * .05 : .97 + r() * .06,
      sh: heavy ? 1.12 : light ? .92 : 1.0, mass: heavy ? 1.18 : light ? .88 : 1.0,
      leg: .97 + r() * .09, arm: .96 + r() * .12, neck: 1
    },
    chirp: 260 + r() * 420,
    sigSet: ROSTER[(r() * ROSTER.length) | 0].id,
    stats: { pow: 3, spd: 3, rng: 3, def: 3 },
    mods: {
      speed: heavy ? .88 : light ? 1.12 : 1.0, dmg: heavy ? 1.14 : light ? .92 : 1.0,
      punch: 1, kick: 1, weight: heavy ? 1.2 : light ? .88 : 1.0, health: 1, recover: 1
    }
  };
}

/* drone heads carry a simple optic ring plus a system marker plate so they
   read as system-generated rather than as another competitor. */
function drawDroneHead(c, d, m, noise) {
  const P = palOf(d, false), W = m.headW, H = m.headH;
  const cy = -m.neck - H * .52;
  c.save();
  /* neck */
  c.beginPath();
  c.moveTo(-W * .19, 0); c.lineTo(-W * .16, -m.neck - 2);
  c.lineTo(W * .18, -m.neck - 2); c.lineTo(W * .21, 0); c.closePath();
  c.fillStyle = grad(c, -W * .25, 0, W * .25, 0, [[0, shade(P.trim, -.5)], [.6, shade(P.trim, .06)], [1, shade(P.trim, -.34)]]);
  c.fill();
  /* hexagonal shell */
  c.beginPath();
  c.moveTo(-W * .46, cy - H * .1); c.lineTo(-W * .2, cy - H * .5);
  c.lineTo(W * .26, cy - H * .5); c.lineTo(W * .52, cy - H * .1);
  c.lineTo(W * .3, cy + H * .38); c.lineTo(-W * .24, cy + H * .38); c.closePath();
  c.fillStyle = grad(c, -W * .5, cy, W * .55, cy, [
    [0, shade(P.frame, -.5)], [.3, shade(P.frame, -.16)], [.62, shade(P.frame, .2)], [1, shade(P.frame, -.26)]
  ]);
  c.fill();
  c.save(); c.clip();
  panelNoise(c, -W * .6, cy - H * .6, W * 1.2, H * 1.2, P.frame, 1601 + (d.form.plate || 0) * 37, 1);
  vents(c, -W * .16, cy + H * .12, W * .5, H * .2, 3, P.trim);
  blob(c, -W * .3, cy, W * .3, H * .4, "#000000", .3);
  c.restore();
  c.strokeStyle = rgba(shade(P.frame, -.8), .8); c.lineWidth = 1.1; c.stroke();
  /* single optic ring */
  c.beginPath(); c.arc(W * .14, cy - H * .12, W * .22, 0, TAU);
  c.fillStyle = rgba("#050a12", .95); c.fill();
  c.strokeStyle = rgba(shade(P.trim, .25), .9); c.lineWidth = 1.4; c.stroke();
  if (noise) {
    for (let i = 0; i < 4; i++) {
      c.fillStyle = rgba(P.visor, i % 2 ? .48 : .14);
      c.fillRect(W * .14 - W * .2, cy - H * .24 + i * H * .06, W * .4, H * .026);
    }
  } else {
    emit(c, W * .04, cy - H * .22, W * .2, W * .2, P.visor, .9, true);
    c.strokeStyle = rgba(P.core, .5); c.lineWidth = 1.1;
    c.beginPath(); c.arc(W * .14, cy - H * .12, W * .15, 0, TAU); c.stroke();
  }
  blob(c, W * .14, cy - H * .12, W * .4, H * .3, P.visor, noise ? .08 : .18);
  c.restore();
}

/* ======================= ATLAS ASSEMBLY ================================= */
const PART_LIST = [
  "head", "headNoise", "torso", "pelvis", "crest",
  "uArmF", "uArmB", "fArmF", "fArmB", "fistF", "fistB",
  "handF", "handB", "thighF", "thighB", "shinF", "shinB", "footF", "footB"
];
function buildAtlas(def, reuse) {
  const m = bodyMetrics(def);
  const cv = reuse || mkCanvas(ATLAS_COLS * CELL, ATLAS_ROWS * CELL);
  const c = cv.getContext("2d");
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, cv.width, cv.height);
  c.lineJoin = "round"; c.lineCap = "round";
  const parts = {};
  let i = 0;
  const place = (name, ox, oy, fn) => {
    const col = i % ATLAS_COLS, row = (i / ATLAS_COLS) | 0; i++;
    const sx = col * CELL, sy = row * CELL;
    c.save();
    c.beginPath(); c.rect(sx, sy, CELL, CELL); c.clip();
    c.translate(sx + ox * ART_S, sy + oy * ART_S);
    c.scale(ART_S, ART_S);
    fn(c);
    c.restore();
    parts[name] = { sx, sy, sw: CELL, sh: CELL, ox: ox * ART_S, oy: oy * ART_S };
  };
  const tighten = () => {                       // shrink each part to its opaque bounds
    let data;
    try { data = c.getImageData(0, 0, cv.width, cv.height).data; } catch (e) { return; }
    const W = cv.width;
    for (const k in parts) {
      const p = parts[k];
      let x0 = p.sx + CELL, x1 = p.sx - 1, y0 = p.sy + CELL, y1 = p.sy - 1;
      for (let y = p.sy; y < p.sy + CELL; y++) {
        const row = y * W;
        for (let x = p.sx; x < p.sx + CELL; x++) {
          if (data[(row + x) * 4 + 3] > 3) {
            if (x < x0) x0 = x; if (x > x1) x1 = x;
            if (y < y0) y0 = y; if (y > y1) y1 = y;
          }
        }
      }
      if (x1 < x0 || y1 < y0) { p.sw = 1; p.sh = 1; continue; }
      p.ox -= (x0 - p.sx); p.oy -= (y0 - p.sy);
      p.sx = x0; p.sy = y0; p.sw = x1 - x0 + 1; p.sh = y1 - y0 + 1;
    }
  };
  const cM = CELL / ART_S / 2;               // cell mid in logical units
  const LIMB_Y = 18;                         // pivot row for parts that hang down
  const headFn = def.drone ? drawDroneHead : drawHead;
  place("head", cM, 52, c2 => headFn(c2, def, m, false));
  place("headNoise", cM, 52, c2 => headFn(c2, def, m, true));
  place("torso", cM, 62, c2 => drawTorso(c2, def, m, false));
  place("pelvis", cM, cM, c2 => drawPelvis(c2, def, m, false));
  place("crest", cM, 56, c2 => drawCrest(c2, def, m));
  place("uArmF", cM, LIMB_Y, c2 => drawUpperArm(c2, def, m, false));
  place("uArmB", cM, LIMB_Y, c2 => drawUpperArm(c2, def, m, true));
  place("fArmF", cM, LIMB_Y, c2 => drawForeArm(c2, def, m, false));
  place("fArmB", cM, LIMB_Y, c2 => drawForeArm(c2, def, m, true));
  place("fistF", cM, cM, c2 => drawFist(c2, def, m, false));
  place("fistB", cM, cM, c2 => drawFist(c2, def, m, true));
  place("handF", cM, cM, c2 => drawHand(c2, def, m, false));
  place("handB", cM, cM, c2 => drawHand(c2, def, m, true));
  place("thighF", cM, LIMB_Y, c2 => drawThigh(c2, def, m, false));
  place("thighB", cM, LIMB_Y, c2 => drawThigh(c2, def, m, true));
  place("shinF", cM, LIMB_Y, c2 => drawShin(c2, def, m, false));
  place("shinB", cM, LIMB_Y, c2 => drawShin(c2, def, m, true));
  place("footF", cM, cM, c2 => drawFoot(c2, def, m, false));
  place("footB", cM, cM, c2 => drawFoot(c2, def, m, true));
  tighten();
  return { cv, parts, m, def };
}
/* ============================================================================
   SKELETAL RIG + ANIMATION
   Poses are authored as IK targets (hand/foot positions) so limbs always reach
   naturally and feet stay planted.  Every fighter shares the rig; per-character
   bone lengths and stance offsets keep silhouettes distinct.
   ========================================================================== */

/* two-bone IK. angle convention: 0 = straight down, + = toward +x (forward) */
const _ik = { a1: 0, a2: 0, jx: 0, jy: 0 };
function ik(rx, ry, tx, ty, L1, L2, bend, out) {
  let dx = tx - rx, dy = ty - ry;
  let d = Math.sqrt(dx * dx + dy * dy) || .0001;
  const maxd = (L1 + L2) * .999, mind = Math.abs(L1 - L2) + .5;
  if (d > maxd) { const k = maxd / d; dx *= k; dy *= k; d = maxd; }
  else if (d < mind) { const k = mind / d; dx *= k; dy *= k; d = mind; }
  const base = Math.atan2(dx, dy);
  const ca = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
  const A = Math.acos(ca);
  const a1 = base + bend * A;
  const jx = rx + Math.sin(a1) * L1, jy = ry + Math.cos(a1) * L1;
  out.a1 = a1; out.jx = jx; out.jy = jy;
  out.a2 = Math.atan2((rx + dx) - jx, (ry + dy) - jy);
  out.tx = rx + dx; out.ty = ry + dy;
  return out;
}

/* ------------------------- pose helper ---------------------------------- */
const POSE_KEYS = ["rx", "ry", "sp", "hd", "hFx", "hFy", "hBx", "hBy",
  "fFx", "fFy", "fBx", "fBy", "fistF", "fistB", "ebF", "ebB", "knF", "knB", "hurt"];
const BASE_POSE = {
  rx: 0, ry: .935, sp: .11, hd: -.07,
  hFx: .46, hFy: -.16, hBx: .50, hBy: .06,
  fFx: .21, fFy: .97, fBx: -.27, fBy: .95,
  fistF: 1, fistB: 1, ebF: -1, ebB: -1, knF: 1, knB: 1, hurt: 0
};
function P(o) { const r = {}; for (const k of POSE_KEYS) r[k] = (o && o[k] !== undefined) ? o[k] : BASE_POSE[k]; return r; }
const _tmpPose = P({});
function poseLerp(a, b, t, out) {
  for (let i = 0; i < POSE_KEYS.length; i++) { const k = POSE_KEYS[i]; out[k] = a[k] + (b[k] - a[k]) * t; }
  return out;
}
function sampleAnim(anim, t, out) {
  const K = anim.keys, n = K.length;
  if (n === 1) { return poseLerp(K[0].p, K[0].p, 0, out); }
  let tt = anim.loop ? (t % 1 + 1) % 1 : clamp(t, 0, 1);
  for (let i = 0; i < n - 1; i++) {
    if (tt >= K[i].t && tt <= K[i + 1].t) {
      const span = K[i + 1].t - K[i].t || 1;
      let f = (tt - K[i].t) / span;
      if (anim.ease !== false) f = easeInOutSine(f);
      return poseLerp(K[i].p, K[i + 1].p, f, out);
    }
  }
  return poseLerp(K[n - 1].p, K[n - 1].p, 0, out);
}

/* ============================ POSE DRAWING =============================== */
const _j = {   /* reusable joint scratch — no per-frame allocation */
  px: 0, py: 0, nx: 0, ny: 0, shFx: 0, shFy: 0, shBx: 0, shBy: 0,
  armF: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 }, armB: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 },
  legF: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 }, legB: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 }
};
const _hbJ = {
  px: 0, py: 0, nx: 0, ny: 0, shFx: 0, shFy: 0, shBx: 0, shBy: 0, hipFx: 0, hipBx: 0, hipY: 0, dy: 0,
  armF: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 }, armB: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 },
  legF: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 }, legB: { a1: 0, a2: 0, jx: 0, jy: 0, tx: 0, ty: 0 }
};
const _hbPose = P({});
function solvePose(atlas, pose, out, plant) {
  const m = atlas.m;
  const L = m.thigh + m.shin, ARM = m.uArm + m.fArm;
  const px = pose.rx * L, py = -pose.ry * L;      // pelvis relative to ankle-line origin
  const sp = pose.sp, cs = Math.cos(sp), sn = Math.sin(sp);
  const upx = (h, ox) => px + ox * cs + h * sn;
  const upy = (h, ox) => py - h * cs + ox * sn;
  out.px = px; out.py = py;
  out.nx = upx(m.torsoH, 0); out.ny = upy(m.torsoH, 0);
  out.shFx = upx(m.torsoH * .82, 4.5); out.shFy = upy(m.torsoH * .82, 4.5);
  out.shBx = upx(m.torsoH * .82, -6.0); out.shBy = upy(m.torsoH * .82, -6.0);
  ik(out.shFx, out.shFy, out.shFx + pose.hFx * ARM, out.shFy + pose.hFy * ARM, m.uArm, m.fArm, pose.ebF, out.armF);
  ik(out.shBx, out.shBy, out.shBx + pose.hBx * ARM, out.shBy + pose.hBy * ARM, m.uArm, m.fArm, pose.ebB, out.armB);
  const hipY = py + m.pelvisH * .12;
  out.hipFx = px + 3.4 * cs; out.hipBx = px - 3.8 * cs; out.hipY = hipY;
  ik(out.hipFx, hipY, px + pose.fFx * L, py + pose.fFy * L, m.thigh, m.shin, pose.knF, out.legF);
  ik(out.hipBx, hipY, px + pose.fBx * L, py + pose.fBy * L, m.thigh, m.shin, pose.knB, out.legB);
  // vertical placement: ankle line -> ground, with optional foot planting
  let dy = -m.footH * .62;
  if (plant) dy -= Math.max(out.legF.ty, out.legB.ty);
  out.dy = dy;
  out.py += dy; out.ny += dy; out.shFy += dy; out.shBy += dy; out.hipY += dy;
  out.armF.jy += dy; out.armF.ty += dy; out.armB.jy += dy; out.armB.ty += dy;
  out.legF.jy += dy; out.legF.ty += dy; out.legB.jy += dy; out.legB.ty += dy;
  return out;
}
/* parts whose art extends DOWN from the pivot (limbs, feet) */
function blit(c, atlas, name, x, y, ang) {
  const p = atlas.parts[name]; if (!p) return;
  c.save(); c.translate(x, y); c.rotate(-ang);
  c.drawImage(atlas.cv, p.sx, p.sy, p.sw, p.sh,
    -p.ox / ART_S, -p.oy / ART_S, p.sw / ART_S, p.sh / ART_S);
  c.restore();
}
/* parts whose art extends UP from the pivot (torso, head, hair) */
function blitUp(c, atlas, name, x, y, ang) {
  const p = atlas.parts[name]; if (!p) return;
  c.save(); c.translate(x, y); c.rotate(ang);
  c.drawImage(atlas.cv, p.sx, p.sy, p.sw, p.sh,
    -p.ox / ART_S, -p.oy / ART_S, p.sw / ART_S, p.sh / ART_S);
  c.restore();
}
/* draws a posed fighter; origin = feet centre on the ground, +x forward */
function drawPosed(c, atlas, pose, plant) {
  const J = solvePose(atlas, pose, _j, plant), m = atlas.m;
  const planted = Math.abs(pose.fFy - pose.ry) < .07, plantedB = Math.abs(pose.fBy - pose.ry) < .07;
  const hipFy = J.legF.jy - Math.cos(J.legF.a1) * m.thigh;
  const hipBy = J.legB.jy - Math.cos(J.legB.a1) * m.thigh;
  // BACK arm
  blit(c, atlas, "uArmB", J.shBx, J.shBy, J.armB.a1);
  blit(c, atlas, "fArmB", J.armB.jx, J.armB.jy, J.armB.a2);
  blit(c, atlas, pose.fistB > .5 ? "fistB" : "handB", J.armB.tx, J.armB.ty, J.armB.a2);
  // BACK leg
  blit(c, atlas, "thighB", J.legB.jx - Math.sin(J.legB.a1) * m.thigh, hipBy, J.legB.a1);
  blit(c, atlas, "shinB", J.legB.jx, J.legB.jy, J.legB.a2);
  blit(c, atlas, "footB", J.legB.tx, J.legB.ty, J.legB.a2 * (plantedB ? .28 : .85));
  // pelvis + torso
  blitUp(c, atlas, "pelvis", J.px, J.hipY, pose.sp);
  blitUp(c, atlas, "torso", J.px, J.hipY, pose.sp);
  // head (+ hair/hood behind)
  blitUp(c, atlas, "crest", J.nx, J.ny, pose.sp + pose.hd);
  blitUp(c, atlas, pose.hurt > .5 ? "headNoise" : "head", J.nx, J.ny, pose.sp + pose.hd);
  // FRONT leg
  blit(c, atlas, "thighF", J.legF.jx - Math.sin(J.legF.a1) * m.thigh, hipFy, J.legF.a1);
  blit(c, atlas, "shinF", J.legF.jx, J.legF.jy, J.legF.a2);
  blit(c, atlas, "footF", J.legF.tx, J.legF.ty, J.legF.a2 * (planted ? .28 : .85));
  // FRONT arm
  blit(c, atlas, "uArmF", J.shFx, J.shFy, J.armF.a1);
  blit(c, atlas, "fArmF", J.armF.jx, J.armF.jy, J.armF.a2);
  blit(c, atlas, pose.fistF > .5 ? "fistF" : "handF", J.armF.tx, J.armF.ty, J.armF.a2);
  return J;
}

/* ============================================================================
   SIGNAL ARENAS — five original virtual environments, layered parallax.
   Every arena is a simulation. Nothing in the background can reduce Stability,
   obstruct a competitor or alter the outcome of a match: scenery is scenery.
   Static layers are pre-rendered once into re-used offscreen canvases when the
   arena loads; only ambient motion is drawn per frame, scaled by quality.
   ========================================================================== */
const STAGE_DEFS = [
  { id: "rainline", name: "Rainline Tower", sub: "Rooftop · Machine City", amb: "rainline", tint: "#4f8fd0", tintA: .16 },
  { id: "transit", name: "Transit Echo", sub: "Archived · Transit Platform", amb: "transit", tint: "#6fd6e0", tintA: .1 },
  { id: "forge", name: "Forge Hall", sub: "Automated · Machine Chamber", amb: "forge", tint: "#ffab4d", tintA: .13 },
  { id: "solar", name: "Solar Garage", sub: "Remote · Alien Sunset", amb: "solar", tint: "#ff9a5c", tintA: .19 },
  { id: "neon", name: "Neon Passage", sub: "Simulated · City Passage", amb: "neon", tint: "#b06bff", tintA: .16 }
];

const FAR_W = 1120, FAR_H = 400, MID_W = 1340, MID_H = 380, NEAR_W = 1580, NEAR_H = 250;
const FLOOR_H = 330;   // tall enough to reach the bottom of the portrait viewport
const PX_FAR = .18, PX_MID = .46, PX_NEAR = .82;

/* blit only the slice of a parallax layer that is actually on screen */
function layer(c, cv, x, y) {
  let sx = 0, w = cv.width;
  if (x < 0) { sx = Math.floor(-x); w -= sx; x = 0; }
  if (x + w > CFG.VW) w = Math.ceil(CFG.VW - x);
  if (w <= 0) return;
  let sy = 0, h = cv.height;
  if (y < 0) { sy = Math.floor(-y); h -= sy; y = 0; }
  if (y + h > CFG.VH) h = Math.ceil(CFG.VH - y);
  if (h <= 0) return;
  c.drawImage(cv, sx, sy, w, h, x, y, w, h);
}

const Stage = {
  idx: 0, def: null, far: null, mid: null, near: null, floor: null,
  skyCv: null, bandCv: null, foreCv: null,
  rain: null, motes: null, sparks: null, steam: null, t: 0, flash: 0, transitT: -6, craftT: 0,

  ensureCanvases() {
    if (!this.far) {
      this.far = mkCanvas(FAR_W, FAR_H); this.mid = mkCanvas(MID_W, MID_H);
      this.near = mkCanvas(NEAR_W, NEAR_H); this.floor = mkCanvas(NEAR_W, FLOOR_H);
      this.skyCv = mkCanvas(CFG.VW, CFG.VH);
      this.bandCv = mkCanvas(CFG.VW, 230);
      this.foreCv = mkCanvas(CFG.VW, CFG.VH);
      this.rain = new Float32Array(360 * 4);
      this.motes = new Float32Array(90 * 4);
      this.sparks = new Float32Array(60 * 5);
      this.steam = new Float32Array(40 * 5);
    }
  },
  load(i) {
    this.ensureCanvases();
    i = clamp(i | 0, 0, STAGE_DEFS.length - 1);
    this.idx = i; this.def = STAGE_DEFS[i]; this.t = 0; this.flash = 0; this.transitT = -7; this.craftT = 0;
    const R = mulberry(9001 + i * 131);
    [this.far, this.mid, this.near, this.floor].forEach(cv => {
      const g = cv.getContext("2d"); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
    });
    BUILDERS[i](this.far.getContext("2d"), this.mid.getContext("2d"),
      this.near.getContext("2d"), this.floor.getContext("2d"), R);
    // ambient particle seeding
    for (let k = 0; k < 360; k++) { const o = k * 4; this.rain[o] = R() * (CFG.VW + 200) - 100; this.rain[o + 1] = R() * CFG.VH; this.rain[o + 2] = 8 + R() * 9; this.rain[o + 3] = .3 + R() * .7; }
    for (let k = 0; k < 90; k++) { const o = k * 4; this.motes[o] = R() * CFG.VW; this.motes[o + 1] = 120 + R() * 330; this.motes[o + 2] = .2 + R() * .8; this.motes[o + 3] = R() * TAU; }
    for (let k = 0; k < 60; k++) this.sparks[k * 5 + 4] = -1;
    for (let k = 0; k < 40; k++) { const o = k * 5; this.steam[o + 4] = R() * 3; this.steam[o] = R() * CFG.VW; }
    this.bakeOverlays();
    Snd.ambience(this.def.amb);
  },
  update(dt) {
    this.t += dt;
    const id = this.def.id;
    if (id === "rainline") {
      if (this.flash > 0) this.flash -= dt * 3.2;
      else if (rnd() < dt * .09) this.flash = 1;
    }
    if (id === "transit") { this.transitT += dt * .34; if (this.transitT > 7) this.transitT = -7 - rnd() * 9; }
    if (id === "solar") { this.craftT += dt * .05; if (this.craftT > 1.4) this.craftT = -.3 - rnd() * .6; }
  },
  /* ---- painting ---- */
  applyView() { if (this.def) this.bakeOverlays(); },
  bakeOverlays() {
    if (this.skyCv.width !== CFG.VW || this.skyCv.height !== CFG.VH) {
      this.skyCv.width = CFG.VW; this.skyCv.height = CFG.VH;
      this.foreCv.width = CFG.VW; this.foreCv.height = CFG.VH;
      this.bandCv.width = CFG.VW;
    }
    const sc = this.skyCv.getContext("2d");
    sc.setTransform(1, 0, 0, 1, 0, 0); sc.clearRect(0, 0, CFG.VW, CFG.VH);
    this.sky(sc, this.def.id);
    const bc = this.bandCv.getContext("2d");
    bc.setTransform(1, 0, 0, 1, 0, 0); bc.clearRect(0, 0, CFG.VW, 230);
    bc.fillStyle = grad(bc, 0, 0, 0, 216,
      [[0, "rgba(2,5,12,0)"], [.62, "rgba(2,5,12,.22)"], [1, "rgba(2,5,12,.5)"]]);
    bc.fillRect(0, 0, CFG.VW, 216);
    const fc = this.foreCv.getContext("2d");
    fc.setTransform(1, 0, 0, 1, 0, 0); fc.clearRect(0, 0, CFG.VW, CFG.VH);
    fc.fillStyle = rgba(this.def.tint, this.def.tintA * .5);
    fc.fillRect(0, 0, CFG.VW, CFG.VH);
    const g = fc.createRadialGradient(CFG.VW / 2, CFG.VH * .48, CFG.VH * .3, CFG.VW / 2, CFG.VH * .5, CFG.VH * .92);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(.62, "rgba(0,0,0,.2)"); g.addColorStop(1, "rgba(0,0,0,.68)");
    fc.fillStyle = g; fc.fillRect(0, 0, CFG.VW, CFG.VH);
  },
  drawBack(c, cam, q) {
    const d = this.def, id = d.id;
    c.drawImage(this.skyCv, 0, 0);
    if (id === "rainline" && this.flash > 0) { c.fillStyle = rgba("#bfe6ff", this.flash * .26 * FX.flashK); c.fillRect(0, 0, CFG.VW, CFG.GROUND); }
    const fx = -cam * PX_FAR - 60, mx = -cam * PX_MID - 130, nx = -cam * PX_NEAR - 260;
    layer(c, this.far, fx, CFG.GROUND - FAR_H + 6);
    if (id === "transit" && Math.abs(this.transitT) < 3.4) this.transport(c, fx);
    layer(c, this.mid, mx, CFG.GROUND - MID_H + 6);
    layer(c, this.near, nx, CFG.GROUND - NEAR_H + 4);
    layer(c, this.floor, nx, CFG.GROUND - 4);
    c.drawImage(this.bandCv, 0, CFG.GROUND - 190);
    this.ambient(c, cam, q);
  },
  sky(c, id) {
    let g;
    if (id === "rainline") {
      g = grad(c, 0, 0, 0, CFG.GROUND, [[0, "#050a18"], [.45, "#0c1830"], [1, "#16294a"]]);
      c.fillStyle = g; c.fillRect(0, 0, CFG.VW, CFG.VH);
    } else if (id === "transit") {
      g = grad(c, 0, 0, 0, CFG.GROUND, [[0, "#070c14"], [.6, "#0c141d"], [1, "#131e28"]]);
      c.fillStyle = g; c.fillRect(0, 0, CFG.VW, CFG.VH);
    } else if (id === "forge") {
      g = grad(c, 0, 0, 0, CFG.GROUND, [[0, "#120e0a"], [.5, "#1d1710"], [1, "#2a2015"]]);
      c.fillStyle = g; c.fillRect(0, 0, CFG.VW, CFG.VH);
    } else if (id === "solar") {
      g = grad(c, 0, 0, 0, CFG.GROUND, [[0, "#2a1f56"], [.28, "#6b3a72"], [.55, "#d2683f"], [.8, "#f2a758"], [1, "#ffd79a"]]);
      c.fillStyle = g; c.fillRect(0, 0, CFG.VW, CFG.VH);
      const sy = CFG.GROUND - 96;
      c.fillStyle = rgba("#fff0c0", .9); c.beginPath(); c.arc(CFG.VW * .68, sy, 34, 0, TAU); c.fill();
      c.fillStyle = rgba("#ffcf90", .2); c.beginPath(); c.arc(CFG.VW * .68, sy, 96, 0, TAU); c.fill();
      // second, smaller companion light — this is not our sky
      c.fillStyle = rgba("#c9d8ff", .7); c.beginPath(); c.arc(CFG.VW * .24, sy - 74, 13, 0, TAU); c.fill();
    } else {
      g = grad(c, 0, 0, 0, CFG.GROUND, [[0, "#08061a"], [.5, "#140b2a"], [1, "#22133e"]]);
      c.fillStyle = g; c.fillRect(0, 0, CFG.VW, CFG.VH);
    }
  },
  /* a light transport passing far behind the Transit Echo platform. It is
     rendered behind the platform wall and can never reach a competitor. */
  transport(c, fx) {
    const p = this.transitT / 3.4;                      // -1..1
    const x = CFG.VW * .5 + p * (CFG.VW + 620);
    const y = CFG.GROUND - 176;
    c.save();
    c.globalAlpha = .9;
    c.fillStyle = "#1d2c3e";
    c.fillRect(x - 300, y - 60, 600, 96);
    c.fillStyle = "#2f4a63"; c.fillRect(x - 300, y - 60, 600, 8);
    for (let i = -4; i <= 4; i++) {
      c.fillStyle = rgba("#bff0ff", .82);
      c.fillRect(x + i * 64 - 22, y - 44, 44, 30);
    }
    c.globalAlpha = 1;
    c.fillStyle = rgba("#7fe4ff", .16);
    c.fillRect(x - 320, y - 66, 640, 130);
    c.restore();
  },
  ambient(c, cam, q) {
    const id = this.def.id, t = this.t;
    const N = q === 0 ? 0 : q === 1 ? .45 : 1;
    if (N === 0) return;
    if (id === "rainline") {
      const n = (360 * N) | 0, R = this.rain;
      c.strokeStyle = rgba("#bfe0ff", .42); c.lineWidth = 1.3;
      c.beginPath();
      for (let k = 0; k < n; k++) {
        const o = k * 4;
        R[o + 1] += R[o + 2] * 78 * CFG.DT; R[o] -= R[o + 2] * 18 * CFG.DT;
        if (R[o + 1] > CFG.VH) { R[o + 1] = -12; R[o] = rnd() * (CFG.VW + 200) - 50; }
        c.moveTo(R[o], R[o + 1]); c.lineTo(R[o] + R[o + 2] * .3, R[o + 1] - R[o + 2] * 2.1);
      }
      c.stroke();
      // distant flying transports crossing the skyline
      for (let i = 0; i < 3; i++) {
        const sp = .04 + i * .022, ph = (t * sp + i * .37) % 1;
        const x = ph * (CFG.VW + 160) - 80, y = 60 + i * 46;
        c.fillStyle = rgba("#9fd8ff", .5); c.fillRect(x, y, 24, 4);
        c.fillStyle = rgba("#3fe0ff", .8); c.fillRect(x + 22, y + 1, 6, 2);
        c.fillStyle = rgba("#3fe0ff", .12); c.fillRect(x - 40, y + 1, 44, 2);
      }
      if (this.flash > .1) { c.fillStyle = rgba("#cfe8ff", this.flash * .1 * FX.flashK); c.fillRect(0, 0, CFG.VW, CFG.VH); }
    } else if (id === "transit") {
      const fl = (Math.sin(t * 13) > .82 || Math.sin(t * 3.1) > .96) ? .5 : 1;
      c.fillStyle = rgba("#bfeaff", .05 * fl);
      for (let i = 0; i < 4; i++) {
        const x = 130 + i * 240 - cam * PX_NEAR * .3;
        c.beginPath(); c.moveTo(x - 70, 0); c.lineTo(x + 70, 0); c.lineTo(x + 150, CFG.GROUND); c.lineTo(x - 150, CFG.GROUND); c.closePath(); c.fill();
      }
      // passing light trails down the tunnel
      for (let i = 0; i < 4; i++) {
        const ph = (t * .5 + i * .25) % 1;
        const x = ph * (CFG.VW + 200) - 100;
        c.fillStyle = rgba("#6fd6e0", .3 * (1 - Math.abs(ph - .5) * 1.4));
        c.fillRect(x, CFG.GROUND - 214, 90, 3);
      }
    } else if (id === "forge") {
      const S = this.sparks, n = (60 * N) | 0;
      for (let k = 0; k < n; k++) {
        const o = k * 5;
        if (S[o + 4] < 0) { if (rnd() < .012) { S[o] = 250 - cam * PX_MID; S[o + 1] = CFG.GROUND - 210; S[o + 2] = rndR(-70, 70); S[o + 3] = rndR(-40, 30); S[o + 4] = .8; } continue; }
        S[o + 4] -= CFG.DT; S[o] += S[o + 2] * CFG.DT; S[o + 1] += S[o + 3] * CFG.DT; S[o + 3] += 260 * CFG.DT;
        c.fillStyle = rgba("#ffc978", clamp(S[o + 4], 0, 1));
        c.fillRect(S[o], S[o + 1], 2.2, 2.2);
      }
      // assembly arms sweeping across the chamber
      c.save();
      c.strokeStyle = rgba("#ffab4d", .3); c.lineWidth = 6; c.lineCap = "round";
      for (let i = 0; i < 3; i++) {
        const bx = 180 + i * 330 - cam * PX_MID, by = CFG.GROUND - 250;
        const a = Math.sin(t * (.6 + i * .18) + i) * .5 - .5;
        c.beginPath(); c.moveTo(bx, by);
        c.lineTo(bx + Math.cos(a) * 62, by + Math.sin(a) * 62 + 40);
        c.lineTo(bx + Math.cos(a) * 62 + 44, by + Math.sin(a) * 62 + 82);
        c.stroke();
      }
      c.restore();
      const P = this.steam, m = (26 * N) | 0;
      for (let k = 0; k < m; k++) {
        const o = k * 5;
        P[o + 4] -= CFG.DT * .5;
        if (P[o + 4] < 0) { P[o + 4] = 2.6; P[o] = 620 - cam * PX_MID + rndR(-24, 24); P[o + 1] = CFG.GROUND - 40; P[o + 2] = rndR(-9, 9); P[o + 3] = -rndR(16, 34); }
        P[o] += P[o + 2] * CFG.DT; P[o + 1] += P[o + 3] * CFG.DT;
        const a = clamp(P[o + 4] / 2.6, 0, 1);
        c.fillStyle = rgba("#e8d8c0", a * .13);
        c.beginPath(); c.arc(P[o], P[o + 1], 12 + (1 - a) * 32, 0, TAU); c.fill();
      }
    } else if (id === "solar") {
      const M = this.motes, n = (90 * N) | 0;
      for (let k = 0; k < n; k++) {
        const o = k * 4;
        M[o + 3] += CFG.DT * .8; M[o] += (16 + Math.sin(M[o + 3]) * 10) * CFG.DT; M[o + 1] += Math.cos(M[o + 3] * .7) * 5 * CFG.DT;
        if (M[o] > CFG.VW + 10) M[o] = -10;
        // windblown digital particles: tiny squares, not dust
        c.fillStyle = rgba(k % 5 ? "#ffd9a0" : "#b06bff", .2 * M[o + 2]);
        c.fillRect(M[o] | 0, M[o + 1] | 0, 2, 2);
      }
      if (this.craftT > 0 && this.craftT < 1) {
        const x = this.craftT * (CFG.VW + 200) - 100, y = CFG.GROUND - 118;
        c.fillStyle = rgba("#3a2438", .8); c.fillRect(x, y, 34, 9);
        c.fillStyle = rgba("#ffdf9f", .7); c.fillRect(x + 30, y + 2, 12, 3);
      }
    } else if (id === "neon") {
      const P = this.steam, m = (30 * N) | 0;
      for (let k = 0; k < m; k++) {
        const o = k * 5;
        P[o + 4] -= CFG.DT * .42;
        if (P[o + 4] < 0) { P[o + 4] = 2.4; P[o] = (k % 2 ? 300 : 720) - cam * PX_NEAR + rndR(-20, 20); P[o + 1] = CFG.GROUND - 6; P[o + 2] = rndR(-7, 7); P[o + 3] = -rndR(20, 40); }
        P[o] += P[o + 2] * CFG.DT; P[o + 1] += P[o + 3] * CFG.DT;
        const a = clamp(P[o + 4] / 2.4, 0, 1);
        c.fillStyle = rgba("#a9c8f0", a * .11);
        c.beginPath(); c.arc(P[o], P[o + 1], 14 + (1 - a) * 36, 0, TAU); c.fill();
      }
      // distant robot citizens moving along the far walkway
      for (let i = 0; i < 6; i++) {
        const sp = .045 + (i % 3) * .012, dir = i % 2 ? 1 : -1;
        let ph = (t * sp + i * .17) % 1; if (dir < 0) ph = 1 - ph;
        const x = ph * (CFG.VW + 120) - 60, y = CFG.GROUND - 168 + (i % 3) * 4;
        const bob = Math.sin(t * 5 + i) * 1.2;
        c.fillStyle = rgba(i % 2 ? "#7fd8ff" : "#c79aff", .3);
        c.fillRect(x, y + bob, 5, 15);
        c.fillRect(x - 1, y - 4 + bob, 7, 5);
      }
      const fl = .75 + Math.sin(t * 9.3) * .06 + (Math.sin(t * 31) > .93 ? -.3 : 0);
      c.fillStyle = rgba("#b06bff", .05 * fl); c.fillRect(0, CFG.GROUND - 260, CFG.VW, 300);
      c.fillStyle = rgba("#3fe0ff", .035); c.fillRect(0, CFG.GROUND - 120, CFG.VW, 170);
    }
  },
  /* light wash + vignette drawn OVER the competitors */
  drawFore(c, q) {
    const d = this.def;
    c.drawImage(this.foreCv, 0, 0);
    if (d.id === "rainline" && this.flash > .3) {
      c.fillStyle = rgba("#dcefff", this.flash * .13 * FX.flashK); c.fillRect(0, 0, CFG.VW, CFG.VH);
    }
  }
};

/* ------------------------- shared paint helpers ------------------------- */
function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function vgrad(c, x, y, w, h, a, b) { c.fillStyle = grad(c, 0, y, 0, y + h, [[0, a], [1, b]]); c.fillRect(x, y, w, h); }
function windowsGrid(c, x, y, w, h, cell, col, chance, R) {
  for (let yy = y + 4; yy < y + h - 6; yy += cell) {
    for (let xx = x + 4; xx < x + w - 6; xx += cell) {
      if (R() < chance) {
        c.fillStyle = rgba(col, .25 + R() * .6);
        c.fillRect(xx, yy, cell * .55, cell * .62);
      } else { c.fillStyle = rgba("#070d18", .5); c.fillRect(xx, yy, cell * .55, cell * .62); }
    }
  }
}
function pipe(c, x, y, len, w, col, vertical) {
  c.save();
  const g = vertical ? grad(c, x, 0, x + w, 0, [[0, shade(col, -.5)], [.4, shade(col, .16)], [1, shade(col, -.42)]])
    : grad(c, 0, y, 0, y + w, [[0, shade(col, -.5)], [.4, shade(col, .16)], [1, shade(col, -.42)]]);
  c.fillStyle = g;
  if (vertical) c.fillRect(x, y, w, len); else c.fillRect(x, y, len, w);
  c.fillStyle = rgba("#000", .35);
  if (vertical) { for (let i = 0; i < len; i += 70) c.fillRect(x - 2, y + i, w + 4, 5); }
  else { for (let i = 0; i < len; i += 70) c.fillRect(x + i, y - 2, 5, w + 4); }
  c.restore();
}
/* stacked machine cargo pod */
function pod(c, x, y, w, h, col, R) {
  c.fillStyle = grad(c, x, y, x + w, y + h, [[0, shade(col, .14)], [1, shade(col, -.38)]]);
  c.fillRect(x, y, w, h);
  c.strokeStyle = rgba(shade(col, -.6), .8); c.lineWidth = 2; c.strokeRect(x + 1, y + 1, w - 2, h - 2);
  c.fillStyle = rgba(shade(col, .35), .35);
  c.fillRect(x + w * .12, y + h * .16, w * .76, h * .1);
  c.fillStyle = rgba("#3fe0ff", .28);
  c.fillRect(x + w * .12, y + h * .68, w * .3, h * .07);
}
/* holographic sign panel */
function holoSign(c, x, y, w, h, col, text) {
  c.save();
  c.fillStyle = rgba("#050a14", .8); c.fillRect(x, y, w, h);
  c.strokeStyle = rgba(col, .95); c.lineWidth = 2.4;
  c.strokeRect(x + 5, y + 5, w - 10, h - 10);
  c.shadowColor = col; c.shadowBlur = 18;
  c.strokeRect(x + 5, y + 5, w - 10, h - 10);
  c.shadowBlur = 0;
  // scanline wash
  for (let i = y + 6; i < y + h - 6; i += 4) { c.fillStyle = rgba(col, .07); c.fillRect(x + 6, i, w - 12, 2); }
  if (text) {
    c.fillStyle = rgba(col, .95);
    c.font = "bold " + Math.floor(h * .36) + "px Impact, Arial Black, sans-serif";
    c.textAlign = "center"; c.textBaseline = "middle";
    c.shadowColor = col; c.shadowBlur = 14;
    c.fillText(text, x + w / 2, y + h / 2);
    c.shadowBlur = 0; c.textAlign = "left"; c.textBaseline = "alphabetic";
  }
  c.restore();
}
/* a vertical containment pylon: purely decorative arena boundary marker */
function pylon(c, x, yTop, h, col) {
  c.fillStyle = grad(c, x, 0, x + 14, 0, [[0, "#1a2434"], [.5, "#2e3d52"], [1, "#141c28"]]);
  c.fillRect(x, yTop, 14, h);
  for (let i = 0; i < h; i += 26) { c.fillStyle = rgba(col, .5); c.fillRect(x + 3, yTop + i + 6, 8, 4); }
  c.fillStyle = rgba(col, .16); c.fillRect(x - 6, yTop, 26, h);
}
function floorStrip(c, w, col, gloss, R) {
  const H = FLOOR_H;
  vgrad(c, 0, 0, w, H, shade(col, .06), shade(col, -.62));
  for (let i = 0; i < 160; i++) {
    const x = R() * w, y = R() * (H - 8), s = 4 + R() * 26;
    c.fillStyle = rgba(R() > .5 ? "#ffffff" : "#000000", .03 + R() * .05);
    c.fillRect(x, y, s, 2 + R() * 3);
  }
  // simulation grid: a faint lattice that marks the arena as virtual
  c.strokeStyle = rgba(gloss, .07); c.lineWidth = 1;
  for (let i = 0; i < w; i += 64) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i - 30, H); c.stroke(); }
  for (let i = 6; i < 120; i += 22) { c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke(); }
  if (gloss) {
    c.fillStyle = grad(c, 0, 0, 0, 60, [[0, rgba(gloss, .2)], [1, rgba(gloss, 0)]]);
    c.fillRect(0, 0, w, 60);
  }
  c.fillStyle = rgba("#000", .45); c.fillRect(0, 0, w, 3);
}

/* ============================== BUILDERS ================================ */
const BUILDERS = [
  /* 0 — RAINLINE TOWER (rooftop above a luminous machine city) ----------- */
  function (f, m, n, fl, R) {
    for (let i = 0; i < 26; i++) {
      const w = 40 + R() * 90, h = 90 + R() * 260, x = i * 44 - 20, y = FAR_H - h;
      f.fillStyle = grad(f, 0, y, 0, FAR_H, [[0, "#101c34"], [1, "#091223"]]);
      f.fillRect(x, y, w, h);
      windowsGrid(f, x, y, w, h, 11, "#8fe4ff", .24, R);
      if (R() > .68) {
        f.fillStyle = "#3fe0ff"; f.fillRect(x + w / 2 - 1.5, y - 10, 3, 10);
        f.fillStyle = rgba("#3fe0ff", .5); f.beginPath(); f.arc(x + w / 2, y - 10, 5, 0, TAU); f.fill();
      }
    }
    f.fillStyle = grad(f, 0, FAR_H - 220, 0, FAR_H, [[0, "rgba(24,54,92,0)"], [1, "rgba(24,54,92,.75)"]]);
    f.fillRect(0, FAR_H - 220, FAR_W, 220);
    // mid: nearer rooftops, coolant tanks, relay masts
    for (let i = 0; i < 9; i++) {
      const w = 110 + R() * 150, h = 120 + R() * 150, x = i * 152 - 40, y = MID_H - h;
      m.fillStyle = grad(m, 0, y, 0, MID_H, [[0, "#152342"], [1, "#0c1526"]]);
      m.fillRect(x, y, w, h);
      windowsGrid(m, x + 6, y + 10, w - 12, h - 20, 17, "#9fe8ff", .3, R);
      m.fillStyle = "#0a1220"; m.fillRect(x - 5, y - 9, w + 10, 11);
      if (R() > .45) {
        const tx = x + 20 + R() * (w - 70), th = 42;
        m.fillStyle = "#243247"; m.fillRect(tx, y - 9 - th, 46, th);
        m.fillStyle = "#182234"; m.fillRect(tx - 4, y - 9 - th - 7, 54, 8);
        m.fillStyle = rgba("#3fe0ff", .5); m.fillRect(tx + 6, y - 9 - th * .5, 34, 3);
      }
      if (R() > .5) {
        m.strokeStyle = "#0b1522"; m.lineWidth = 2;
        m.beginPath(); m.moveTo(x + w * .7, y - 9); m.lineTo(x + w * .7 + 6, y - 62); m.stroke();
        m.fillStyle = rgba("#3fe0ff", .8); m.fillRect(x + w * .7 + 4, y - 66, 4, 4);
      }
    }
    // near: the platform parapet, vents and containment pylons
    n.fillStyle = grad(n, 0, 0, 0, NEAR_H, [[0, "#1c2c44"], [1, "#101828"]]);
    n.fillRect(0, NEAR_H - 60, NEAR_W, 60);
    for (let i = 0; i < 8; i++) {

/* ============================================================================
   SIGNAL EFFECTS — fixed-size pools. Nothing is allocated during a match.
   Every impact is rendered as light: energy ripples, holographic sparks,
   geometric pulse waves and brief signal interference. Nothing in this system
   depicts physical harm of any kind.
   ========================================================================== */
const FX = {
  MAX: 340, STRIDE: 10, p: null, n: 0,
  rings: null, RMAX: 14, RSTRIDE: 6,
  shakeX: 0, shakeY: 0, shakeMag: 0, shakeT: 0,
  hitStop: 0, flash: 0, flashCol: "#ffffff",
  shakeK: .7, flashK: .7, low: false,
  tint: "#3fe0ff",                 // colour of the competitor currently acting
  slots: [], sprites: null,

  /* --- pre-rendered sprites, one small set per energy colour in play --- */
  mkSet(col) {
    const mk = (size, stops) => {
      const cv = mkCanvas(size, size), g = cv.getContext("2d");
      const rg = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      stops.forEach(s => rg.addColorStop(s[0], s[1]));
      g.fillStyle = rg; g.fillRect(0, 0, size, size);
      return cv;
    };
    const bright = shade(col, .55);
    const spark = mk(48, [[0, "rgba(255,255,255,1)"], [.24, rgba(bright, .95)],
    [.62, rgba(col, .34)], [1, rgba(col, 0)]]);
    const flare = mk(96, [[0, "rgba(255,255,255,1)"], [.16, rgba(bright, .9)],
    [.44, rgba(col, .4)], [.8, rgba(col, .1)], [1, rgba(col, 0)]]);
    const mist = mk(64, [[0, rgba(bright, .34)], [.55, rgba(col, .15)], [1, rgba(col, 0)]]);
    /* geometric pulse burst: hot core + tapered spikes on a hex rhythm */
    const S = 160, cv = mkCanvas(S, S), g = cv.getContext("2d");
    g.translate(S / 2, S / 2);
    const core = g.createRadialGradient(0, 0, 0, 0, 0, S * .3);
    core.addColorStop(0, "rgba(255,255,255,1)");
    core.addColorStop(.34, rgba(bright, .88));
    core.addColorStop(.7, rgba(col, .3));
    core.addColorStop(1, rgba(col, 0));
    g.fillStyle = core;
    g.beginPath(); g.arc(0, 0, S * .3, 0, TAU); g.fill();
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU + .26, len = S * (i % 2 ? .3 : .48), w = S * (i % 2 ? .026 : .044);
      g.save(); g.rotate(a);
      const lg = g.createLinearGradient(0, 0, len, 0);
      lg.addColorStop(0, "rgba(255,255,255,.95)");
      lg.addColorStop(.35, rgba(bright, .6));
      lg.addColorStop(1, rgba(col, 0));
      g.fillStyle = lg;
      g.beginPath(); g.moveTo(0, -w); g.lineTo(len, 0); g.lineTo(0, w); g.closePath(); g.fill();
      g.restore();
    }
    /* hex shard — a fragment of the projection field */
    const HS = 36, hv = mkCanvas(HS, HS), h = hv.getContext("2d");
    h.translate(HS / 2, HS / 2);
    h.beginPath();
    for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; const x = Math.cos(a) * HS * .42, y = Math.sin(a) * HS * .42; i ? h.lineTo(x, y) : h.moveTo(x, y); }
    h.closePath();
    h.fillStyle = rgba(col, .5); h.fill();
    h.strokeStyle = rgba(bright, .95); h.lineWidth = 2.4; h.stroke();
    return { spark, flare, mist, burst: cv, shard: hv, col };
  },
  colorSlot(col) {
    col = col || this.tint;
    let i = this.slots.indexOf(col);
    if (i >= 0) return i;
    if (this.slots.length >= 8) return 0;              // hard cap: never grows
    this.slots.push(col);
    this.sprites.push(this.mkSet(col));
    return this.slots.length - 1;
  },
  init() {
    if (this.p) return;
    this.p = new Float32Array(this.MAX * this.STRIDE);   // x,y,vx,vy,life,max,size,type,rot,colour
    this.rings = new Float32Array(this.RMAX * this.RSTRIDE); // x,y,life,max,power,colour
    this.slots = []; this.sprites = [];
    this.colorSlot("#ffffff");                          // slot 0 — neutral white
    ROSTER.forEach(d => this.colorSlot(d.core));        // one set per competitor
  },
  applySettings() {
    const s = Store.data;
    this.shakeK = s.reduced ? 0 : clamp(s.shake, 0, 1);
    this.flashK = s.reduced ? Math.min(.25, clamp(s.flashK, 0, 1)) : clamp(s.flashK, 0, 1);
    this.low = !!(s.lowFx || s.reduced);
  },
  clear() {
    this.n = 0; this.shakeMag = 0; this.hitStop = 0; this.flash = 0;
    this.shakeX = this.shakeY = 0;
    for (let i = 0; i < this.RMAX; i++) this.rings[i * this.RSTRIDE + 2] = 0;
  },
  spawn(x, y, vx, vy, life, size, type, cs) {
    /* rollback replays frames that already happened: emitting their particles
       again would multiply every effect by the number of resimulations */
    if (window.SCNet && SCNet.resim) return;
    const S = this.STRIDE;
    if (this.n >= this.MAX) { this.n = this.MAX - 1; this.p.copyWithin(0, S); }
    const o = this.n * S, P = this.p;
    P[o] = x; P[o + 1] = y; P[o + 2] = vx; P[o + 3] = vy;
    P[o + 4] = life; P[o + 5] = life; P[o + 6] = size; P[o + 7] = type; P[o + 8] = rnd() * TAU;
    P[o + 9] = cs || 0;
    this.n++;
  },
  ring(x, y, power, cs) {
    const S = this.RSTRIDE;
    for (let i = 0; i < this.RMAX; i++) {
      const o = i * S;
      if (this.rings[o + 2] <= 0) {
        this.rings[o] = x; this.rings[o + 1] = y; this.rings[o + 2] = .28; this.rings[o + 3] = .28;
        this.rings[o + 4] = power; this.rings[o + 5] = cs || 0; return;
      }
    }
  },
  /* a technique connecting: energy ripple + holographic sparks + pulse wave */
  hit(x, y, dir, power, blocked, quality) {
    const q = (this.low ? .35 : 1) * (quality === 0 ? .4 : quality === 1 ? .75 : 1);
    const P = clamp(power, .2, 1.2);
    const cs = this.colorSlot(this.tint);
    if (blocked) {
      for (let i = 0; i < Math.round(9 * q); i++) {
        const a = rndR(-1.1, 1.1) + (dir > 0 ? 0 : PI);
        const sp = rndR(90, 260);
        this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 30, rndR(.14, .34), rndR(5, 12), 2, cs);
      }
      this.spawn(x, y, 0, 0, .16, 46, 3, cs);           // guard field flash
      this.ring(x, y, .35, cs);
      this.shake(3.2); this.hitStop = .035;
      return;
    }
    /* stability-field flash, rotated so it reads as a directional projection */
    this.spawn(x, y, dir * 46, -20, .18 + P * .07, 96 + P * 104, 3, cs);
    this.spawn(x + dir * 8, y, dir * 24, -12, .15, 72 + P * 78, 5, cs);
    const n = Math.round((10 + P * 13) * q);
    for (let i = 0; i < n; i++) {
      const a = rndR(-1.0, 1.0) + (dir > 0 ? 0 : PI);
      const sp = rndR(120, 430) * (.55 + P);
      this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 50,
        rndR(.18, .44), rndR(7, 16) * (.7 + P), 0, cs);
    }
    /* forward light streaks along the projection axis */
    const m = Math.round((3 + P * 5) * q);
    for (let i = 0; i < m; i++) {
      const a = rndR(-.45, .45) + (dir > 0 ? 0 : PI);
      const sp = rndR(420, 900) * (.6 + P);
      this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp * .5 - 30,
        rndR(.1, .2), rndR(10, 22) * (.7 + P), 4, cs);
    }
    /* geometric field shards on the heavier techniques */
    if (!this.low && P > .55) {
      const k = Math.round(3 * q);
      for (let i = 0; i < k; i++) {
        const a = rndR(-1.2, 1.2) + (dir > 0 ? 0 : PI);

      else if (t === 3 || t === 5) { P[o + 2] *= 1 - 7 * dt; P[o + 3] *= 1 - 7 * dt; P[o + 8] += dt * 5.5; }
      else if (t === 4) { P[o + 2] *= 1 - 5.5 * dt; P[o + 3] *= 1 - 5.5 * dt; }
      else if (t === 6) { P[o + 2] *= 1 - 2.2 * dt; P[o + 3] += 240 * dt; P[o + 8] += dt * 3.4; }

    for (let i = 0; i < this.RMAX; i++) { const o = i * RS; if (this.rings[o + 2] > 0) this.rings[o + 2] -= dt; }

      this.shakeX = rndR(-k, k); this.shakeY = rndR(-k * .7, k * .7);

      const s = P[o + 6] * (t === 0 ? (.4 + a * .9) : (.5 + a * .8));

      const o = i * S; if (P[o + 7] !== 1) continue;
      const a = clamp(P[o + 4] / P[o + 5], 0, 1);
      const s = P[o + 6] * (1.4 - a * .6);
      const set = SP[P[o + 9] | 0] || SP[0];
      c.globalAlpha = a * .5;
      c.drawImage(set.mist, P[o] - s / 2, P[o + 1] - s / 2, s, s);

    for (let i = 0; i < this.RMAX; i++) {
      const o = i * RS; if (this.rings[o + 2] <= 0) continue;
      const k = 1 - this.rings[o + 2] / this.rings[o + 3];
      const r = 8 + k * (44 + this.rings[o + 4] * 58);

    c.globalAlpha = 1;
    c.restore();

  const dmg = mv.dmg * atk.mods.dmg * typeMul * scale;

    FX.hit(hx, hy, atk.dir, Math.max(mv.pow, .8), false, Game.q);
    FX.standby(this.x, CFG.GROUND, this.core);

    if (def.st === "knockdown" || def.st === "downed" || def.st === "intro" ||
      def.st === "win" || def.st === "lose") continue;
    const mv = atk.move;
    if (atk.moveT < mv.startup || atk.moveT > mv.startup + mv.active) continue;
    if (!atk.attackBox(ab)) continue;

    atk.hitDone = true;
    const lead = atk.dir > 0 ? ab[0] + ab[2] : ab[0];        // leading edge

    const hy = CFG.GROUND + clamp(ab[1] + ab[3] / 2, db[1] + 8, db[1] + db[3] - 8);

/* keep competitors from overlapping */
function separate(a, b) {
  const minD = CFG.PUSH_MIN * (a.hScale + b.hScale) / 2;
  const d = b.x - a.x;
  const ad = Math.abs(d);
  if (ad >= minD) return;
  const overlap = (minD - ad) / 2;
  const s = d >= 0 ? 1 : -1;
  const half = 30;
  let ax = a.x - s * overlap, bx = b.x + s * overlap;
  if (ax < half * a.hScale) { const push = half * a.hScale - ax; ax += push; bx += push; }
  if (bx > CFG.ARENA_W - half * b.hScale) { const push = bx - (CFG.ARENA_W - half * b.hScale); ax -= push; bx -= push; }
  if (ax < half * a.hScale) ax = half * a.hScale;
  if (bx > CFG.ARENA_W - half * b.hScale) bx = CFG.ARENA_W - half * b.hScale;
  a.x = ax; b.x = bx;
}

/* ------------------------------- rendering ------------------------------- */
Fighter.prototype.currentAnim = function () {

};
/* records the world path of the striking hand/foot during a technique so the
   projection can be drawn as a light arc — this is what sells the contact */
Fighter.prototype.captureTrail = function (J, sy) {
  const mv = this.move;
  const live = mv && mv.limb && !mv.noHit && this.moveT >= mv.startup - 3 &&
    this.moveT <= mv.startup + mv.active + 1;
  if (!live) {
    if (this.trFade > 0) this.trFade -= .18;
    if (this.trFade <= 0) this.trN = 0;
    return;

  const j = mv.limb === "hF" ? J.armF : mv.limb === "hB" ? J.armB :
    mv.limb === "fF" ? J.legF : J.legB;
  const wx = this.x + this.dir * FSCALE * j.tx;
  const wy = sy + FSCALE * j.ty;
  if (this.trN < 8) { this.trX[this.trN] = wx; this.trY[this.trN] = wy; this.trN++; }
  else {
    for (let i = 0; i < 7; i++) { this.trX[i] = this.trX[i + 1]; this.trY[i] = this.trY[i + 1]; }
    this.trX[7] = wx; this.trY[7] = wy;

Fighter.prototype.drawTrail = function (c, camX) {

  const n = this.trN, base = this.move ? clamp(this.move.pow, .3, 1) : .5;
  const hot = shade(this.core, .65);

      c.strokeStyle = pass ? hot : this.core;
      c.lineWidth = (pass ? 4.5 : 15) * t * (.55 + base);
      c.beginPath();
      c.moveTo(this.trX[i - 1] - camX, this.trY[i - 1]);
      c.lineTo(this.trX[i] - camX, this.trY[i]);

  c.restore();
};
/* a temporary holographic gadget projection (Riff). It is drawn for the
   duration of the technique and folds away with it — nothing persists. */
Fighter.prototype.drawGadget = function (c, camX, sy) {
  const mv = this.move; if (!this.gadget || !mv) return;
  const life = clamp(this.moveT / Math.max(1, mv.startup + mv.active), 0, 1);
  const a = Math.sin(life * PI) * .9;
  if (a <= .02) return;
  const j = this.trN ? { x: this.trX[this.trN - 1], y: this.trY[this.trN - 1] } :
    { x: this.x + this.dir * 42, y: sy - 96 };
  const r = 14 + life * 16;
  c.save();
  c.globalCompositeOperation = "lighter";
  c.globalAlpha = a;
  c.translate(j.x - camX, j.y);
  c.rotate(this.t * 4.2);
  for (let ring = 0; ring < 2; ring++) {
    const rr = r * (1 - ring * .38);
    c.beginPath();
    for (let i = 0; i <= 6; i++) {
      const ang = i / 6 * TAU;
      const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr * .78;
      i ? c.lineTo(px, py) : c.moveTo(px, py);

    c.strokeStyle = ring ? shade(this.core, .6) : this.core;
    c.lineWidth = ring ? 1.4 : 2.4;
    c.stroke();

  c.globalAlpha = a * .5;
  c.fillStyle = this.core;
  c.beginPath(); c.arc(0, 0, r * .22, 0, TAU); c.fill();
  c.restore();
};
Fighter.prototype.draw = function (c, camX) {

  // per-competitor stance flavour on locomotion only
  const so = this.stanceOff;
  if (so && (this.anim === "idle" || this.anim === "walkF" || this.anim === "walkB")) {
    this.pose.ry += so.ry; this.pose.sp += so.sp;
    this.pose.hFx += so.hFx; this.pose.hFy += so.hFy;
    this.pose.fFx += so.fFx; this.pose.fBx += so.fBx;
  }
  const sx = this.x - camX, sy = CFG.GROUND + this.y;
  const plant = !this.air && this.st !== "lose";
  // contact shadow
  const sh = clamp(1 + this.y / 190, .25, 1);
  c.save();
  c.globalAlpha = .38 * sh;
  c.fillStyle = "#000";
  c.beginPath(); c.ellipse(sx, CFG.GROUND + 3, 42 * this.hScale * sh, 9 * sh, 0, 0, TAU); c.fill();
  c.restore();
  // a soft ground glow in the competitor's own energy colour
  if (!FX.low) {
    c.save();
    c.globalCompositeOperation = "lighter";
    c.globalAlpha = .2 * sh;
    const g = c.createRadialGradient(sx, CFG.GROUND + 2, 0, sx, CFG.GROUND + 2, 56 * this.hScale);
    g.addColorStop(0, rgba(this.core, .5)); g.addColorStop(1, rgba(this.core, 0));
    c.fillStyle = g;
    c.beginPath(); c.ellipse(sx, CFG.GROUND + 2, 56 * this.hScale, 13, 0, 0, TAU); c.fill();
    c.restore();
  }

  c.save();
  c.translate(sx, sy);
  c.scale(this.dir < 0 ? -FSCALE : FSCALE, FSCALE);
  const J = drawPosed(c, this.atlas, this.pose, plant);
  this.captureTrail(J, sy);

    c.globalCompositeOperation = "lighter";
    c.globalAlpha = clamp(this.flashT * 6, 0, 1) * .55;
    drawPosed(c, this.atlas, this.pose, plant);

    c.restore();

/* ============================================================================
   AI — plays through the exact same input struct as a human.
   It observes a DELAYED snapshot of the world (reaction time), so it can never
   react to an attack on the frame it starts, and it is bound by the same
   recovery, blockstun and hit rules as the player.
   ========================================================================== */
const AI_LEVELS = {
  easy: {
    name: "Easy", react: 26, decide: 30, block: .18, aggr: .26, spacing: 1.4,
    punish: .06, antiAir: .08, comboMax: 1, jump: .04, wander: .55, throwaway: .5,
    dmg: .62, low: .08, rest: .38
  },
  medium: {
    name: "Medium", react: 14, decide: 17, block: .52, aggr: .5, spacing: 1.12,
    punish: .38, antiAir: .36, comboMax: 2, jump: .11, wander: .32, throwaway: .2,
    dmg: .85, low: .2, rest: .16
  },
  hard: {
    name: "Hard", react: 8, decide: 10, block: .84, aggr: .7, spacing: .94,
    punish: .8, antiAir: .74, comboMax: 3, jump: .18, wander: .12, throwaway: .06,
    dmg: 1, low: .3, rest: .04

};
const SNAP_LEN = 40;

function AI(fighter, levelKey, boost) {
  this.f = fighter;
  this.setLevel(levelKey, boost);
  this.out = { l: 0, r: 0, u: 0, d: 0, a: 0, s: 0, k: 0, f: 0 };
  this.hold = 0; this.holdKey = null; this.decT = 0; this.intent = "neutral";
  this.intentT = 0; this.comboLeft = 0;
  this.snapX = new Float32Array(SNAP_LEN);
  this.snapPhase = new Float32Array(SNAP_LEN);   // 0 none, 1 startup, 2 active, 3 recovery
  this.snapAir = new Float32Array(SNAP_LEN);
  this.snapGuard = new Float32Array(SNAP_LEN);   // 0 any 1 low 2 high
  this.snapSt = new Float32Array(SNAP_LEN);      // 1 = stunned/downed
  this.head = 0; this.filled = 0;
}
AI.prototype.setLevel = function (k, boost) {
  const L = AI_LEVELS[k] || AI_LEVELS.medium;
  this.key = k; this.L = L;
  const b = boost || 0;                              // Endless Path scaling 0..1
  this.react = Math.max(4, Math.round(L.react * (1 - b * .55)));
  this.decide = Math.max(6, Math.round(L.decide * (1 - b * .45)));
  this.block = clamp(L.block + b * .35, 0, .96);
  this.aggr = clamp(L.aggr + b * .3, 0, .95);
  this.punish = clamp(L.punish + b * .4, 0, .95);
  this.antiAir = clamp(L.antiAir + b * .4, 0, .9);
  this.comboMax = Math.min(3, L.comboMax + (b > .5 ? 1 : 0));
  this.throwaway = Math.max(0, L.throwaway - b * .3);
  this.lowChance = clamp((L.low || .15) + b * .25, 0, .55);
  this.rest = Math.max(0, (L.rest || .1) - b * .12);
  this.lowBias = 0;
};
AI.prototype.observe = function (opp) {
  const i = this.head;
  this.snapX[i] = opp.x;
  let ph = 0, guard = 0;
  if (opp.move) {
    const mv = opp.move;
    ph = opp.moveT < mv.startup ? 1 : opp.moveT <= mv.startup + mv.active ? 2 : 3;
    guard = mv.guard === "low" ? 1 : mv.guard === "high" ? 2 : 0;
  }
  this.snapPhase[i] = ph; this.snapGuard[i] = guard;
  this.snapAir[i] = opp.air ? 1 : 0;
  this.snapSt[i] = (opp.st === "hit" || opp.st === "knockdown" || opp.st === "downed" ||
    opp.st === "blockstun" || opp.st === "getup") ? 1 : 0;
  // if the player keeps guarding, start reaching for low attacks
  if (opp.st === "blockstun") this.lowBias = Math.min(1, this.lowBias + .3);
  else this.lowBias = Math.max(0, this.lowBias - .004);

AI.prototype.past = function (arr) {

AI.prototype.update = function (dt, opp) {
  const f = this.f, o = this.out;
  this.observe(opp);
  o.l = o.r = o.u = o.d = o.a = o.s = o.k = o.f = 0;
  if (f.st === "intro" || f.st === "win" || f.st === "lose") { f.setInput(o); return; }

  const oppX = this.past(this.snapX), phase = this.past(this.snapPhase);
  const oppAir = this.past(this.snapAir), guard = this.past(this.snapGuard);
  const oppStunned = this.past(this.snapSt);
  const dist = Math.abs(oppX - f.x);
  const toward = oppX > f.x ? 1 : -1;
  const towardKey = toward > 0 ? "r" : "l";
  const awayKey = toward > 0 ? "l" : "r";
  const reach = 118 * f.hitboxScale();

  /* ---- reactive layer (runs every frame, but on DELAYED information) ---- */
  // block incoming attacks
  if (phase === 1 || phase === 2) {
    if (dist < reach * 1.7 && srnd() < this.block * .5 + .35 && srnd() < this.block) {
      o[awayKey] = 1;
      // guess the guard height; better players guess right more often
      const wantLow = guard === 1;
      const correct = srnd() < (.45 + this.block * .55);
      o.d = (correct ? wantLow : !wantLow) ? 1 : 0;

    }

  if (oppAir && dist < reach * 1.3 && srnd() < this.antiAir * .16) {

  this.decT -= dt * 60;

    if (dist < reach * .95 && punishable && srnd() < this.punish) {

    } else if (dist < reach * this.L.spacing) {

      else if (srnd() < this.aggr) { this.intent = "attack"; this.comboLeft = 1 + (srnd() < .5 ? this.comboMax - 1 : 0); }
      else if (srnd() < .3) this.intent = "retreat";

      if (srnd() < this.aggr * .8) this.intent = "approach";
      else if (srnd() < this.L.wander) this.intent = "retreat";
      else this.intent = "approach";

  /* ---- act ---- */
  switch (this.intent) {
